# The ONLY rig that runs the real Rust audio loader against the real C++ collector over real
# files. Everything else that touches the async load path drives a stub.
#
# `run` is a script rather than a cargo invocation because the harness's C++ object closure has to be
# rebuilt first, which cargo does not track. The script builds the harness once and runs the fixture
# card through it: every sample loads twice in process, synchronously as the reference and then
# through the loader, and the two must agree. It needs no song corpus — it generates its own WAVs and packs them with
# mtools — so unlike the sibling golden_vt_render gates it can run anywhere.
[[harness]]
name = "audio-load-ab"
path = "."
kind = "differential"
status = "gate"
gates = "the async Rust audio loader must load every file the SAME way the synchronous C++ card path does, loaded in the same process as the reference -- identical chosen path (regular vs alternate dir, including the case where the alternate dir IS the file's own directory and the two candidates stringify identically), identical byteDepth/numChannels/audioDataStartPosBytes/audioDataLengthBytes and the rest of the parsed geometry, identical bytes read back through the Sample's own stream, and the identical Error identity on a failure. Also pins that no load leaves a half-built zero-geometry object or a leaked reason behind, and that every case genuinely went through the collector (deferred at least once) rather than being answered synchronously. Finally, drives the converted CALLER: SampleBrowser is asked to preview one file once and then driven only by its per-tick surface, and must eventually draw -- the one check here that fails if a caller stops re-asking for a deferred load, since every other check drives the loader through the harness's own retry loop. AB-PREVIEW-STALL holds a preview's load far past the browser's 600-attempt bound and requires it to give up once: nothing pending, nothing drawn, and nothing pending again once the hold is lifted."
build = []
run = ["scripts/audio_load_ab.sh"]
requires = ["cargo", "build-embassy-hostapp", "deluge-sdk-sibling", "mtools"]
ci = "nightly"
runtime = "~5m"

# The rig that runs the real Rust prefix channel against the real C++ song browser over real files.
#
# `run` is a script rather than a cargo invocation because the harness's C++ object closure has to be
# rebuilt first, which cargo does not track. The script builds the harness once, draws the fixture
# card's artwork through the prefix channel, and holds every song to an in-process reference decode of
# the same file.
#
# Runs without a song corpus (the fixture writes its own songs). With DELUGE_SONG_CORPUS set it also
# stages up to 16 real songs as extra cases, which is the only part of it that sees documents nobody
# here wrote -- worth passing locally, not required.
[[harness]]
name = "song-preview-ab"
path = "."
kind = "differential"
status = "gate"
gates = "the Rust prefix channel must draw the SAME song artwork, and report the SAME decode outcome and error, as the same file decoded the synchronous way on the storage owner (SP-REFERENCE, in the same process) -- which is not the same requirement, because an unreadable song, a song with no artwork and a preview past the read window all draw an identical blank screen, and the two backings once disagreed about exactly that in silence (the file path called displayError, the prefix path published a failed read as an empty prefix it could not tell from an empty file). Also pins that the run genuinely went through the channel (SP-SUMMARY asyncActive=1); that the browser's own per-tick surface is what finishes a deferred preview, since the scenario calls drawSongPreview() once per song and then drives only graphicsRoutine(); that a preview read from one card is refused after an ejection, with the post-swap artwork asserted absolutely against the known second image and against a reference decode of the swapped file; and that a song whose preview falls past kSongPreviewWindow reports Truncated rather than claiming the song has no artwork, while its reference renders it. The run also drives the browser through the always-on directory channel, every run a step of the scenario's own tick machine, and check each against what its fixture implies: the listing window and selection (SONG000-008 from a 25-song folder, a window a lost cull trim once left holed), a typing prediction and its retraction, a brand-new slot name, getUnusedSlot's one-sided read, the missing-folder fallback and its creation, a listing across a remount, and a by-path open that must select a present file, and refuse an absent one with the browser still open on the listing it had. Every run must make exactly one channel request per open, since a listing that restarted would ask again, and SP-TIER requires no synchronous browser directory operation off the storage owner. SP-LISTING-STALL holds a listing's directory open far past the browser's 600-tick bound and requires it to give up with the card error: a listing begun inside the open browser leaves it open on the listing it had, and one that opens the browser closes it. SP-DX loads one DX7 bank through the prefix channel and requires it to parse to 32 patches and the fixture's first patch name, with the load finished and the browser still open. SP-PREVIEW-STALL holds a preview's prefix read far past its 600-tick bound and requires the card error, a blank image and the owed scroll-in released. SP-DX-STALL holds the bank's read the same way and requires Enter to give up once, with the load's flag cleared and the browser still open."
build = []
run = ["scripts/song_preview_ab.sh"]
requires = ["cargo", "build-embassy-hostapp", "deluge-sdk-sibling", "mtools"]
ci = "nightly"
runtime = "~5m"

