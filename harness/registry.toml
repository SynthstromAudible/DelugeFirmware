# The harness estate. `dbt harness` reads this; harness/README.md's table is
# generated from it. Every entry must state what it gates -- a harness that
# cannot say what regression it catches is one nobody can decide to delete.
#
# status: gate          -- a standing regression gate; breakage is a real signal
#         investigative -- a rig for answering a question, run on demand
#         unavailable   -- cannot run here; NOT scheduled for deletion -- see
#                          this entry's comment for why and what would change it
# ci:     pr | nightly | never

[[harness]]
name = "fs-differential"
path = "harness/rust/fs_differential"
kind = "differential"
status = "gate"
gates = "embedded-fatfs must agree with the reference FAT implementation on every filesystem operation"
build = ["fixtures/mk_fixture.sh"]
run = ["cargo", "test"]
env = { SP0_FAT32 = "fixtures/fat32.img", SP0_FAT16 = "fixtures/fat16.img" }
requires = ["cargo", "mtools"]
ci = "pr"
runtime = "~1m"

# Runs with zero args (main() short-circuits before any app boot when no --file/--wavetable is
# given -- see host_loadcheck_main.cpp), so it exercises checkProposeLoadCandidates()'s I/O-free
# policy checks and checkAudioLoadAbiAbandon()'s libdeluge/audio_load.h ownership check -- no card
# fixture, no --project, no SD-root side effects (both self-initialize the allocator/resource-manager
# they touch). The deluge_loadcheck binary also supports --project <dir> --file PATH... for the fuller
# construction-path regression net (Tier 2 for the file-loading redesign); that mode is exploratory,
# run locally against a real project directory, not wired into this gate.
#
# `build` runs sim/build_loadcheck.sh, which configures AND builds sim/build itself -- this entry must
# be self-sufficient on a clean checkout, since CI's pr-tier harness job (.github/workflows/rust.yml,
# job `harness`) never runs any sim/ cmake configure step of its own, and sim/build is gitignored (not
# restored by any cache). No `requires` probe stands in for that anymore: there is nothing left to
# precondition on.
[[harness]]
name = "audio-loadcheck"
path = "sim"
kind = "regression"
status = "gate"
gates = "AudioFileManager::proposeLoadCandidates's candidate order/count (the alternate-dir-vs-regular-path policy a real load and the async loader share) and the load invariants (no half-built cache entry, no leaked AudioFile reason) must hold -- this is what caught the dropped-bare-name-candidate regression this entry exists to pin. Also gates the libdeluge/audio_load.h C ABI's build-ownership contract: deluge_audio_load_abandon() must actually release the adopted resource-manager chunk, not just free its wrapper, or repeated begin/abandon churn (as a browser cursor move that never lands would produce) exhausts the chunk table. And, in the collector, two recoveries that must not be confused: an alternate-dir hit is decided by candidate SLOT (so a file whose own directory IS the alternate dir still records loadedFromAlternatePath, which the collect-media copy-back depends on), and a full efatfs handle table reclaims unleased residents and asks again rather than probing the alternate dir like a candidate miss."
build = ["./build_loadcheck.sh"]
run = ["./build/deluge_loadcheck"]
requires = []
ci = "pr"
runtime = "~5m"

