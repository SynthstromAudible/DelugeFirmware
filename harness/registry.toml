[[harness]]
name = "save-roundtrip"
path = "."
kind = "property"
status = "gate"
gates = "a song saved through the real SaveSongUI ENTER gesture must round-trip byte-identically (save, load it back, overwrite, compare a CRC of both writes -- a length check would miss a truncation or a reorder), the overwrite seam must prompt exactly when the target name is taken and not otherwise and must close on confirmation, and performSave must never run on the interaction tier. Two further checks guard the memory-parse conversion. SL-NOSTREAM is a SOURCE check, deliberately: the three StorageManager openers that parsed a document while streaming it off the card are deleted, and a gate cannot observe a path that is not compiled, so grepping for their return is the only way to keep them gone -- a runtime path that can block the storage owner is a reason the owner can never be removed, however rarely it runs. SL-EVICT re-runs the whole round trip with DELUGE_SIM_SDRAM_MB clamped low enough that staging a song cannot happen without the resource manager evicting cached chunks first, and requires the identical CRC: loading a song now gives up cached sample chunks it never used to, which was a decision and so gets measured rather than assumed harmless. Single-leg and self-checking: unlike the A/B gates beside it there is no second backing to diff against, because the subject is a C++ structural change rather than a Rust backing chosen by a feature -- so there is no baseline here that anyone can re-baseline into passing. The second save deliberately overwrites the SAME name: performSave writes currentSong->name = enteredText, so a different name would produce legitimately different bytes and the comparison would fail for a reason that is not a defect."
build = []
run = ["scripts/save_roundtrip.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~5m"

[[harness]]
name = "document-save-channel"
path = "."
kind = "property"
status = "gate"
gates = "a preset saved through the real ENTER gesture must be written WHOLE, both builds must write byte-identical documents, and the channel build must have stored it off the storage owner. Two legs, because one alone proves an arm ran but not that it agrees with the other -- and disagreement between the arms is the defect worth catching, which is why DS-SAVED carries a checksum compared ACROSS the legs rather than within one. DS-OCCUPIED saves onto a name that is already taken and requires both that the user is asked and that the existing document is left alone: silently replacing somebody's preset is the worst thing this code could do. This gate exists because write_file began life with NO harness building it -- exactly where the whole-file read was one rung earlier, and running that for the first time found two defects at once. Building this one found two more on its first run: the no-channel arm handed the write to a function that no longer wrote anything, and the off-owner counter this rung is measured by was never incremented."
build = []
run = ["scripts/document_save_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~10m"

[[harness]]
name = "song-load-channel"
path = "."
kind = "property"
status = "gate"
gates = "the song load must read its bytes through the storage channel, off the storage owner, and must still load a song on a build with no channel at all. Two legs, because one alone would leave either the claim or the fallback untested. SL-LOADED requires a value stamped into the song before saving -- and deliberately overwritten in memory afterwards -- to come back on BOTH legs, because nothing cheaper distinguishes a real load: the song's NAME is written by the save from what the user typed, so it matches whether or not the load happened, and its object IDENTITY is unchanged across a load that did happen. SL-CHANNEL requires the on leg to have SERVED a staging read and SL-OFFOWNER requires that read to have run off the owner; SL-GATED requires the off leg to have served zero, so the feature gate is shown to gate. This gate exists because recorder-write was the ONLY harness building async_file_write_active: the whole-file staging read had never executed anywhere, and building it here found two defects on the first run -- the arm entered on a build carrying only one of the two channels it needs, and then deferred forever. The on leg builds BOTH channel features, because the read sizes its buffer with the byte channel's stat and fills it with the write channel's read."
build = []
run = ["scripts/song_load_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~10m"

[[harness]]
name = "settings-channel"
path = "."
kind = "property"
status = "gate"
gates = "a settings value written through the real consumer entry point must survive a read back, and no settings file operation may begin on the interaction tier. Two halves on purpose, and only the second one changes across the conversion: the round trip passes before AND after, so it is what catches a conversion that moved the I/O and broke the settings on the way, while SC-TIER is deliberately non-zero before the conversion and zero after, which is the only thing that proves anything moved. Rung 6 is why: its round trip passed identically before and after, so the tier count going 3 -> 0 was the entire proof, and a gate with only a round trip would have reported success for a conversion that never happened. The count is taken inside the consumer's own I/O path rather than at the point of dispatch, so it cannot report success for an operation that dispatched and then ran inline anyway."
build = []
run = ["scripts/settings_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~4m"

[[harness]]
name = "startup-failsafe"
path = "."
kind = "property"
status = "gate"
gates = "no file operation in the startup song fail-safe may begin on the interaction tier. SF-TIER is the evidence and is deliberately non-zero before the conversion, so the gate fails then; the transition to zero is the only thing that proves anything moved. SF-CHANNEL is required non-zero on the channel-on leg only, because with the byte channel absent every operation falls back to the owner arm and that fallback is correct and silent -- a channel that never worked would leave this gate green, which is exactly what the settings gate shipped on its first channel-on run. The fail-safe's happy path ends in openUI and this harness has no UI stack, so the scenario drives the song-missing path: the canary creation, the existence checks and the cleanup unlink, then a return before the UI. Which tier those run on does not depend on which branch reached them."
build = []
run = ["scripts/startup_failsafe.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~4m"

[[harness]]
name = "path-operations"
path = "."
kind = "property"
status = "gate"
gates = "real SysEx path requests must still get their ^verb replies, a nested path with every segment missing must be created by one request and a second creation of an existing path must succeed, and no browser folder creation may begin on the interaction tier. Replies are captured from a loopback MIDICable rather than inferred from the filesystem: asserting the effect alone would pass for a conversion that stopped replying, which is exactly what deferring a reply risks. PO-CHANNEL carries more weight here than on any earlier gate -- smsysex is already owner-dispatched, so its tier count reads zero on both sides of the conversion and the served count is the whole of its evidence."
build = []
run = ["scripts/path_operations.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~4m"

[[harness]]
name = "offset-io"
path = "."
kind = "property"
status = "gate"
gates = "three blocks written at ascending offsets through the real SysEx transfer verbs must all still be on the card, a copy must reproduce its source byte-for-byte, and copying a missing source must report an error. THREE blocks and not one is the whole point: efatfs_core::create_context truncates unconditionally, so a write_at that re-opened that way would leave only the last block, and a single-block round trip would pass against exactly that bug. The missing-source case is load-bearing for the same class of reason -- without a case whose expected answer is an error, a handler replying before its operation completed reports the same err=0 a correct one does. Unlike its neighbours this gate PASSES before the conversion, because smsysex is already owner-dispatched and has no tier transition to show; the evidence is OI-CHANNEL going non-zero."
build = []
run = ["scripts/offset_io.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~4m"

[[harness]]
name = "recorder-write"
path = "."
kind = "property"
status = "gate"
gates = "a real recording must still read back byte-correctly -- mid-recording, finalized multi-cluster, and through the alteration transform -- while its per-cluster write is served asynchronously and all THREE of its owner dispatches are gone: the drain, the finish, and the file creation. Three counters, because they answer three separate questions and none can be inferred from the served count, which says operations went through the channel but not where the caller was standing. Each reads zero the moment its own dispatch is restored. RW-ROUNDTRIP is not ceremony either -- a recycled stream handle collecting a previous recorder's answer reported a cluster as written when nothing had been, and only the byte-level readback noticed. The off-owner cases exist because the eleven on-fiber ones cannot reach these shapes: the oracle is dispatched onto the fiber wholesale, so all eleven measure on_owner=1 and take the synchronous arm, and the three byte-exact alterFile cases call that function DIRECTLY with allowFileAlterationAfter never set -- so before an off-owner alteration case existed, the batch machine had no coverage at all. TWO GAPS ARE KNOWN AND DELIBERATE. RW-LEAK checks an aborted recording gives its clusters back but does NOT catch a premature unlink, because single-flight sends that unlink down its synchronous arm regardless, so that ordering holds by construction rather than by observation. And the stem-export folder search is verified on its SYNCHRONOUS ARM ONLY: it is exercised by the offline golden render, which runs on the owner. An off-owner stem case was attempted and abandoned -- routing a harness recording down the stem path needs more engine state than processStarted plus currentStemExportType plus lastFolderNameForStemExport, and a case that silently records to RESAMPLE while calling itself a stem case is worse than none."


build = []
run = ["scripts/recorder_write.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~10m"
