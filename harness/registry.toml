[[harness]]
name = "save-roundtrip"
path = "."
kind = "property"
status = "gate"
gates = "a song saved through the real SaveSongUI ENTER gesture must round-trip byte-identically (save, load it back, overwrite, compare a CRC of both writes -- a length check would miss a truncation or a reorder), and the overwrite seam must prompt exactly when the target name is taken and not otherwise and must close on confirmation. Two further checks guard the memory-parse conversion. SL-NOSTREAM is a SOURCE check, deliberately: the three StorageManager openers that parsed a document while streaming it off the card are deleted, and a gate cannot observe a path that is not compiled, so grepping for their return is the only way to keep them gone -- a runtime path that can block the storage owner is a reason the owner can never be removed, however rarely it runs. SL-EVICT re-runs the whole round trip with DELUGE_SIM_SDRAM_MB clamped low enough that staging a song cannot happen without the resource manager evicting cached chunks first, and requires the identical CRC: loading a song now gives up cached sample chunks it never used to, which was a decision and so gets measured rather than assumed harmless. Single-leg and self-checking: unlike the A/B gates beside it there is no second backing to diff against, because the subject is a C++ structural change rather than a Rust backing chosen by a feature -- so there is no baseline here that anyone can re-baseline into passing. The second save deliberately overwrites the SAME name: the save records the name it was dispatched with as the song's name, so a different name would produce legitimately different bytes and the comparison would fail for a reason that is not a defect."
build = []
run = ["scripts/save_roundtrip.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~5m"

[[harness]]
name = "document-save-channel"
path = "."
kind = "property"
status = "gate"
gates = "a preset saved through the real ENTER gesture must be written WHOLE, read back through the channel (DS-VERIFIED, DS-VERIFY-ARM), and stored off the storage owner. One leg: the write channel has no feature switch, so the arm the old second leg compared against no longer exists. DS-OCCUPIED saves onto a name that is already taken and requires both that the user is asked and that the existing document is left alone: silently replacing somebody's preset is the worst thing this code could do. This gate exists because write_file began life with NO harness building it -- exactly where the whole-file read was one rung earlier, and running that for the first time found two defects at once. Building this one found two more on its first run: the no-channel arm handed the write to a function that no longer wrote anything, and the off-owner counter this rung is measured by was never incremented. DS-BACKMIDSAVE and DS-EXITMIDSAVE press BACK and fire the long-press exit while the save is still running, and require the save screen to stay open: a save spans ticks with the UI live, and leaving its screen mid-save once let the save's own close() read below the bottom of the UI stack. Both first require that the save really is still in flight, so a save that finished early fails the check instead of passing it for free. DS-GUARD-SONG dispatches a preset save while a song save's collection or document machine is still running with the save guard already released, and requires the dispatch refused and the song document whole: the shared serialiser holds the song's staged document for that whole window. DS-ACCOUNTED removes a preset's file between its write landing and its read-back's first answer, and requires the one answer the channel gave -- NOT_FOUND, which fails the save -- to be counted as served: counting only the ticks that advanced undercounted every failed read-back. DS-OVERWRITE saves onto the preset's own name again, confirms the prompt, and requires the document written to <target>.tmp, verified there and swapped into place, with no temp file left. DS-OVERWRITE-FAIL does the same and truncates that temp file between its write landing and its read-back, and requires the save failed, the document it was replacing byte-for-byte intact, and the temp file removed: a confirmed overwrite used to rewrite its target in place, so a failed write or read-back destroyed the old document. Both run last, because DS-GUARD and DS-KITROW count staged saves absolutely."
build = []
run = ["scripts/document_save_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~10m"

[[harness]]
name = "sample-collect-channel"
path = "."
kind = "property"
status = "gate"
gates = "a song saved with collect-media on must land every sample it references in its own folder, byte-identical to the source, and must leave the audio-file list sorted and every resident file still findable. One leg: every transfer rides the byte channel off the owner, and the save around it stages its document through the write channel; neither channel has a feature switch. SC-ORDERED is the reason this gate is worth its runtime -- the collection walks a container the audio engine and the UI both read, mutating the very key it is SORTED BY, and the old code was safe from that only ACCIDENTALLY, because the whole walk was one uninterrupted call on the owner. Take the owner away and the accident goes with it. A green SC-ORDERED proves nothing by itself, though: what proves the snapshot is load-bearing is the neutering that mutates filePath during the PLAN walk instead of the APPLY pass, which must turn SC-ORDERED red. On its first run this gate found three defects -- transfers had no owner arm at all so a channel-free build could never collect anything, the collected path was built by APPENDING to an empty string and took the filesystem down, and the check itself asked the wrong question twice over."
build = []
run = ["scripts/sample_collect_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~10m"

# The one rig that loads a whole song, and presets, through the model tree's sample loads and checks where every
# holder's file came from. Its fixture documents are written by the firmware inside the scenario, never by hand.
# It also prints a trace of every call into the load path's leaf functions (LT lines), which the script writes to
# $SAMPLE_LOAD_TREE_TRACE when set, so a restructuring of the load path can be compared call for call.
[[harness]]
name = "sample-load-tree"
path = "."
kind = "property"
status = "gate"
gates = "a song with a sample synth, a wavetable, a sample kit drum and an audio clip, saved with collected media, must load back with each holder bound to its collected copy in the song's folder once the originals are gone, and with the audio clip's still-resident sample claimed from memory and the clip named after it. A synth preset and a kit preset whose samples exist only in the preset's own folder must load with each holder's path rewritten to that folder. An abort raised after the kit preset's first drum binds must stop the load with ABORTED_BY_USER and leave the second drum empty. A song loaded while playback runs must take the crucial-only pass, binding a sound only when its track's active clip is playing, a kit drum only when its row is unmuted and has notes, and every audio clip that is its track's active clip, and must then finish after its armed swap with every holder bound to its collected copy. Each load's routineWithClusterLoading count is reported. The crucial load, the full song, the synth preset and the kit preset with its abort must then each load again through AsyncSampleLoad, ticked from the interaction tier with every file it binds dropped from memory first, and end as the blocking load did: the same holders bound to the same files, the kit's load stopped by its abort, and no sample read from the card or folder probed on the interaction tier. The song must also load when the folder's exists probe is held until every sample request has come back, and when the card is ejected while the probe is out the load must end on the unusable card, with a second load on the same context binding everything once the card is back."
build = []
run = ["scripts/sample_load_tree.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~5m"

[[harness]]
name = "song-save-channel"
path = "."
kind = "property"
status = "gate"
gates = "a song save must build its whole document in memory and place it on the card off the storage owner, then read it back and check its length, head and tail. One leg: neither channel has a feature switch, so the document write rides the write channel and every other step the byte channel, all OFF the owner, with nothing sent to the owner (SS-ACCOUNTED). The document write uses a DIFFERENT channel from the rest of the flow, and that is the whole difficulty: the byte channel copies into a fixed staging buffer and refuses anything over 8 KiB, and no song has ever fitted it -- the smallest measured is 11.5 KB and the largest 1.10 MB. SS-GREW is what keeps the rest honest, because the default harness song is about 11.5 KB against a 32 KB initial buffer and a save of it never grows the buffer at all; the fixture is inflated to 100 KB and SS-GREW fails if it stops being big enough. SS-PARSES loads the result back as a song, because bytes of the right length are not the claim. SS-INTACT requires that overwriting an existing song leaves a song behind whichever way the save went, which is the property that justifies writing to a temp name and renaming. SS-BACKMIDSAVE and SS-EXITMIDSAVE press BACK and fire the long-press exit while the save is still running, and require the save screen to stay open: leaving it mid-save once let the save's own close() read below the bottom of the UI stack. Both first require that the save really is still in flight, so a save that finished early fails the check instead of passing it for free."
build = []
run = ["scripts/song_save_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~12m"

[[harness]]
name = "song-load-channel"
path = "."
kind = "property"
status = "gate"
gates = "the song load must read its bytes through the storage channel, off the storage owner, One leg: the write channel has no feature switch. SL-LOADED requires a value stamped into the song before saving -- and deliberately overwritten in memory afterwards -- to come back, because nothing cheaper distinguishes a real load: the song's NAME is written by the save from what the user typed, so it matches whether or not the load happened, and its object IDENTITY is unchanged across a load that did happen. SL-CHANNEL requires a staging read to have been SERVED and SL-OFFOWNER requires that read to have run off the owner. This gate exists because recorder-write was the ONLY harness building async_file_write_active: the whole-file staging read had never executed anywhere, and building it here found two defects on the first run -- the arm entered on a build carrying only one of the two channels it needs, and then deferred forever. The read sizes its buffer with the byte channel's stat and fills it with the write channel's read, and both are always on."
build = []
run = ["scripts/song_load_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~10m"

[[harness]]
name = "settings-channel"
path = "."
kind = "property"
status = "gate"
gates = "a settings value written through the real consumer entry point must survive a read back, and no settings file operation may begin on the interaction tier. Two halves on purpose, and only the second one changes across the conversion: the round trip passes before AND after, so it is what catches a conversion that moved the I/O and broke the settings on the way, while SC-TIER is deliberately non-zero before the conversion and zero after, which is the only thing that proves anything moved. Rung 6 is why: its round trip passed identically before and after, so the tier count going 3 -> 0 was the entire proof, and a gate with only a round trip would have reported success for a conversion that never happened. The count is taken inside the consumer's own I/O path rather than at the point of dispatch, so it cannot report success for an operation that dispatched and then ran inline anyway."
build = []
run = ["scripts/settings_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~4m"


[[harness]]
name = "favourites-channel"
path = "."
kind = "property"
status = "gate"
gates = "the favourites bank must never be written with less than it held, and none of its card I/O may begin on the interaction tier. Every browser visit, favourite pad and bank pad reaches this bank, and before this gate existed a failed existence check read as absent and wrote an EMPTY bank over the real one, and an edit on a bank that never loaded saved one favourite over the other fifteen. FV-ABSENT requires opening a bank with no file to leave no file; FV-REFUSE requires an edit made while the bank is loading to change and write nothing; FV-ORDER requires a save made just before switching away and back to land before the bank is read again; FV-STALE requires an answer that arrives after another bank was selected never to be applied, and first requires that answer to have been issued at all, or it proves nothing. One leg: the byte channel has no feature switch, and FV-CHANNEL requires the bank's operations to have gone through it. Every wait is on the bank going idle, never on a file appearing."
build = []
run = ["scripts/favourites_channel.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~5m"

[[harness]]
name = "startup-failsafe"
path = "."
kind = "property"
status = "gate"
gates = "no file operation in the startup song fail-safe may begin on the interaction tier. SF-TIER is the evidence and is deliberately non-zero before the conversion, so the gate fails then; the transition to zero is the only thing that proves anything moved. SF-CHANNEL is required non-zero, because a channel that is compiled but never runs would otherwise leave this gate green -- exactly what the settings gate shipped on its first channel-on run. The fail-safe's happy path ends in openUI and this harness has no UI stack, so the scenario drives the song-missing path: the canary creation, the existence checks and the cleanup unlink, then a return before the UI. Which tier those run on does not depend on which branch reached them."
build = []
run = ["scripts/startup_failsafe.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~4m"

[[harness]]
name = "path-operations"
path = "."
kind = "property"
status = "gate"
gates = "real SysEx path requests must still get their ^verb replies, a nested path with every segment missing must be created by one request and a second creation of an existing path must succeed, no browser folder creation or delete may begin on the interaction tier, and a file deleted from a browser must go through the byte channel. Replies are captured from a loopback MIDICable rather than inferred from the filesystem: asserting the effect alone would pass for a conversion that stopped replying, which is exactly what deferring a reply risks. PO-CHANNEL carries more weight here than on any earlier gate -- smsysex is already owner-dispatched, so its tier count reads zero on both sides of the conversion and the served count is the whole of its evidence. PO-OWNER-FALLBACK runs a folder read on the storage owner, entered on a missing folder whose default folder is missing too, and requires the default folder created and listed: every shipped listing with a default folder runs off the owner, so nothing else reaches that arm, and with the directory channel switched on it once skipped the creation because the synchronous open ignores the channel's create flag. The delete stages drive the real delete menu in a save browser listing PO_TEST/DELETE: PO-DELETE requires the removal pending on the byte channel, with BACK, a pad and the select encoder refused meanwhile, and then the file gone from the card and the list; PO-DELETE-ABSENT requires a listed file already gone to end as missing and stay listed; PO-DELETE-STALL requires a removal the channel never answers to end as failed with the file listed and the menu closed."
build = []
run = ["scripts/path_operations.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~4m"

[[harness]]
name = "offset-io"
path = "."
kind = "property"
status = "gate"
gates = "three blocks written at ascending offsets through the real SysEx transfer verbs must all still be on the card, a copy must reproduce its source byte-for-byte, and copying a missing source must report an error. THREE blocks and not one is the whole point: efatfs_core::create_context truncates unconditionally, so a write_at that re-opened that way would leave only the last block, and a single-block round trip would pass against exactly that bug. The missing-source case is load-bearing for the same class of reason -- without a case whose expected answer is an error, a handler replying before its operation completed reports the same err=0 a correct one does. Unlike its neighbours this gate PASSES before the conversion, because smsysex is already owner-dispatched and has no tier transition to show; the evidence is OI-CHANNEL going non-zero. OI-DIR-STALL holds a directory listing's open far past the handler's 600-tick bound and requires a timeout reply (15) with no entries, and OI-TIER requires that SMSysex opened no directory synchronously off the storage owner."
build = []
run = ["scripts/offset_io.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~4m"

[[harness]]
name = "recorder-write"
path = "."
kind = "property"
status = "gate"
gates = "a real recording must still read back byte-correctly -- mid-recording, finalized multi-cluster, and through the alteration transform -- while its per-cluster write is served asynchronously and all THREE of its owner dispatches are gone: the drain, the finish, and the file creation. Three counters, because they answer three separate questions and none can be inferred from the served count, which says operations went through the channel but not where the caller was standing. Each reads zero the moment its own dispatch is restored. RW-ROUNDTRIP is not ceremony either -- a recycled stream handle collecting a previous recorder's answer reported a cluster as written when nothing had been, and only the byte-level readback noticed. The off-owner cases exist because the eight on-fiber ones cannot reach these shapes: the oracle is dispatched onto the fiber wholesale, so all eight measure on_owner=1 and take the synchronous arm, and none of them sets allowFileAlterationAfter -- so the off-owner alteration case is the batch machine's only coverage. TWO GAPS ARE KNOWN AND DELIBERATE. RW-LEAK checks an aborted recording gives its clusters back but does NOT catch a premature unlink, because single-flight sends that unlink down its synchronous arm regardless, so that ordering holds by construction rather than by observation. And the stem-export folder search is verified on its SYNCHRONOUS ARM ONLY: it is exercised by the offline golden render, which runs on the owner. An off-owner stem case was attempted and abandoned -- routing a harness recording down the stem path needs more engine state than processStarted plus currentStemExportType plus lastFolderNameForStemExport, and a case that silently records to RESAMPLE while calling itself a stem case is worse than none. RW-DIR-STALL holds the recording-folder scan's directory open past the recorder's bound and requires the create to fail with a card error, with no file made and no synchronous open."


build = []
run = ["scripts/recorder_write.sh"]
requires = ["cargo", "build-embassy-hostapp"]
ci = "nightly"
runtime = "~10m"
