# The ONLY rig that runs the real Rust audio loader against the real C++ collector over real
# files. Everything else that touches the async load path drives a stub.
#
# `run` is a script rather than a cargo invocation because the comparison is across two BUILDS,
# not two passes: `deluge_audio_load_async_active()` is `cfg!(feature = "async_audio_load_active")`,
# a compile-time constant, so there is no runtime switch to flip mid-run. The script builds the
# harness with the switch off and with it on, runs the same fixture card through both, and diffs
# their per-file output. It needs no song corpus — it generates its own WAVs and packs them with
# mtools — so unlike the sibling golden_vt_render gates it can run anywhere.
[[harness]]
name = "audio-load-ab"
path = "."
kind = "differential"
status = "gate"
gates = "the async Rust audio loader and the synchronous C++ card path must load the SAME file the SAME way -- identical chosen path (regular vs alternate dir, including the case where the alternate dir IS the file's own directory and the two candidates stringify identically), identical byteDepth/numChannels/audioDataStartPosBytes/audioDataLengthBytes and the rest of the parsed geometry, identical bytes read back through the Sample's own stream, and the identical Error identity on a failure. Also pins, per leg, that no load leaves a half-built zero-geometry object or a leaked reason behind, and that the async leg genuinely went through the collector (at least one load deferred) rather than being answered synchronously. Finally, drives the converted CALLER: SampleBrowser is asked to preview one file once and then driven only by its per-tick surface, and must eventually draw -- the one check here that fails if a caller stops re-asking for a deferred load, since every other check drives the loader through the harness's own retry loop."
build = []
run = ["scripts/audio_load_ab.sh"]
requires = ["cargo", "build-embassy-hostapp", "deluge-sdk-sibling", "mtools"]
ci = "nightly"
runtime = "~5m"

# The rig that runs the real Rust prefix channel against the real C++ song browser over real files,
# and the ONLY thing that has ever executed the async preview path at all.
#
# `run` is a script rather than a cargo invocation because the comparison is across two BUILDS, not
# two passes: `deluge_file_prefix_async_active()` is `cfg!(feature = "async_file_prefix_active")`, a
# compile-time constant, so there is no runtime switch to flip mid-run. The script builds the harness
# with the switch off and with it on, draws the same fixture card's artwork through both, and diffs
# their per-song output.
#
# Runs without a song corpus (the fixture writes its own songs). With DELUGE_SONG_CORPUS set it also
# stages up to 16 real songs as extra cases, which is the only part of it that sees documents nobody
# here wrote -- worth passing locally, not required.
[[harness]]
name = "song-preview-ab"
path = "."
kind = "differential"
status = "gate"
gates = "the Rust prefix channel and the synchronous card read must draw the SAME song artwork AND report the SAME decode outcome and error for every song -- which is not the same requirement, because an unreadable song, a song with no artwork and a preview past the read window all draw an identical blank screen, and the two backings once disagreed about exactly that in silence (the file path called displayError, the prefix path published a failed read as an empty prefix it could not tell from an empty file). Also pins, per leg and PER CASE, that the prefix leg genuinely went through the channel -- every song deferred at least once, so no song was quietly answered without the async path being reached; that the browser's own per-tick surface is what finishes a deferred preview, since the scenario calls drawSongPreview() once per song and then drives only graphicsRoutine(); that a preview read from one card is refused after an ejection, with the post-swap artwork asserted absolutely against the known second image rather than merely against 'not the first'; and that a song whose preview falls past kSongPreviewWindow reports Truncated on the buffer backing rather than claiming the song has no artwork."
build = []
run = ["scripts/song_preview_ab.sh"]
requires = ["cargo", "build-embassy-hostapp", "deluge-sdk-sibling", "mtools"]
ci = "nightly"
runtime = "~5m"

