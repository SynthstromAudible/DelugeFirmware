# The Deluge file upgrader: converts a song or preset any firmware wrote into the firmware's current JSON form, so the
# firmware reads only its own current forms (a DX7 on an oscillator becomes the sound's DX7 engine).
#
# Gate upgrader:
#     the file upgrader reads a Deluge document into the tree the firmware's parser builds (attributes and child tags
#     alike, duplicate keys in order, entities, comments, empty elements), compares version stamps as the firmware does,
#     applies each conversion as official firmware loaded it, and writes the firmware's JSON (its array containers as
#     arrays, whole numbers bare)
[package]
name = "deluge-upgrade"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
thiserror = "2"
# The firmware's own WAV/AIFF header decoding, for the sample lengths and rates a zone in milliseconds needs.
# Keep the rev with src/platform/device/Cargo.toml's deluge-sdk pin.
deluge_audio_format = { package = "deluge-audio-format", git = "https://github.com/FirestormAudio/deluge-sdk.git", rev = "89303a3632391a122baded3ff12199942c046b5a" }

# A desktop tool, built on its own: not a member of the firmware's Rust workspaces.
[workspace]
