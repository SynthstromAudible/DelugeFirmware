# The workspace's cargo settings. There is no default [build] target: a plain `cargo build -p deluge_platform_device`
# builds the host binary, and `./dbt build` builds the device firmware.

# The device target (src/platform/device/armv7a-deluge-eabihf.json), linked by clang/lld with cross-language LTO. Its
# feature set matches clang's (stock armv7a-none-eabihf adds +strict-align, which blocks every cross-language inline).
# Build it with `./dbt build`, which exports CARGO_TARGET_ARMV7A_DELUGE_EABIHF_LINKER and _RUSTFLAGS from the
# discovered toolchain (device_cxx_env() in scripts/tasks/task-build.py).
[target.armv7a-deluge-eabihf]
# No `rustflags` here: the per-target RUSTFLAGS env var replaces this array rather than merging, so a partial copy
# would be a trap. The link's flags, including the app's inline threshold at the ThinLTO link, are in device_cxx_env()
# in scripts/tasks/task-build.py.
linker = "clang++"

[env]
EMBASSY_USB_MAX_INTERFACE_COUNT = "8"
