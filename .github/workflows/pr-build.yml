name: Pull Request Build

on:
  push:
    # Builds on the target branches are the baseline for the firmware size report
    branches:
      - 'synthstrom-official'
      - 'next'
      - 'release/**'
      - 'main'
  pull_request:
    branches:
      - 'next'
      - 'release/**'
      - 'main'
  merge_group:
  workflow_dispatch:

jobs:
  release-build:
    name: Build check - Release
    uses: ./.github/workflows/build.yml
    with:
      # Keep baseline builds around longer so PRs can be compared against them
      firmware-retention-days: ${{ github.event_name == 'push' && 30 || 5 }}
      build-type: 'Release'
  debug-build:
    name: Build check - Debug
    uses: ./.github/workflows/build.yml
    with:
      firmware-retention-days: 5
      build-type: 'Debug'
  # firmware-size.yml runs from workflow_run, which doesn't get the PR for forks,
  # so record it here.
  pr-metadata:
    name: Save PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Write PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir pr
          echo "$PR_NUMBER" > pr/number
          echo "$BASE_REF" > pr/base_ref
      - uses: actions/upload-artifact@v7
        with:
          name: pr-metadata
          path: pr/
          retention-days: 5
