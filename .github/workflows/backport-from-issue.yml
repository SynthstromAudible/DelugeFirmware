name: Backport from issue

# A PR that closes an issue labelled `affects: release/X.Y` gets
# `backport: release/X.Y`; backport.yml opens the cherry-pick PR after it merges.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, ready_for_review]
  pull_request:
    paths:
      - .github/labels.yml
      - .github/scripts/backport_from_issue.py
      - .github/scripts/test_backport_from_issue.py
      - .github/workflows/backport-from-issue.yml

permissions:
  contents: read

concurrency:
  group: backport-from-issue-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test backport labeling
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python .github/scripts/test_backport_from_issue.py

  label:
    name: Request backport from closed issues
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # pull_request_target checks out the base branch by default. Never add `ref:` here:
      # this job has write permissions and must not run code from the PR.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python .github/scripts/backport_from_issue.py
        env:
          GH_TOKEN: ${{ github.token }}
