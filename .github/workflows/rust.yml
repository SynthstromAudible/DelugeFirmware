name: Rust

# Lint for the Deluge Rust core (crates/), the Rust BSP (src/bsp/rust/) and the Rust
# harnesses: rustfmt and clippy, plus a check that the test registry's generated
# table is current. The tests themselves -- nextest over crates/, the BSP's host
# tests, every harness -- run from the registry in tests.yml. The bare-metal BSP
# clippy/build (armv7a-none-eabihf, needs build-std + the deluge-sdk setup) is
# left as a TODO below; wire it in once the device build is reproducible in CI.

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "next"
      - "release/**"
  merge_group:
  workflow_dispatch:

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Toolchain (nightly + components) is pinned by each rust-toolchain.toml;
      # rustup installs it on first cargo invocation. Ensure rustfmt is present.
      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: rustfmt (crates)
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

      - name: rustfmt (bsp)
        run: cargo fmt --manifest-path src/bsp/rust/Cargo.toml --check

      # Excluded from the crates/ workspace (see crates/Cargo.toml's `exclude`),
      # so `cargo fmt --manifest-path crates/Cargo.toml --all` skips it. Check
      # it explicitly rather than leave it with no rustfmt coverage at all.
      - name: rustfmt (deluge_sample_convert)
        run: cargo fmt --manifest-path crates/deluge_sample_convert/Cargo.toml --check

      - name: rustfmt (harness)
        run: |
          for m in tests/component/differential/*/Cargo.toml src/bsp/rust/harness/*/Cargo.toml; do
            cargo fmt --manifest-path "$m" --check
          done

  clippy:
    name: clippy (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clippy
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates"

      - name: clippy (crates)
        run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings

      # Excluded from the crates/ workspace (see crates/Cargo.toml's `exclude`),
      # so the --all-targets sweep above skips it. Check it explicitly rather
      # than leave it with no clippy coverage at all.
      - name: clippy (deluge_sample_convert)
        run: cargo clippy --manifest-path crates/deluge_sample_convert/Cargo.toml --all-targets -- -D warnings

  clippy-harness:
    name: clippy (tests/component/differential, host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tests/component/differential/fs_differential
            tests/component/differential/region_fill_differential
            tests/component/differential/region_read_differential
            tests/component/differential/region_source_differential
      # Host target only. The BSP and its Embassy harness
      # (src/bsp/rust/harness/golden_vt_render) are deliberately
      # excluded here: they need the sibling deluge-sdk checkout and a C++
      # object closure that this job doesn't build. The device target also
      # needs -Zbuild-std plus the deluge-sdk setup and stays the separate
      # TODO at the bottom of this file.
      - name: clippy (harness packages)
        run: |
          for m in tests/component/differential/*/Cargo.toml; do
            echo "== $m"
            cargo clippy --manifest-path "$m" --all-targets -- -D warnings
          done

  harness-index:
    name: test registry table up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the table and diff
        run: |
          DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt test --list --markdown > /tmp/table.md
          sed -n '/BEGIN GENERATED TABLE/,/END GENERATED TABLE/p' tests/README.md \
            | sed '1d;$d' > /tmp/committed.md
          diff -u /tmp/committed.md /tmp/table.md || {
            echo "tests/README.md's table is stale -- regenerate it (see the README)."
            exit 1
          }

  # TODO: BSP clippy/build for armv7a-none-eabihf. Needs nightly -Z build-std
  # (rust-src is already pinned in src/bsp/rust/rust-toolchain.toml) and the
  # deluge-sdk toolchain setup. Add once the device build runs cleanly in CI:
  #
  # bsp:
  #   name: clippy (bsp)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: rustup component add clippy rust-src
  #     - run: cargo clippy --manifest-path src/bsp/rust/Cargo.toml
  #             --target armv7a-none-eabihf -Z build-std=core,alloc -- -D warnings
