name: ABI Surface

# The libdeluge C ABI's contract: every function a header in include/libdeluge declares has a definition, every
# Rust definition or import of one has an abi_pin!, every declaration carries a call-context tag and ends
# DELUGE_NOEXCEPT. --dead lists declared functions nothing calls. See include/libdeluge/README.md and
# scripts/check_abi_surface.py.

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "release/**"
  merge_group:
  workflow_dispatch:

jobs:
  abi-surface-check:
    name: libdeluge ABI surface check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every libdeluge declaration is defined, pinned, tagged and DELUGE_NOEXCEPT
        run: python3 scripts/check_abi_surface.py --check --pins --tags --dead --noexcept
