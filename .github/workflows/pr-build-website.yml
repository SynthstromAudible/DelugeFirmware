name: Build and Check Website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/pr-build-website.yml"
      - ".github/workflows/deploy-website.yml"
      - "src/deluge/gui/ui/menus.cpp"
      - "src/deluge/gui/menu_item/generate/g_menus.inc"
      - "src/deluge/gui/l10n/english.json"
      - "src/deluge/gui/l10n/seven_segment.json"
  workflow_dispatch:

permissions:
  checks: write
  contents: write

jobs:
  build-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          # Recent-change generation scans main history and inspects each
          # commit's changed paths, so a shallow checkout is insufficient.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild Sharp native module
        run: pnpm rebuild sharp

      # Playwright is needed for rendering mermaid diagrams at build time
      # See: https://github.com/remcohaszing/rehype-mermaid?tab=readme-ov-file#installation
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - name: Configure Chromium sandbox for PDF generation
        run: bash ./scripts/setup-pdf-sandbox.sh

      # This gets us the site base URL
      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v6

      - name: Run website checks
        run: pnpm run check

      - name: Build website
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.setup_pages.outputs.base_url }}
          SITE_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

      - name: Generate and check PDF
        timeout-minutes: 10
        run: pnpm run generate:pdf
        env:
          SITE_URL: ${{ steps.setup_pages.outputs.base_url }}
          SITE_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: documentation-pdf
          path: website/dist/downloads/delugecommunity.com.pdf
          if-no-files-found: error

      # We upload the artifact for manual downloading and opening locally
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-artifact
          path: website/dist
