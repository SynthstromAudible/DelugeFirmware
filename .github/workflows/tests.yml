name: Run tests

# Every test in tests/registry.toml at the pr tier, one job each. The registry is the list: a test added there is
# run here without editing this file.
on:
  pull_request:
    branches:
      - "release/**"
      - "main"
      - "next"
  merge_group:
  workflow_dispatch:

jobs:
  matrix:
    name: test matrix (pr)
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.emit.outputs.test }}
    steps:
      - uses: actions/checkout@v7
      - id: emit
        run: echo "test=$(DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt test --ci-matrix --tier pr | jq -c .test)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.test }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.matrix.outputs.test) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/test-prerequisites

      # --strict: a test skipped for a missing prerequisite fails the job, so a gap in the prerequisites action
      # shows up here rather than as a quiet green.
      - name: Run ${{ matrix.test }}
        run: |
          case "${{ matrix.test }}" in
            unit-arm) export CC=arm-linux-gnueabihf-gcc-14 CXX=arm-linux-gnueabihf-g++-14 ;;
            unit) export CC=gcc-14 CXX=g++-14 ;;
          esac
          DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt test "${{ matrix.test }}" --strict --junit build/results

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Results ${{ matrix.test }}
          path: build/results/*.xml
          if-no-files-found: ignore

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}
