name: Run tests

on:
  pull_request:
    branches:
      - "release/**"
      - "main"
  merge_group:
  workflow_dispatch:
  # Runs on main populate the apt caches; PR caches aren't visible to other PRs.
  push:
    branches:
      - "main"

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      pull-requests: read

  test-build-x86:
    name: Run tests (x86)
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install GCC multilib
        uses: ./.github/actions/apt-install
        with:
          cache-name: x86
          packages: gcc-14 gcc-14-multilib g++-14-multilib

      - name: Use GCC 14
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -B build -S tests -G Ninja

      - name: Run build
        run: cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure --output-junit results/ctest_results.xml

      - name: Make results directory
        run: mkdir -p build/results

      - name: Run 32 bit CppUTest
        working-directory: build/results
        run: |
          ../32bit_unit_tests/SmallPointerTests -ojunit
          ../32bit_unit_tests/MemoryManagerTests -ojunit
      - name: Run main CppUTest
        working-directory: build/results
        run: |
          ../unit/UnitTests -ojunit

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Results x86
          path: |
            build/results/**/*.xml
            build/spec/results/**/*.xml
            build/spec/results/*.xml

  test-build-qemu:
    name: Run tests for ARMv7 via QEMU
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install cross-compilation toolchain and QEMU
        uses: ./.github/actions/apt-install
        with:
          cache-name: qemu
          packages: gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf binfmt-support qemu-user-static

      - name: Use ARM cross toolchain
        run: |
          {
            echo "CC=arm-linux-gnueabihf-gcc-14"
            echo "CXX=arm-linux-gnueabihf-g++-14"
            echo "LD_LIBRARY_PATH=/usr/arm-linux-gnueabihf/lib:$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      - name: Symlink ld-linux
        run: sudo ln -s /usr/arm-linux-gnueabihf/lib/ld-linux-armhf.so.3 /lib/ld-linux-armhf.so.3

      - name: Configure
        run: cmake -B build -S tests/qemu -G Ninja

      - name: Run build
        run: cmake --build build

      - name: Run CTest
        run: ctest --output-on-failure --test-dir build

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Results ARMv7
          path: build/spec/results/**/*.xml

  event_file:
    name: "Event File"
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}
