name: Run tests

on:
  pull_request:
    branches:
      - "release/**"
      - "main"
  merge_group:
  workflow_dispatch:

jobs:
  test-build-x86:
    name: Run tests (x86)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install GCC multilib
        run: |
          sudo apt-get update
          sudo apt-get install gcc-14 gcc-14-multilib g++-14-multilib
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -B build -S tests -G Ninja

      - name: Run build
        run: cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure --output-junit results/ctest_results.xml

      - name: Make results directory
        run: mkdir -p build/results

      - name: Run 32 bit CppUTest
        run: |
          cd build/results
          ../32bit_unit_tests/SmallPointerTests -ojunit
          ../32bit_unit_tests/MemoryManagerTests -ojunit
      - name: Run main CppUTest
        run: |
          cd build/results
          ../unit/UnitTests -ojunit

      # Level 3 of the UI test harness (docs/superpowers/specs/2026-08-26-ui-test-harness-design.md
      # §7): run the whole headless app from tests/ui-scripts/app/*.txt on the deterministic frame
      # clock and diff its snapshots against tests/golden/ui/app/. -DDELUGE_SIM_X64=ON because the
      # sim's default here is the -m32 build, whose Rust archive is i686.
      #
      # `deluge_host` links crates/deluge_rust (sim/CMakeLists.txt's `cargo build`), which this job
      # never installs a toolchain for (M-12): it works only because ubuntu-latest ships a rustup
      # with the host triple preinstalled, and `crates/rust-toolchain.toml` pins the rest (channel
      # + components) for rustup to auto-install on first invocation -- the same implicit-image
      # dependency rust.yml's own jobs have, though those add `rustup component add` explicitly for
      # the pieces the pinned toolchain doesn't cover (rustfmt, clippy). If a future runner image
      # ships without rustup, this step fails with a `cargo: not found` that reads like a CMake
      # problem rather than a missing toolchain.
      - name: UI app scripts (level 3)
        id: ui-app-scripts
        run: |
          cmake -B build-sim -S sim -G Ninja -DDELUGE_SIM_X64=ON
          cmake --build build-sim --target deluge_host
          ctest --test-dir build-sim -R ui_app_scripts --output-on-failure

      # Task 10's CI diff net for src/scenes/menu/: the committed
      # website/src/data/generated/menu-hierarchies.json must never drift from the declarative
      # Node tables. Reuses the build-sim tree the step above just configured, rather than
      # reconfiguring. scripts/menu_dump_check.sh fails loudly (non-zero exit, not a silent skip)
      # if build-sim is missing, if deluge_menu_dump fails to build, if it was not actually
      # produced, if it prints no output, or if that output no longer matches the committed JSON.
      - name: Menu tree JSON dump matches committed JSON
        run: bash scripts/menu_dump_check.sh

      # Scoped to this step's own outcome: a bare `if: failure()` also fires when an earlier step
      # in the job failed, at which point build-sim/got does not exist and the upload logs a
      # spurious "no files found".
      - name: Upload UI snapshots on failure
        if: failure() && steps.ui-app-scripts.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ui-app-snapshots
          path: build-sim/got

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Results x86
          path: |
            build/results/**/*.xml
            build/spec/results/**/*.xml
            build/spec/results/*.xml

  test-build-qemu:
    name: Run tests for ARMv7 via QEMU
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install cross-compilation toolchain and QEMU
        run: |
          sudo debconf-communicate <<< "set man-db/auto-update false"
          sudo dpkg-reconfigure man-db        
          sudo apt-get update
          sudo apt-get install -y gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf qemu-user binfmt-support qemu-user-static qemu-system-arm
          echo "CC=arm-linux-gnueabihf-gcc-14" >> $GITHUB_ENV
          echo "CXX=arm-linux-gnueabihf-g++-14" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/arm-linux-gnueabihf/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Symlink ld-linux
        run: sudo ln -s /usr/arm-linux-gnueabihf/lib/ld-linux-armhf.so.3 /lib/ld-linux-armhf.so.3

      - name: Configure
        run: cmake -B build -S tests/qemu -G Ninja

      - name: Run build
        run: cmake --build build

      - name: Run CTest
        run: ctest --output-on-failure --test-dir build

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Results ARMv7
          path: build/spec/results/**/*.xml

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}
