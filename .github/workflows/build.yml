name: Build

on:
  workflow_call:
    inputs:
      firmware-retention-days:
        required: true
        type: number
      build-type:
        default: "release"
        type: string
      build-tag:
        default: "dev"
        type: string
      branch:
        required: false
        type: string
      skip:
        # Skips the job instead of not calling it, so the required check still passes
        default: false
        type: boolean
      bsp-clippy:
        # Also lint the Rust BSP for the device. Advisory: a finding is reported, not failed on.
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      firmware-retention-days:
        type: choice
        description: How long to save artifacts
        options: 
        - 5
        - 30
      build-type:
        type: choice
        description: Build type
        options:
        - Debug
        - Release
        - Relwithdebinfo
      build-tag:
        type: choice
        description: Tag for firmware version
        options:
        - dev
        - nightly
        - beta
        - rc
        - release

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        if: inputs.branch != null
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - name: Checkout branch
        if: inputs.branch == null
        uses: actions/checkout@v7
      - name: Validate Build Type
        env:
          buildtype: ${{ inputs.build-type }}
        run: node .github/scripts/validate_build_string.js

      - uses: ./.github/actions/clang

      # dbt downloads the pinned toolchain (arm-none-eabi-gcc's newlib sysroot, cmake, python, rustup) on first run.
      - name: Cache the dbt toolchain
        uses: actions/cache@v6
        with:
          path: toolchain
          key: dbt-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/REQUIRED_VERSION', 'src/bsp/rust/rust-toolchain.toml') }}

      - name: Run build
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          DBT_NO_PYTHON_UPGRADE: "1"
        run: ./dbt build --verbose "$BUILD_TYPE"

      - name: Lint the Rust BSP for the device
        if: inputs.bsp-clippy
        continue-on-error: true
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          DBT_NO_PYTHON_UPGRADE: "1"
        run: ./dbt build --clippy --no-default-features --features rtt "$BUILD_TYPE"

      - name: Genfile check
        run: |
          git diff --exit-code

      - name: Publish built firmware (release-bin)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.build-tag }}_${{ inputs.build-type }}_build_bundle
          path: build/${{ inputs.build-type }}/*
          if-no-files-found: error
          retention-days: ${{ inputs.firmware-retention-days }}
