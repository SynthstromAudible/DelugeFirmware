name: Nightly Build

# NOTE: the `build` job in build.yml is disabled (see its `if: false` and the
# comment there), so `nightly-build` below (which calls build.yml) is itself
# skipped and produces no firmware artifact. `nightly-publish` needs
# `nightly-build` with no `if:` override, so it is skipped in turn — its
# steps never run, and nothing gets published.
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "14 0 * * *" # runs daily at 00:14

jobs:
  nightly-detect:
    runs-on: ubuntu-latest
    outputs:
      new-commits: ${{ steps.count-commits.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get new commits if branch exists
        id: count-commits
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/next; then
            echo "Branch next exists, checking for commits"
            git checkout next
            count=$(git log --oneline --since '24 hours ago' | wc -l)
            echo "Saw $count commits"
            echo "count=$count" >> $GITHUB_OUTPUT
          else
            echo "Branch next does not exist, skipping"
            echo "count=0" >> $GITHUB_OUTPUT
          fi
  nightly-build:
    uses: ./.github/workflows/build.yml
    needs: nightly-detect
    if: needs.nightly-detect.outputs.new-commits > 0
    with:
      firmware-retention-days: 30
      build-type: "Release"
      build-tag: "nightly"
      branch: "next"
  nightly-publish:
    uses: ./.github/workflows/publish.yml
    needs: nightly-build
    with:
      tag: "nightly"
      branch: "next"

  # Everything in harness/registry.toml up to the nightly tier, against next. Cumulative, so the pr tier runs here
  # too: next also takes local merges that no pull request's tests.yml run ever saw.
  test-nightly-matrix:
    name: test matrix (nightly)
    runs-on: ubuntu-latest
    needs: nightly-detect
    if: needs.nightly-detect.outputs.new-commits > 0
    outputs:
      test: ${{ steps.emit.outputs.test }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
      - id: emit
        run: echo "test=$(DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt test --ci-matrix --tier nightly | jq -c .test)" >> "$GITHUB_OUTPUT"

  test-nightly:
    name: ${{ matrix.test }}
    needs: [nightly-detect, test-nightly-matrix]
    if: needs.nightly-detect.outputs.new-commits > 0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.test-nightly-matrix.outputs.test) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
      - uses: ./.github/actions/test-prerequisites
      - name: Build the host-app object closure
        # -DDELUGE_SIM_X64=ON is REQUIRED, not optional: the sim defaults to a
        # -m32 configuration, which link-fails against the Rust harnesses'
        # 64-bit host target on a bare x86 Linux box — including this runner.
        run: cmake -B build-embassy-hostapp -S sim -G Ninja -DDELUGE_SIM_X64=ON && cmake --build build-embassy-hostapp
      - name: Run ${{ matrix.test }}
        run: |
          case "${{ matrix.test }}" in
            unit-arm) export CC=arm-linux-gnueabihf-gcc-14 CXX=arm-linux-gnueabihf-g++-14 ;;
            unit) export CC=gcc-14 CXX=g++-14 ;;
          esac
          DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt test "${{ matrix.test }}" --strict
