name: Label PRs

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited, synchronize]
  pull_request:
    paths:
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/labeler.yml
      - .github/labels.yml
      - .github/scripts/label_pr.py
      - .github/scripts/test_label_pr.py
      - .github/workflows/label-prs.yml

permissions:
  contents: read

concurrency:
  group: label-prs-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test PR labeling
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python .github/scripts/test_label_pr.py

  label:
    name: Label PR and check description
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target checks out the base branch by default. Never add `ref:` here:
      # this job has write permissions and must not run code from the PR.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python .github/scripts/label_pr.py
        env:
          GH_TOKEN: ${{ github.token }}
