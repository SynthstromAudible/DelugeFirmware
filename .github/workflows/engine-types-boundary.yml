name: Engine Types Boundary

# src/engine-api/types holds the data-only types of the host–engine contract: standard library only, no allowlist.
# See scripts/check_engine_types_boundary.py.

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "release/**"
  merge_group:
  workflow_dispatch:

jobs:
  engine-types-boundary-check:
    name: engine-api types boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check src/engine-api/types includes only the standard library and itself
        run: python3 scripts/check_engine_types_boundary.py
