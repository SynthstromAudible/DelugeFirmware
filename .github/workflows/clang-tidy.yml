name: Clang Tidy
on:
  pull_request: # Required to post comments on PR from forks
  # Runs on main only populate the apt cache; PR caches aren't visible to other PRs.
  push:
    branches:
      - "main"
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      pull-requests: read

  warm-apt-cache:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy
        uses: ./.github/actions/apt-install
        with:
          cache-name: clang-tidy
          packages: clang-19 clang-tidy-19 gcc-14 g++-14 gcc-14-multilib g++-14-multilib

  clang-tidy-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Posting a review only makes sense on PRs
    if: startsWith(github.event_name, 'pull_request') && needs.changes.outputs.firmware == 'true'
    steps:
      # The merge ref has the apt-install action even when the PR head predates it.
      - name: Checkout CI actions
        uses: actions/checkout@v7

      - name: Remove preinstalled clang-tidy
        run: sudo apt-get remove -y ^clang-tidy

      - name: Install clang-tidy
        uses: ./.github/actions/apt-install
        with:
          cache-name: clang-tidy
          packages: clang-19 clang-tidy-19 gcc-14 g++-14 gcc-14-multilib g++-14-multilib

      - name: Select clang-tidy 19
        run: |
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-19 100

      # Repo config for pull_request_target
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          submodules: recursive

      - name: Generate compilation database
        run: |
          cd "$GITHUB_WORKSPACE" || exit 1
          ./dbt configure
          # Supply native C commands for the handshake tests and their headers.
          cmake -S tests/oled_handshake -B build/tidy-handshake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          jq -s 'add' build/compile_commands.json build/tidy-handshake/compile_commands.json > build/compile_commands.merged.json
          mv build/compile_commands.merged.json build/compile_commands.json
          sed -i 's/-mthumb-interwork//g' build/compile_commands.json
          sed -i 's/-fdevirtualize-at-ltrans//g' build/compile_commands.json
          sed -i 's/-fuse-linker-plugin//g' build/compile_commands.json
          # The firmware database has no host tests. Without their own entries,
          # clang-tidy guesses C++/firmware flags for the C hardware test harness.
          cmake -S tests/hardware -B build/tidy-hardware -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          jq -s 'add' build/compile_commands.json build/tidy-hardware/compile_commands.json > build/compile_commands.merged.json
          mv build/compile_commands.merged.json build/compile_commands.json

      - name: Extract system includes from GCC
        run: |
          "$GITHUB_WORKSPACE"/toolchain/current/arm-none-eabi-gcc/bin/arm-none-eabi-g++ -mcpu=cortex-a9 -mfpu=neon -mfloat-abi=hard -E -x c++ - -v < /dev/null 2>&1           \
            | sed -n '/^#include <...> search starts here:$/,/^End of search list.$/p' \
            | tail -n +2 \
            | head -n -1 \
            | sed 's/^\s*//g' \
            | sed 's/^\(.*\)$/--extra-arg-before=-isystem\1/g' \
            | tr '\n' ' ' > system_includes.txt
          echo "Extracted system includes:"
          cat system_includes.txt
          # Keep ARM headers on firmware commands only. Native tests need the
          # host standard library and must not inherit --no-standard-includes.
          python3 - <<'PYTHON'
          import json
          import shlex
          from pathlib import Path

          database = Path("build/compile_commands.json")
          commands = json.loads(database.read_text())
          includes = [arg.removeprefix("--extra-arg-before=")
                      for arg in shlex.split(Path("system_includes.txt").read_text())]
          for command in commands:
              arguments = command.get("arguments") or shlex.split(command["command"])
              if "arm-none-eabi" in arguments[0]:
                  command["arguments"] = arguments + includes + ["--no-standard-includes"]
                  command.pop("command", None)
          database.write_text(json.dumps(commands))
          PYTHON

      - name: Check clang-tidy version
        run: clang-tidy --version

      - name: Add native CV gate compilation commands
        run: |
          cmake -S tests/cv_gate -B build/tidy-cv-gate -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          jq -s 'add' build/compile_commands.json build/tidy-cv-gate/compile_commands.json > build/compile_commands.merged.json
          mv build/compile_commands.merged.json build/compile_commands.json

      - name: Add native section reorder test commands
        run: |
          cmake -S tests/section_reorder -B build/tidy-section-reorder -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          jq -s '.[0] + [.[1][] | select(.file | contains("/tests/section_reorder/"))]' build/compile_commands.json build/tidy-section-reorder/compile_commands.json > build/compile_commands.merged.json
          mv build/compile_commands.merged.json build/compile_commands.json

      - name: Add native parameter test commands
        run: |
          cmake -S tests -B build/tidy-parameters \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # Keep firmware sources on their ARM commands; add only the test adapters.
          jq -s '.[0] + [.[1][] | select(.file | contains("/tests/unit/parameters/"))]' build/compile_commands.json build/tidy-parameters/compile_commands.json > build/compile_commands.merged.json
          mv build/compile_commands.merged.json build/compile_commands.json

      - uses: ZehMatt/clang-tidy-annotations@v1.1.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_dir: ${{ github.workspace }}/build
          source_dir: ${{ github.workspace }}
          only_affected_lines: true
          fail_on_problems: false
          clang_tidy_file: ${{ github.workspace }}/.clang-tidy

