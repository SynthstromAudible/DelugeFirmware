name: Test prerequisites
description: >
  Everything `./dbt test --doctor` probes for, installed once: the host and cross compilers, qemu, mtools, clang,
  cmake and ninja, cargo-nextest, and the sibling deluge-sdk checkout the Rust BSP builds against. One action for
  every test job, so a test never skips in CI for want of a tool another job installs.

runs:
  using: composite
  steps:
    - name: Install system packages
      uses: ./.github/actions/apt-install
      with:
        cache-name: test-prerequisites
        packages: >-
          gcc-16 g++-16 gcc-16-multilib g++-16-multilib
          gcc-16-arm-linux-gnueabihf g++-16-arm-linux-gnueabihf qemu-user python3-numpy
          ninja-build mtools jq

    # The 32-bit builds include <asm/...> through glibc. gcc-multilib would link /usr/include/asm to the x86_64 copy,
    # but it conflicts with the armhf cross compilers (both own that path), so the link is made here instead.
    - name: Link the multilib asm headers
      shell: bash
      run: |
        [ -e /usr/include/asm ] || sudo ln -s x86_64-linux-gnu/asm /usr/include/asm

    - uses: ./.github/actions/clang

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    # The Rust BSP reaches deluge-sdk as a SIBLING of the repo root, at the revision its lock pins.
    - name: Find the deluge-sdk revision the lock pins
      id: sdk
      shell: bash
      run: |
        rev=$(sed -n 's|^source = "git+https://github.com/FirestormAudio/deluge-sdk.git?rev=\([0-9a-f]*\)#.*|\1|p' \
          src/bsp/rust/Cargo.lock | head -1)
        [ -n "$rev" ] || { echo "src/bsp/rust/Cargo.lock pins no deluge-sdk revision"; exit 1; }
        echo "rev=$rev" >> "$GITHUB_OUTPUT"

    - name: Check out deluge-sdk
      uses: actions/checkout@v7
      with:
        repository: FirestormAudio/deluge-sdk
        ref: ${{ steps.sdk.outputs.rev }}
        path: deluge-sdk-checkout

    - name: Place it beside the workspace
      shell: bash
      run: mv deluge-sdk-checkout ../deluge-sdk

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ". -> build/cargo-harness"

    # Each rust-toolchain.toml's toolchain, installed one at a time: tests run in parallel, and parallel cargo calls
    # that each find a toolchain missing race on rustup's download directory.
    - name: Install the pinned Rust toolchains
      shell: bash
      run: |
        git ls-files '*rust-toolchain.toml' | while read -r f; do
          (cd "$(dirname "$f")" && rustup toolchain install)
        done
