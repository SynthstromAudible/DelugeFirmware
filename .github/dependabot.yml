version: 2
updates:
  - package-ecosystem: "github-actions"
    labels:
      - "type: deps"
      - "area: ci"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
    groups:
      all-actions:
        patterns: [ "*" ]

  - package-ecosystem: "pip"
    directory: scripts/toolchain/
    labels:
      - "type: deps"
      - "area: toolchain"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "01:30"

  - package-ecosystem: "pip"
    directory: tests/integration/usbmidi
    labels:
      - "type: deps"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "01:30"
