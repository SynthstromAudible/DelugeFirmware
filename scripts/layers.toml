# The include layers: the directories under src/, what each library may include, and the include rules whose
# counts scripts/layers_baseline.txt holds. scripts/check_layers.py checks the tree against it, and
# docs/dev/code_layout_north_star.md is the layout it moves towards: a directory with a `target` is not yet at its
# place in it.

[tree]
# The roots the build searches for a quoted include, in the build's order: the legacy tree comes before src/.
include_roots = ["src/deluge", "src"]
legacy = "src/deluge"
# The trees the rules' globs are matched over: the firmware and the specs and tests that drive it.
scan_roots = ["src", "tests"]
# The files at the src/ root. Each is dissolved into its owner.
root_files = [
    "CMakeLists.txt",
    "arm_neon_shim.h",
    "board_config.h",
    "board_controls.hpp",
    "board_layout.hpp",
    "definitions.h",
    "definitions_cxx.hpp",
    "mem_functions.h",
]

[[directory]]
path = "deluge"
target = "legacy: shrinks to zero by rewrite, then is deleted"

[[directory]]
path = "project"

[[directory]]
path = "effects"

[[directory]]
path = "app"

[[directory]]
path = "base"

[[directory]]
path = "dsp"

[[directory]]
path = "host"

[[directory]]
path = "instruments"

[[directory]]
path = "midi"

[[directory]]
path = "music"

[[directory]]
path = "platform"

[[directory]]
path = "plugin"

[[directory]]
path = "serialization"

[[directory]]
path = "storage"

[[directory]]
path = "synth"

[[directory]]
path = "ui"

# Libraries: each may include only the C++ standard library, its system headers, itself and its may_include.

# The bottom of the stack: the standard library, the C headers the C files use, the board's clock constant and the
# platform ABI macros only.
[[library]]
name = "base"
root = "src/base"
prefix = "base/"
may_include = ["board_config.h", "libdeluge/abi.h"]
system = ["stdbool.h", "stddef.h", "stdint.h", "string.h"]

[[library]]
name = "plugin-types"
root = "src/plugin/types"
prefix = "plugin/types/"

[[library]]
name = "plugin"
root = "src/plugin"
prefix = "plugin/"
may_include = [
    "serialization/",
    "base/panic.h",
]

[[library]]
name = "effects"
root = "src/effects"
prefix = "effects/"
may_include = [
    "plugin/",
    "serialization/",
    "base/panic.h",
    "dsp/",
]

[[library]]
name = "instruments-classic"
root = "src/instruments/classic"
prefix = "instruments/classic/"
may_include = [
    "plugin/",
    "effects/",
    "host/chains/",
    "serialization/",
    "base/panic.h",
    "synth/modulation/patch_source.h",
    "synth/modulation/cable.h",
    # the synth's config, which the instrument derives from its state (the instrument is the synth's plugin)
    "synth/voice/sound_config.h",
    "synth/voice/unison.h",
    "dsp/fixed/pitch/",
    # the components' states, which the instrument's state is composed of
    "synth/sources/source_state.h",
    "synth/sources/input/input_channel.h",
    "synth/engines/engine_state.h",
    "synth/modulation/lfo_state.h",
    "synth/voice/voicing_state.h",
    # the voice seam, whose instrument side the pool is
    "synth/voice/voice_host.h",
    # the block values begin_block makes for the synth's voices, and the engine's facts it makes them from
    "synth/voice/block_values.h",
    "synth/voice/host_block.h",
]

[[library]]
name = "host-chains"
root = "src/host/chains"
prefix = "host/chains/"
may_include = [
    "plugin/types/",
    # the library publishes the chains' remote-controls pages, so it reads the plugin contract's publisher and state
    # handle and the effect state it publishes
    "plugin/remote_controls_publisher.h",
    "plugin/state_handle.h",
    "effects/plugin.h",
    "effects/words.h",
    "effects/setting_params.h",
    # its effect rows are the effects' params at its ids
    "effects/params.h",
    "effects/param_row.h",
]

[[library]]
name = "serialization"
root = "src/serialization"
prefix = "serialization/"
may_include = [
    "base/panic.h",
]

[[library]]
name = "music"
root = "src/music"
prefix = "music/"
may_include = [
    # the sync words a note length is named from (header-only vocabulary)
    "plugin/types/sync.h",
    "plugin/types/display_mapping.h",
    "base/panic.h",
]

[[library]]
name = "ui-views-waveform"
root = "src/ui/views/waveform"
prefix = "ui/views/waveform/"
may_include = [
    "base/divide.h",
]

[[library]]
name = "app-ports-waveforms"
root = "src/app/ports/waveforms"
prefix = "app/ports/waveforms/"
may_include = [
    "base/divide.h",
    "ui/views/waveform/peaks.h",
]

[[library]]
name = "project"
root = "src/project"
prefix = "project/"
may_include = [
    "plugin/types/",
    # an engine's state, held without naming its type (a record owns its instrument's state)
    "plugin/state_handle.h",
    "plugin/plugin.h",
    "serialization/",
    "music/",
    "base/panic.h",
]

[[library]]
name = "ui-controls"
root = "src/ui/controls"
prefix = "ui/controls/"
may_include = [
    "project/",
    "plugin/",
    "serialization/",
    "base/panic.h",
]

[[library]]
name = "ui-scenes-bind"
root = "src/ui/scenes/bind"
prefix = "ui/scenes/bind/"
may_include = [
    "project/",
    "ui/controls/",
    "plugin/",
    "instruments/classic/",
    "effects/",
    "host/chains/",
    "serialization/",
    "midi/device_id.h",
    "music/",
    # a waveform's columns and peaks, the Waveforms port's vocabulary (header-only)
    "ui/views/waveform/peaks.h",
    "base/panic.h",
    "gui/l10n/setting_names.h",
    "gui/l10n/strings.h",
]

# The drawing primitives: geometry, dimensions and style arrive as values, and oled and grid never include each
# other.
[[library]]
name = "ui-gfx"
root = "src/ui/gfx"
prefix = "ui/gfx/"

[[library]]
name = "ui-gfx-oled"
root = "src/ui/gfx/oled"
prefix = "ui/gfx/oled/"
may_include = ["ui/gfx/contract.h"]
system = ["stdint.h"]

[[library]]
name = "ui-gfx-grid"
root = "src/ui/gfx/grid"
prefix = "ui/gfx/grid/"
may_include = ["ui/gfx/contract.h"]

# Rules: a forbidden include pattern, counted per file. A count above its baseline row (zero when there is none)
# fails.

[[rule]]
name = "legacy-includes-port"
files = ["src/deluge/**"]
exclude = [
    "src/deluge/deluge.cpp",
    "src/deluge/gui/ui/shell_host_ui.h",
    "src/deluge/gui/ui/shell_host_ui.cpp",
    "src/deluge/gui/ui/shell_guest_surfaces.h",
    "src/deluge/gui/ui/shell_guest_surfaces.cpp",
    "src/deluge/gui/ui/shell_guest_services.cpp",
    "src/deluge/gui/ui/shell_action_dispatch.cpp",
    "src/deluge/gui/ui/browser_host.cpp",
    "src/deluge/gui/ui/shell_pad_forward.cpp",
    "src/deluge/gui/ui/shell_automation_glue.cpp",
    "src/deluge/gui/ui/shell_slice_ops.cpp",
    "src/deluge/gui/ui/menu_view_of.h",
    "src/deluge/gui/ui/menu_view_of.cpp",
    "src/deluge/gui/ui/menu_entry.cpp",
    "src/deluge/gui/ui/shell_note_bridge.cpp",
    "src/deluge/gui/ui/shell_note_mode.cpp",
    "src/deluge/gui/ui/shell_notification_sink.cpp",
    "src/deluge/gui/ui/root_knobs.cpp",
    "src/deluge/gui/ui/shell_guest_knobs.h",
    "src/deluge/gui/ui/shell_host/*",
]
pattern = '^(ui/scenes/|ui/shell/)'
reason = "the legacy tree reaches the scenes and the shell only through the host files that wire them"

[[rule]]
name = "model-includes-ui"
files = ["src/deluge/{model,playback,processing,storage,io,modulation,memory,sync,util,dsp_legacy}/**"]
pattern = '^(gui/(?!l10n/)|hid/)'
reason = "the model and the engine raise notifications; they do not include the UI"

[[rule]]
name = "notify-is-leaf"
files = ["src/base/notify/**"]
pattern = '^(?!base/notify/).*/'
reason = "the notification channel includes only itself and the standard library"

[[rule]]
name = "ui-includes-outside"
files = ["src/ui/widgets/**"]
pattern = '^(?!ui/widgets/|ui/gfx/)(?:.*/|definitions.*|board_config\.h|board_layout\.hpp)'
reason = "the widget toolkit includes only itself, gfx and the standard library"

[[rule]]
name = "ui-oled-no-grid"
files = ["src/ui/widgets/oled/**"]
pattern = '^ui/widgets/grid/'
reason = "the OLED widgets and the pad components never include each other"

[[rule]]
name = "ui-grid-no-oled"
files = ["src/ui/widgets/grid/**"]
pattern = '^ui/widgets/oled/'
reason = "the OLED widgets and the pad components never include each other"

[[rule]]
name = "shell-includes-outside"
files = ["src/ui/shell/**"]
pattern = '^(?!ui/shell/|ui/widgets/|ui/gfx/|base/|libdeluge/|midi/)(?:.*/|definitions.*|board_config\.h|board_layout\.hpp)'
reason = "the shell knows no model: it includes the toolkit, gfx, notify, midi ids and libdeluge"

[[rule]]
name = "scenes-includes-outside"
files = ["src/ui/scenes/**"]
pattern = '^(?!ui/|base/|libdeluge/|midi/|io/|model/|modulation/|playback/|processing/|storage/|gui/l10n/|effects/|host/chains/|instruments/|synth/modulation/|plugin/|serialization/|sequence/|project/|music/|definitions_cxx\.hpp)(?:.*/)'
reason = "the scenes include the UI stack, the model and its ports, never the legacy UI or the app's internals"

[[rule]]
name = "scenes-model-stack-outside-context"
files = ["src/ui/scenes/**"]
pattern = '^model/model_stack\.h$'
reason = "no scene builds a model stack"

[[rule]]
name = "scenes-includes-gui"
files = ["src/ui/scenes/**"]
pattern = '^(gui/(?!l10n/)|hid/)'
reason = "the scenes draw through the toolkit, never the legacy gui or hid"

[[rule]]
name = "scenes-model-stack"
files = ["src/ui/scenes/**"]
pattern = '^(model/model_stack\.h|modulation/automation/auto_param\.h)'
reason = "a node edits through bind::Target, not a model stack"

[[rule]]
name = "scenes-no-edits"
files = ["src/ui/scenes/**"]
pattern = '^model/edits/'
reason = "a scene's write leaves as a request; it names no Edit"

[[rule]]
name = "scenes-no-peak-cache"
files = ["src/ui/scenes/**"]
pattern = '^app/ports/waveforms/peak_cache\.h$'
reason = "a scene asks the waveforms port for a window's columns and draws the answer; the column cache is the host's"

[[rule]]
name = "scenes-reads-outside-bind"
files = ["src/ui/scenes/**"]
exclude = ["src/ui/scenes/bind/**"]
pattern = '^(model|modulation|io|processing|storage|playback)/'
shrink_only = true
reason = "the scenes read the model only through ui/scenes/bind; the count only falls as reads move there"

[[rule]]
name = "platform-boundary"
files = ["src/deluge/**", "src/definitions.h", "src/definitions_cxx.hpp"]
pattern = '^(RZA1|drivers|bsp)/'
reason = "the application reaches the hardware only through libdeluge"

[[rule]]
name = "dsp-next-boundary"
files = ["src/dsp/**"]
pattern = '^(storage|model|processing|gui|playback|modulation|hid|io|dsp_legacy|RZA1|bsp|drivers|memory|util)/'
allow = ["memory/memory_allocator_interface.h", "util/misc.h"]
reason = "the L0 kernels reach no app layer, the legacy dsp library or the platform"

[[rule]]
name = "synth-boundary"
files = ["src/synth/**"]
pattern = '^(storage|model|processing|gui|playback|hid|io|dsp_legacy|bench|RZA1|bsp|drivers|memory|util|modulation|project)/'
allow = [
    "memory/memory_allocator_interface.h",
    "util/lookuptables/lookuptables.h",
    "util/misc.h",
    "util/param_functions.h",
    "modulation/params/param.h",
    "modulation/sync.h",
    # the vocabulary definitions_cxx.hpp brings; synth-no-project-vocabulary keeps a synth file from naming it
    "project/arrangement.h",
    "project/drum_type.h",
    "project/launch_style.h",
    "project/midi_command.h",
    "project/sequence_direction.h",
]
transitive = true
reason = "the synth library reaches no app layer, the legacy dsp library or the platform, directly or through another header"

[[rule]]
name = "synth-no-project-vocabulary"
files = ["src/synth/**"]
pattern = '^project/'
reason = "the project vocabulary reaches the synth only through definitions_cxx.hpp"
