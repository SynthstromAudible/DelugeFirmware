# Renesas RZ/A1L series: RZ/A1LU (R7S721020) in the Deluge.
# Single Cortex-A9 behind an ADIv5 SWJ-DP. Needs OpenOCD >= 0.12.
#
# DAP layout, read from a Deluge with `dap info`:
#   SWD DPIDR 0x3ba02477
#   AP0  AHB-AP: system bus (SRAM, SDRAM, peripherals). No ROM table.
#   AP1  APB-AP: debug bus, ROM table at 0x80000000.
#        0x80030000 Cortex-A9 debug   0x80038000 CTI   0x8003c000 PTM
#        0x80021000 TMC (ETB)         0x80023000 TPIU  0x80024000 funnel
#
# Two targets share the DAP:
#   $_CHIPNAME.cpu  cortex_a on AP1. This is the core GDB debugs.
#   $_CHIPNAME.ahb  mem_ap on AP0. Fast physical memory access that doesn't
#                   stop the core: image loads and RTT polling.
#                   cortex_a routes all memory access through the halted CPU
#                   (DCC), which is slow and impossible while it runs.
#
# Reset is halt-only. Pulling nRESET runs the boot ROM, which boots the
# SPI-flash bootloader, not an image loaded over the probe. So `reset`
# halts the core and doesn't touch the reset line; `deluge_hw_reset` pulses
# nRESET when you want a normal boot from flash.
#
# Semihosting stays off on purpose: OpenOCD implements it with an SVC vector
# catch, and the firmware runs in SVC mode, so every SVC would halt it.
#
# No init/reset/halt here, so attaching never disturbs a running board, and
# this file can be sourced by other configs and wrappers.

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME rza1l
}

source [find target/swj-dp.tcl]

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} elseif { [using_jtag] } {
	# ARM JTAG-DP IDCODE. Not yet confirmed on a Deluge (only SWD has been).
	set _DAP_TAPID 0x4ba00477
} else {
	set _DAP_TAPID 0x3ba02477
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x01 -irmask 0x0f -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
set _AHBNAME $_CHIPNAME.ahb

target create $_AHBNAME mem_ap -dap $_CHIPNAME.dap -ap-num 0 -gdb-port disabled
target create $_TARGETNAME cortex_a -dap $_CHIPNAME.dap -ap-num 1 -dbgbase 0x80030000
targets $_TARGETNAME

$_TARGETNAME configure -event examine-end {
	# Single-stepping must not drop into pending interrupt handlers.
	cortex_a maskisr on
	# Let debugger writes reach read-only (domain-protected) pages, e.g. for
	# software breakpoints.
	cortex_a dacrfixup on
}

# nRESET is wired (debug header pin 10), but only deluge_hw_reset uses it.
# The reset-assert handler below takes over the `reset` command.
reset_config srst_only srst_nogate

$_TARGETNAME configure -event reset-assert {
	deluge_halt_reset
}

# --- Deluge procedures (usable from GDB as `monitor <name>`) ---------------

# Debug view of the CPG's SYSCR3: bits 3:0 make the four 32 KB data-retention
# RAM banks (0x20000000-0x2001FFFF) writable. Without them every store there
# Data Aborts.
set _RZA1_SYSCR3 0xFCFE0408

# CHCTRL of each DMAC channel (0-7 from 0xE8200000, 8-15 from 0xE8200400,
# 0x40 apart, CHCTRL at +0x28). Writing CLREN|SWRST (0x0A) stops the channel.
set _RZA1_DMA_CHCTRL {}
foreach _base {0xE8200028 0xE8200428} {
	for {set _ch 0} {$_ch < 8} {incr _ch} {
		lappend _RZA1_DMA_CHCTRL [format 0x%08X [expr {$_base + $_ch * 0x40}]]
	}
}

# Halt without asserting nRESET, and make retention RAM writable.
proc deluge_halt_reset {} {
	global _CHIPNAME _RZA1_SYSCR3
	$_CHIPNAME.cpu arp_halt
	$_CHIPNAME.cpu arp_waitstate halted 1000
	$_CHIPNAME.ahb mwb $_RZA1_SYSCR3 0x0F
}

# Leave the core ready for a RAM image (same steps as the J-Link recipe in
# tools/deluge_jlink.py): halted; MMU, caches and branch prediction off
# (SCTLR = 0x00C50078); vectors at 0x20000000 (VBAR); every DMA channel
# stopped, so a running firmware's DMA rings don't write into the new image.
proc deluge_prepare {} {
	global _CHIPNAME _RZA1_DMA_CHCTRL
	deluge_halt_reset
	targets $_CHIPNAME.cpu
	arm mcr 15 0 1 0 0 0x00C50078
	arm mcr 15 0 12 0 0 0x20000000
	foreach _reg $_RZA1_DMA_CHCTRL {
		$_CHIPNAME.ahb mww $_reg 0x0A
	}
}

# Load a RAM-linked ELF over the AHB-AP (about 2.5x faster than GDB's `load`,
# which writes through the CPU) and set the core up at `entry`, in SVC mode
# with IRQ/FIQ masked (CPSR 0x1DF). Doesn't resume.
#   deluge_load build/RelWithDebInfo/deluge.elf 0x2007cc40
# The new PC/CPSR only sit in OpenOCD's register cache and reach the core on
# resume: resume in the same session (or use deluge_run). Quitting OpenOCD
# first leaves the core at its old PC, with the old image's state gone.
proc deluge_load { elf entry } {
	global _CHIPNAME
	deluge_prepare
	# load_image works on the current target, so point it at the AHB-AP.
	targets $_CHIPNAME.ahb
	set _err [catch { load_image $elf 0 elf } _msg]
	targets $_CHIPNAME.cpu
	if { $_err } { error $_msg }
	reg cpsr 0x1DF
	reg pc $entry
}

# Load and start an image (see deluge_load).
proc deluge_run { elf entry } {
	deluge_load $elf $entry
	resume
}

# RTT: OpenOCD implements RTT only for Cortex-M (and HLA/ARC) targets, so its
# `rtt` commands don't exist with this config. tools/openocd_rtt.py reads RTT
# through this OpenOCD's Tcl port (6666) and the AHB-AP target instead.

# Real reset: pulse nRESET so the boot ROM runs the bootloader from flash,
# as at power-on. Doesn't halt.
proc deluge_hw_reset {} {
	adapter assert srst
	sleep 100
	adapter deassert srst
}

# Some OpenOCD builds echo the value of a config file's last command; keep it empty.
set _RZA1_CFG_LOADED 1
unset _RZA1_CFG_LOADED
