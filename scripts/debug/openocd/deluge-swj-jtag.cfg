# Deluge (RZ/A1LU) over JTAG. Source after an interface config, e.g.
#   openocd -f interface/delugeprobe.cfg -f deluge-swj-jtag.cfg
# Everything chip-specific (reset, load, RTT helpers) is in rza1l.cfg.

transport select jtag

# The adapter rounds this down to what it can do (a DAPLink on a GD32/STM32F103
# tops out near 8 MHz). Lower it for long or flying-lead debug cables.
adapter speed 4000

source [file join [file dirname [info script]] rza1l.cfg]
