# The sample range-reader C ABI (`libdeluge/sample_reader.h`): raw-PCM frame ranges of a sample
# for non-voice consumers (pitch detect, waveform, wavetable build). The non-voice twin of
# `deluge_sample_source`.
#
# Kept separate from `deluge_sample_fill` because it depends on `deluge_resource` directly (for the
# typed `Lease`), which `deluge_sample_fill` deliberately avoids.
#
# A plain `no_std` rlib with no `#[panic_handler]`: the final artifact provides one.
[package]
name = "deluge_sample_reader"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "deluge_sample_reader"
crate-type = ["rlib"]

[dependencies]
deluge_resource = { path = "../deluge_resource" }
# `native_fill` supplies the fill primitives this crate's synchronous fill composes; production
# code needs it, not only tests.
deluge_sample_fill = { path = "../deluge_sample_fill", features = ["native_fill"] }

[dev-dependencies]
deluge_alloc = { path = "../deluge_alloc" }
critical-section = { version = "1", features = ["std"] }

[features]
## Export the C ABI (`#[no_mangle]`) on a host build. The device build always exports it.
c_abi = []
