# TLSF + slab allocator core behind the C ABI in `libdeluge/alloc.h`. `no_std`. The BSP links it
# directly; the C++ conformance suite in `tests/unit/alloc` links it through `deluge_rust`.
[package]
name = "deluge_alloc"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[features]
## Exposes the `testing` invariant harness to external consumers (the fuzz crate); unit tests get
## it via `cfg(test)`.
fuzzing = []
## Emits AddressSanitizer poison/unpoison around carve/free/coalesce, so use-after-free within a heap
## is caught. Opt-in for a link built with `-fsanitize=address`, which resolves the
## `__asan_*_memory_region` symbols; no build enables it. Off, the hooks compile away.
asan = []

[lib]
name = "deluge_alloc"
crate-type = ["rlib"]

[dev-dependencies]
proptest = "1"

