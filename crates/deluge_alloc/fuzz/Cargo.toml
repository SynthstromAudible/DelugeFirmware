# cargo-fuzz targets for the allocator: `ops` (alloc/free/realloc sequences) and `slab` (the slab
# cache pool), both checking the invariants in `deluge_alloc::testing`. Not runnable as it stands:
# see the `alloc-fuzz` entry in tests/registry.toml.
[package]
name = "deluge_alloc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.deluge_alloc]
path = ".."
features = ["fuzzing"]

[[bin]]
name = "ops"
path = "fuzz_targets/ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slab"
path = "fuzz_targets/slab.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
