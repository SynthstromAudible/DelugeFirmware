# Safe Rust wrappers over the app's convert/stitch C++, which build.rs compiles with `cc`.
#
# Excluded from the crates/ workspace: its std test harness links the C++ objects, so it stays
# clear of the workspace's panic=abort/no_std profiles. build.rs fetches argon and SIMDe into a
# gitignored third_party/ at the revisions cmake/deps.cmake pins, rather than reading a CMake
# `_deps` tree.
[package]
name = "deluge_sample_convert"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "deluge_sample_convert"
path = "src/lib.rs"

[dependencies]

[build-dependencies]
cc = "1"

[features]
## Compiles only the shim, for a final link that already supplies `convert.cpp`, `stitch.cpp` and
## `audio_format_helpers.cpp` (otherwise they would be defined twice). Off for a standalone build,
## which needs them compiled here.
app_convert = []
