# Audio-file HEADER decoding: WAV/RIFF and AIFF/FORM containers in, one plain
# facts struct out. Deliberately narrow — this crate reads no files, allocates
# nothing, and decodes no audio; it turns a byte prefix into an `AudioHeader`.
#
# It exists so the header parse can run inside a Rust async task, which the
# pull-based C++ parser could not (a synchronous C++ callee cannot be driven by
# an async reader). The design decisions live in the source: see the crate root
# docs for the windowed protocol and the `HeaderError`/`ParseError` split, and
# `step_mark_entry` for the one deliberate behaviour change against the C++
# parser this replaces.
[package]
name = "deluge_audio_format"
version = "0.1.0"
edition = "2021"

