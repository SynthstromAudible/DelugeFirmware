# cargo-fuzz harness for the WAV/AIFF header parser. Run with:
#   cd crates/deluge_audio_format/fuzz && cargo +nightly fuzz run parse
[package]
name = "deluge_audio_format-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Required: without it cargo attributes this nested package to the parent workspace and every
# command fails with "current package believes it's in a workspace when it's not". Listing it in
# crates/Cargo.toml's `exclude` does not fix that.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
deluge_audio_format = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
