# The cached-asset resource manager behind `deluge_resource.h`. A `no_std` rlib with no panic
# handler and no global allocator (the reclaim hook must never re-enter the manager); backing
# memory comes from `deluge_alloc`.
[package]
name = "deluge_resource"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[features]
## Exposes the host-only `testing` harness outside the crate, for a fuzz target.
fuzzing = []

[lib]
name = "deluge_resource"
crate-type = ["rlib"]

[dependencies]
deluge_alloc = { path = "../deluge_alloc" }

[dev-dependencies]
proptest = "1"
critical-section = { version = "1", features = ["std"] }
