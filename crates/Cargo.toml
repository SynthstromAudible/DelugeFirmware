# The Deluge Rust core libraries. Each member is a plain rlib; the umbrella `deluge_rust` bundles
# their C ABIs into the staticlib the C++ unit tests link.
[workspace]
resolver = "2"
members = ["deluge_alloc", "deluge_audio_format", "deluge_resource", "deluge_rust", "deluge_sample_source", "deluge_sample_fill", "deluge_sample_reader", "deluge_sample_stream"]
# The fuzz crate is a nightly cargo-fuzz package with its own profile. `deluge_sample_convert`'s
# build script compiles app C++ and needs a std test harness, which this workspace's
# `panic = "abort"` release profile would break.
exclude = ["deluge_alloc/fuzz", "deluge_sample_convert"]

# The staticlib links into C++ binaries, which abort on panic; `cargo test` keeps the unwinding
# default.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
