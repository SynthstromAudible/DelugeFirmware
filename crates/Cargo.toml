# The Deluge Rust core libraries. Each member is a plain rlib; the umbrella `deluge_rust` bundles
# their C ABIs into the staticlib the C++ unit tests link.
#
# Gate crates:
#     every #[test] in the crates/ workspace: the allocator, the resource manager, the audio-format corpus differential
#     (deluge-sdk runs the parser's own tests), the sample fill/reader/source/stream crates
[workspace]
resolver = "2"
members = ["../src/base/alloc", "../src/storage/resource", "deluge_rust", "../src/storage/sample/source", "../src/storage/sample/fill", "../src/storage/sample/reader", "../src/storage/stream"]
# The fuzz crate is a nightly cargo-fuzz package with its own profile. `deluge_storage_sample_convert`'s
# build script compiles app C++ and needs a std test harness, which this workspace's
# `panic = "abort"` release profile would break.
exclude = ["../src/base/alloc/fuzz", "../src/storage/sample/convert"]

# The staticlib links into C++ binaries, which abort on panic; `cargo test` keeps the unwinding
# default.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
