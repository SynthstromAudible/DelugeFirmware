[package]
name = "deluge_sample_source"
version = "0.1.0"
edition = "2021"

[dependencies]
deluge_resource = { path = "../deluge_resource" }
# `ManagerPin::payload` reads a leased chunk's payload base directly instead of hopping through the
# `deluge_streaming_chunk_payload` C-ABI (U4d Task 6). Default-features (no `native_fill`): this
# crate only uses `deluge_sample_fill::chunk` (the struct + accessors this caller needs), and
# omitting `native_fill` skips the one thing that's actually manager-reaching -- `mod native`, the
# `native_begin`/`native_finish` fill core `deluge_sample_reader` depends on `native_fill` for. It
# is NOT a chunk-only build, though: `lib.rs` declares `pub mod chunk` and `pub mod fill_logic`
# unconditionally, so this dependency also compiles `fill_logic.rs` and pulls in
# `deluge_sample_convert`/`embassy-sync` transitively regardless of features. That has no binary-size
# effect on any real build: every real target (device/host_app/sim) already links
# `deluge_sample_reader`, which depends on this same crate WITH `native_fill`, and Cargo unifies a
# path dependency to one build per binary -- so this crate's own feature set never shrinks what
# actually gets compiled into device/host/sim, only what a standalone `cargo build/test -p
# deluge_sample_source` compiles.
deluge_sample_fill = { path = "../deluge_sample_fill" }

[dev-dependencies]
deluge_alloc = { path = "../deluge_alloc" }
critical-section = { version = "1", features = ["std"] }

[features]
# SR2d-5 Task 4: mirrors `deluge-bsp-rust`'s own `host_app` feature (src/bsp/rust/Cargo.toml). Carries
# no dependency of its own -- it exists purely so `abi.rs`'s `#[cfg_attr(any(target_os = "none",
# feature = "host_app"), unsafe(no_mangle))]` selector can tell "device" and "host, but standing in for
# the device via the host-built C++ app closure" apart from a plain `cargo test`/`cargo build` on this
# crate alone, which must NOT export these symbols (they'd never be linked against anything and would
# just be dead weight). `deluge-bsp-rust` forwards its own `host_app` feature down to this one (see its
# Cargo.toml).
host_app = []

# SIM Task 1: the C-host sim's own sibling of `host_app` above. The sim links this crate through the
# `deluge_rust` umbrella (crates/deluge_rust/Cargo.toml's own `sim` feature forwards to this one) rather
# than standing in for a device build, so it needs a distinct selector -- but it drives the exact same
# `abi.rs` cfg_attr gate (widened below to `any(target_os = "none", feature = "host_app", feature =
# "sim")`), because the point of this feature is precisely to make the strong Rust cursor symbols
# present for the sim link at all (SR2d-5) -- no weak C++ fallback exists, so without this feature the
# sim has no cursor -- so golden can validate the Rust cursor runs identically to device/host_app.
# Carries no dependency of its own, same shape as `host_app`.
sim = []

[lib]
