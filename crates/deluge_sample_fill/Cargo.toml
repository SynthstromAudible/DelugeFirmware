# Cluster-fill core shared by the BSP and the host tests: the fill arithmetic (`fill_logic`), the
# per-asset fill-context table, and, behind `native_fill`, the manager-reaching fill.
# A plain `no_std` rlib; the final artifact supplies the panic handler.
[package]
name = "deluge_sample_fill"
version = "0.1.0"
# 2024: the fill core uses `unsafe extern "C"` blocks and `#[unsafe(no_mangle)]`.
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "deluge_sample_fill"
crate-type = ["rlib"]

[dependencies]
deluge_sample_convert = { path = "../deluge_sample_convert" }
# Blocking `Mutex` for the fill-context table only; no executor.
embassy-sync = "0.8.0"

[dev-dependencies]
# The context table's `CriticalSectionRawMutex` needs a registered implementation to link; the
# standalone test binary brings the std one.
critical-section = { version = "1", features = ["std"] }

[features]
## The manager-reaching fill (`native_begin`/`native_finish`). It references `extern "C"`
## manager and chunk symbols, so it only links where the final artifact provides them; off, the
## crate's own tests link with nothing to resolve.
default = []
native_fill = []
## Builds `deluge_sample_convert` shim-only, for a final link that supplies the convert/stitch
## objects itself (see that crate's `app_convert`).
app_convert = ["deluge_sample_convert/app_convert"]
