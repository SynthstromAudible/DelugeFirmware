[package]
name = "deluge_storage_sample_source"
workspace = "../../../../crates"
version = "0.1.0"
edition = "2021"

[dependencies]
deluge_storage_resource = { path = "../../resource" }
# Only `chunk` is used (`ManagerPin::payload` reads a chunk's payload base directly). Default
# features on purpose: `native_fill` is the manager-reaching fill core, which `deluge_storage_sample_reader`
# enables for every real build anyway.
deluge_storage_sample_fill = { path = "../fill" }

[dev-dependencies]
deluge_base_alloc = { path = "../../../base/alloc" }
critical-section = { version = "1", features = ["std"] }

[features]
## Export the C ABI (`#[no_mangle]`). The BSP and the unit-test umbrella turn it on; the crate's own
## tests leave it off, since the exports call symbols only a final link provides.
c_abi = []

[lib]
