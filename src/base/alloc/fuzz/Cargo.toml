# cargo-fuzz targets for the allocator: `ops` (alloc/free/realloc sequences) and `slab` (the slab
# cache pool), both checking the invariants in `deluge_base_alloc::testing`.
[package]
name = "deluge_base_alloc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace root, as cargo-fuzz lays a fuzz crate out: it sits inside a member of the repo's workspace, where
# the root's `exclude` cannot reach it.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.deluge_base_alloc]
path = ".."
features = ["fuzzing"]

[[bin]]
name = "ops"
path = "fuzz_targets/ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slab"
path = "fuzz_targets/slab.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
