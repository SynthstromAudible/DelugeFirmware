# The Deluge firmware image: implements the libdeluge C ABI on the deluge-sdk HAL+BSP, owns reset
# and the Embassy executors, and links the C++ application (libdeluge_app.a). Its release profile and
# the embassy `[patch]` are the root workspace's (Cargo.toml), which also holds its gate's explanation.
[package]
name = "deluge_platform_device"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
build = "build/main.rs"

[lib]
name = "deluge_platform_device"
path = "src/lib.rs"

[[bin]]
name = "deluge-rust"
path = "src/main.rs"
test = false

# Builds a card manifest into a directory, for the tools that image a card from one (tools/ui_script_cards.py).
# Host only: device builds pass --no-default-features, which leaves it out.
[[bin]]
name = "card-manifest"
path = "src/bin/card-manifest.rs"
required-features = ["host-runtime"]

[dependencies]
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
log = "0.4"
rtt-target = { version = "0.6", features = ["log"], optional = true }
heapless = { version = "0.8", default-features = false }
# The boot's inflate of the SDRAM content (sdram_pack.rs): no allocator.
miniz_oxide = { version = "0.8.9", default-features = false }

# The header decoder the audio loader walks headers through, and whose C ABI the app calls.
# deluge-sdk's `deluge-audio-format`, at the pin below; `c-abi` exports what the app calls.
deluge_audio_format = { package = "deluge-audio-format", git = "https://github.com/FirestormAudio/deluge-sdk.git", rev = "89303a3632391a122baded3ff12199942c046b5a", features = ["c-abi"] }
deluge_storage_sample_fill = { path = "../../storage/sample/fill", features = ["native_fill"] }

# deluge-sdk, pinned by revision. `dbt build` and `dbt sim` pass `src/platform/device/local-sdk.toml`
# (gitignored) via `cargo --config` when it exists, to build against a sibling checkout instead.
# The `flash` feature enables `deluge_bsp::flash`, which the settings sector reads need.
# Default features off: the image links its own memory layout (linker/memory*.x), not the BSP's,
# and its own C `rza1_cpu_fault_report` (every CPU fault vector calls it), not the BSP's
# `fault-blink` handler. `zero-init-below-image` puts `.bss` and the MMU table below the image, so the
# `__sram_heap_base` in linker/sdram_sections.x can hand the image's boot-only tail to the heap.
deluge-bsp = { git = "https://github.com/FirestormAudio/deluge-sdk.git", rev = "89303a3632391a122baded3ff12199942c046b5a", default-features = false, features = [
    "flash",
    "zero-init-below-image",
] }
# The USB-MIDI and USB Audio Class 2.0 device classes.
usb-classes = { package = "deluge-usb-classes", git = "https://github.com/FirestormAudio/deluge-sdk.git", rev = "89303a3632391a122baded3ff12199942c046b5a", features = [
    "device-audio",
    "device-midi",
] }
# The chip HAL. `unstable-driver-steal`: the fault path stops the PIC TX DMA through `Dma::steal`.
rza1-hal = { git = "https://github.com/FirestormAudio/deluge-sdk.git", rev = "89303a3632391a122baded3ff12199942c046b5a", features = [
    "rza1l",
    "unstable-driver-steal",
    # The L2 cache controller's by-address maintenance (`peripherals::usb_audio`).
    "unstable-pac",
] }

# The filesystem `storage::efatfs::portable` drives on every build. The 0.7 `embedded-io-async` is
# the one whose `Read`/`Seek`/`Write` `embedded_fatfs::File` implements (the block-device crates
# use 0.6; both versions are in the graph).
# deluge-sdk's fork, published on crates.io; the import name stays `embedded_fatfs`.
embedded-fatfs = { package = "deluge-embedded-fatfs", version = "0.2", default-features = false, features = ["lfn", "alloc"] }
embedded-io-async = "0.7.0"

# Device (armv7a-none-eabihf). `platform-cortex-ar` here and `platform-std` on host are mutually
# exclusive in embassy-executor, so the two executors live in disjoint `[target]` sections.
[target.'cfg(target_os = "none")'.dependencies]
# The device storage stack under the filesystem: `BlockDevice` over the SD driver, `BufStream`.
block-device-driver = "0.2"
block-device-adapters = { package = "deluge-block-device-adapters", version = "0.3" }
aligned = "0.4"
# The TLSF allocator behind the `#[global_allocator]` that `embedded-fatfs`'s `alloc` needs.
# Imported as `fs_alloc`, the name its call sites use.
fs_alloc = { package = "deluge_base_alloc", path = "../../base/alloc" }

# The C-ABI crates the C++ app calls (residency/allocator, sample source/reader/stream). Their
# `#[no_mangle]` definitions have no C++ fallback, and lib.rs's `extern crate`s keep them on the
# link line. `deluge_storage_resource` is linked directly, not via the `deluge_test_rust` umbrella, whose
# `#[panic_handler]` would collide with ours.
deluge_storage_resource = { path = "../../storage/resource" }
deluge_storage_sample_source = { path = "../../storage/sample/source", features = ["c_abi"] }
deluge_storage_sample_reader = { path = "../../storage/sample/reader", features = ["c_abi"] }
deluge_storage_sample_peaks = { path = "../../storage/sample/peaks", features = ["c_abi"] }
deluge_storage_stream = { path = "../../storage/stream", features = ["c_abi"] }

# Embassy versions match deluge-sdk's workspace pins.
embassy-executor = { version = "0.10.0", features = [
    "nightly",
    "platform-cortex-ar",
    "executor-thread",
    "executor-interrupt",
] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-usb = "0.6.0"
embassy-usb-driver = "0.2.2"

cortex-ar = "0.3"
critical-section = "1"

# Host (x86/std): the std-thread executor, so the scheduler also runs off-hardware (e.g. under
# ThreadSanitizer).
[target.'cfg(not(target_os = "none"))'.dependencies]
embassy-executor = { version = "0.10.0", features = ["nightly"] }
embassy-time = "0.5.1"
critical-section = { version = "1", features = ["std"] }
env_logger = { version = "0.11", optional = true }
# The host C++ app (`host_app`) calls the same C-ABI crates.
deluge_storage_resource = { path = "../../storage/resource", optional = true }
deluge_storage_sample_source = { path = "../../storage/sample/source", optional = true }
deluge_storage_sample_reader = { path = "../../storage/sample/reader", optional = true }
deluge_storage_sample_peaks = { path = "../../storage/sample/peaks", optional = true }
deluge_storage_stream = { path = "../../storage/stream", optional = true }

# The block-device stack under the host mount (`host_app`). A std host has a default allocator, so
# no `fs_alloc` is needed.
block-device-driver = { version = "0.2", optional = true }
block-device-adapters = { package = "deluge-block-device-adapters", version = "0.3", optional = true }
aligned = { version = "0.4", optional = true }
# The desktop simulator window for `sim`, and its panel/audio link (`deluge_simulator::link`), which
# `sim_panel` plugs into deluge-bsp's host-panel hook.
deluge-simulator = { git = "https://github.com/FirestormAudio/deluge-sdk.git", rev = "89303a3632391a122baded3ff12199942c046b5a", optional = true }

[features]
default = ["host-runtime"]

## The host binary's runtime: embassy's std executor and time driver. A harness with its own
## executor and time driver (golden_vt_render) depends on this crate without it. The device
## executor is exclusive with it, so device builds pass `--no-default-features --features rtt`.
host-runtime = [
    "embassy-executor/platform-std",
    "embassy-executor/executor-thread",
    "embassy-time/std",
    "dep:env_logger",
]

## RTT logging over a debug probe: selects the RTT linker script and layout and registers the logger.
rtt = ["dep:rtt-target", "deluge-bsp/rtt"]

## The rig harness (`peripherals::rig_harness`): panel state out and script gestures in over RTT,
## for driving a device on the probe rig. Never in a shipping image.
rig-harness = ["rtt"]

## The audio-timing probe: each render's time against the queue it had, the render task's wake
## lateness and the drive's overruns, printed as an `AUDIO-TIMING` line every two seconds of audio. Never in a shipping image.
audio-timing = ["rtt"]

## USB audio's DMA rings in SDRAM rather than SRAM, to measure what that costs the render. Measured: no better than
## SRAM (it is the default), so not for shipping images.
usb-rings-sdram = []

## Link the host-built C++ app into the host binary: bindgen the libdeluge headers for the host
## ABI and export the C-ABI crates' symbols it calls.
host_app = [
    "dep:deluge_storage_resource",
    "dep:deluge_storage_sample_source",
    "deluge_storage_sample_source/c_abi",
    "dep:deluge_storage_sample_reader",
    "deluge_storage_sample_reader/c_abi",
    "dep:deluge_storage_sample_peaks",
    "deluge_storage_sample_peaks/c_abi",
    # The host scene specs seed a fixture's peaks (deluge_peaks_fill_uniform); host builds only.
    "deluge_storage_sample_peaks/test_support",
    "dep:deluge_storage_stream",
    "deluge_storage_stream/c_abi",
    "dep:block-device-driver",
    "dep:block-device-adapters",
    "dep:aligned",
]

## The emulator (`dbt sim`): the host app runs as the brain of deluge-sdk's desktop simulator, in
## one process.
sim = ["host_app", "dep:deluge-simulator", "deluge-bsp/host-panel"]

[build-dependencies]
# The link of the host-built C++ app, and the link helpers the device link shares.
deluge_platform_host_link = { path = "../host/link" }
# Generates the Rust side of the libdeluge headers, so the boundary cannot drift.
bindgen = "0.70"
