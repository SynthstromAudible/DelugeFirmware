# Lens 1 (streaming-underrun harness): a single-threaded, deterministic
# virtual-time discrete-event simulation of the real host_app (song load + sustained
# playback + concurrent record), used to measure `loaded`-miss underruns as a
# function of modeled SD latency / audio compute budget — reproducibly, independent
# of host CPU speed.
#
# Deliberately a fully separate Cargo package from `deluge-bsp-rust` (../Cargo.toml):
# `embassy-time`'s `std` feature (deluge-bsp-rust's own host target) and a
# custom/`mock-driver`-shaped time driver both define
# `#[no_mangle] _embassy_time_now`/`_embassy_time_schedule_wake` — a hard
# duplicate-symbol compile error if both land in one package's dependency graph
# (Cargo unifies a dependency's features across every target in one Cargo.toml;
# there is no per-`[[bin]]` override). The same separate-package shape `../golden_vt_render/` uses, extended here to
# link the real C++ host_app object closure.
#
# Reuses deluge-bsp-rust's own source files via `#[path]` (see src/main.rs) — the
# same pattern `tests/*.rs` already use to reuse `fiber.rs`/`sd.rs`/`scheduler.rs`
# — so this is a second, independently-configured COMPILATION of the same source,
# not a fork/copy: a change to the shared files is picked up by both packages.
[package]
name = "lens1-vt-sim"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "lens1-vt-sim"
path = "src/main.rs"
test = false

[dependencies]
# No `platform-*` feature (see src/main.rs's custom driver shape):
# keeps the crate from defining its own `__pender`, so we
# supply one ourselves and drive a poll-to-quiescence/advance-to-next-deadline
# loop instead of a thread-parking executor.
embassy-executor = { version = "0.10.0", default-features = false, features = ["nightly"] }
# No `std`/`mock-driver` feature: keeps embassy-time from registering its own time
# driver, so the hand-rolled `PeekableMockDriver` (src/clock.rs) can be the sole one.
embassy-time = { version = "0.5.1", default-features = false }
embassy-time-driver = { version = "0.2.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3.2"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
# `std` backend: a real critical-section impl on host (global mutex) — the shared
# source files (sd.rs/fiber.rs/scheduler.rs) are compiled `not(target_os = "none")`,
# std, same as deluge-bsp-rust's own host target.
critical-section = { version = "1", features = ["std"] }
log = "0.4"
env_logger = "0.11"
# Host implementation of `fiber.rs`'s low-level coroutine switch — same dep,
# same version, as `deluge-bsp-rust`'s own host target.
corosensei = "0.3"

# Sibling deluge-sdk BSP: `sd.rs` calls `deluge_bsp::sd::*` uniformly (dual-target,
# see that file's module doc). Host-only relevant surface (block_device.h's backing
# store) does not itself depend on embassy-time/-executor (checked: deluge-bsp's
# host `[dependencies]` section carries no embassy-time/-executor/-futures at all —
# those are gated `[target.'cfg(target_os = "none")'.dependencies]`), so this path
# dep does not reintroduce the std/mock-driver conflict this package exists to avoid.
deluge-bsp = { path = "../../../../../../deluge-sdk/crates/deluge-bsp", features = ["flash"] }

# The host-built C++ `deluge_app` object closure (build.rs) calls the
# deluge_resource_* residency C ABI and the deluge_{alloc,slab_*,heap_*} allocator
# C ABI — same as deluge-bsp-rust's own `host_app` feature (see its main.rs `extern
# crate deluge_resource` comment). Linked directly (not the `deluge_rust` umbrella,
# which carries its own #[panic_handler]).
deluge_resource = { path = "../../../../../crates/deluge_resource" }
# The WAV/AIFF header decoder behind `libdeluge/audio_format.h`. The archived `deluge_app` object
# closure's parseSampleHeader/parseWaveTableHeader call straight into its `deluge_audio_header_*`
# C ABI, and there is no weak C++ fallback, so the rlib has to be on this link line too (mirrors
# `deluge-bsp-rust`'s own dependency).
deluge_audio_format = { path = "../../../../../crates/deluge_audio_format" }

# C2a Task 3: `#[path]`-included `streaming_loader.rs` (see src/main.rs) now sources
# `StreamingFillDescriptor` and `ProdOps::begin`/`finish`'s `native_begin`/`native_finish`
# straight from this crate (the manager-reaching sync fill core moved out of
# `streaming_loader.rs::prod` in that task) instead of defining them itself — so this
# package needs the same dependency `deluge-bsp-rust`/`region_fill_differential` do,
# with `native_fill` on (this package recompiles `ProdOps`, which calls both).
deluge_sample_fill = { path = "../../../../../crates/deluge_sample_fill", features = ["native_fill"] }
deluge_sample_source = { path = "../../../../../crates/deluge_sample_source", features = ["host_app"] }
deluge_sample_reader = { path = "../../../../../crates/deluge_sample_reader", features = ["host_app"] }
deluge_sample_stream = { path = "../../../../../crates/deluge_sample_stream", features = ["host_app"] }

# R0b: the same `BlockDevice`/`BufStream`/`embedded-fatfs` storage stack
# `deluge-bsp-rust`'s own `host_app` feature pulls in (see its Cargo.toml
# comment) — `efatfs_host_shim.rs`/`efatfs_core.rs` (path-included above) need
# these. Plain (non-optional) deps, not gated behind a Cargo feature: this
# package always builds with `host_app` semantics (its whole purpose), so
# there is no "host_app off" configuration to spare the extra deps for, unlike
# the main crate's plain host BSP smoke-test build. No `fs_alloc`/
# `#[global_allocator]` needed here either — same reasoning as the main
# crate's Cargo.toml: host's implicit std allocator already covers
# embedded-fatfs's `alloc` feature.
block-device-driver = { path = "../../../../../crates/block-device-driver" }
block-device-adapters = { path = "../../../../../crates/block-device-adapters" }
aligned = "0.4"
embedded-fatfs = { path = "../../../../../crates/embedded-fatfs", default-features = false, features = [
    "lfn",
    "alloc",
] }
embedded-io-async = "0.7.0"
# `efatfs_core.rs`'s `DirEntryInfo::name` is a `heapless::String<256>` (R2 Task 4's
# directory enumeration), so the path-included module needs the same dep — and the
# same version pin — the main crate and `fs_differential` carry. Without it this
# package fails to build with `unresolved import heapless`.
heapless = { version = "0.8", default-features = false }

[features]
# Both always-on for this package (it exists ONLY to run the real C++ app under
# `sim_latency`-modeled SD timing) — kept as real Cargo features rather than
# unconditional code anyway, since they gate `#[path]`-included code SHARED with
# `deluge-bsp-rust` (whose own default is OFF for both), and matching that
# file's existing `#[cfg(feature = "...")]` spelling exactly means zero edits to
# the shared conditionals themselves.
default = ["host_app", "sim_latency"]
host_app = []
sim_latency = []
# R0b: mount the host efatfs shim in `boot_task` (before `deluge_app_init`) and
# drive the embedded-fatfs streaming READ path instead of C FatFS — see
# `../Cargo.toml`'s `efatfs_streaming` feature doc for the device-side
# equivalent.
#
# NOT on by default (unlike a first draft of this task) — Task 5's own
# verification found a reproducible HANG: with this feature on, a full-length
# scenario run (this package's actual purpose — `sweep.sh` drives 20000
# blocks by default) can livelock partway through. Isolated with the `cordae`
# fixture (`LENS1_SONG` default): deterministic, 100%-reproducible across
# repeated runs (including against a FRESH, never-reused packed image, ruling
# out image-state confounds) — the run always wedges right after the audio
# thread's own "rendered 1500 blocks" milestone (`audio_host.rs`'s log),
# consistently at the same virtual-clock point (t=3834700us, 40000 clock
# advances, `on_fiber_reads` stuck at 309), regardless of the `LENS1_BLOCKS`
# target — i.e. it wedges once the scenario runs long enough to reach that
# point, not at a fixed `LENS1_BLOCKS` threshold (an earlier, less careful
# pass at this investigation mis-attributed it to a `LENS1_BLOCKS` value;
# that framing was wrong — the real trigger is the absolute point in the
# virtual timeline). `efatfs_host_shim::read_at` genuinely gets hit dozens of
# times first (real efatfs reads DO happen — the wiring itself is correct),
# so the hang is downstream, not at mount/open. Lens 2
# (`../src/main.rs`'s `host_app_task`, the SAME shim/`fill_once`/
# `ProdOps::read` code, real multi-threaded executor, NOT the virtual-clock
# driver here) completed the same song cleanly at 500 blocks across 5 TSan
# runs with efatfs active — so this looks specific to this package's
# single-threaded, discrete-event "poll to quiescence, jump the virtual clock"
# driver interacting with something reached partway through this song
# (plausibly a loop-point backward seek — this branch's own SP1b chain-walk-
# cost work is directly about that access pattern) rather than a defect in
# the shim/mount wiring itself. Not root-caused further — out of Task 5's
# scope (wiring + feature flags), flagged as a follow-up. Opt in explicitly
# (`--features efatfs_streaming` or `--no-default-features --features
# host_app,sim_latency,efatfs_streaming`) for short/bounded runs until this is
# root-caused; do NOT flip this to `default` (that would silently break
# `sweep.sh`'s normal 20000-block runs).
#
# Composes `async_streaming_loader`: NOT optional, structurally required.
# `ProdOps::read` (`streaming_loader.rs`'s `prod` module) — the only call site
# that ever consults a `StreamingFillDescriptor.handle` and routes to
# `efatfs_host_shim::read_at` — only runs inside `fill_once`, which only runs
# once the Rust `streaming_fill_task` owns the loader queue
# (`deluge_streaming_async_active() == true`). When that's false, C++'s own
# `loader.cpp::pump()`/`SampleStream::read_cluster_data` handle every fill
# instead, and that sync path never looks at `fill.handle` at all — it always
# goes through `make_read_source()`'s C-FatFS-backed `deluge::io::Stream`.
# So `efatfs_streaming` alone (without `async_streaming_loader`) would mount
# the shim and leave it completely unexercised — confirmed by running the
# scenario with only `efatfs_streaming` on: the mount succeeded but
# `efatfs_host_shim::read_at` was never hit.
efatfs_streaming = ["async_streaming_loader"]
# Not enabled — exists only so the shared `#[cfg(feature = "storage-owner-audit")]`/
# `#[cfg(feature = "rtt")]` conditionals in `sd.rs`/`services.rs` don't trip
# rustc's unknown-cfg lint in this package (they're real features over there,
# unrelated to this package's own concerns).
storage-owner-audit = []
rtt = []
# R3.2b: mirrors `../Cargo.toml`'s `async_streaming_loader` feature exactly (same
# spelling, so `streaming_loader.rs`'s `#[cfg(feature = "async_streaming_loader")]`
# conditionals need zero edits when `#[path]`-included here). Off by default —
# same fiber-pump backing as every other Lens-1 run unless explicitly opted in,
# so a plain `sweep.sh` invocation is unchanged. See `main.rs`'s `mod
# streaming_loader` doc comment for how this package spawns the task.
async_streaming_loader = []

[build-dependencies]
bindgen = "0.70"

[profile.dev]
opt-level = 1
debug = true
