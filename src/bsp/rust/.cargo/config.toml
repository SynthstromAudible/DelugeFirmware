# This crate is not a deluge-sdk workspace member, so its device target settings and the embassy
# USB interface budget are set here. There is no default [build] target: a plain `cargo build`
# builds the host binary, and `./dbt build` builds the device firmware.

# The device target (armv7a-deluge-eabihf.json), linked by clang/lld with cross-language LTO. Its
# feature set matches clang's (stock armv7a-none-eabihf adds +strict-align, which blocks every
# cross-language inline). Build it with `./dbt build`, which exports CARGO_TARGET_ARMV7A_DELUGE_EABIHF_LINKER and
# _RUSTFLAGS from the discovered toolchain (device_cxx_env() in scripts/tasks/task-build.py).
[target.armv7a-deluge-eabihf]
# No `rustflags` here: the per-target RUSTFLAGS env var replaces this array rather than merging, so
# a partial copy would be a trap. No inline-threshold override in that flag list either: measured a
# no-op at the default, and the C++ side's -fno-inline-functions stays on for clang because gating
# it off grew .text and SRAM.
linker = "clang++"

[env]
EMBASSY_USB_MAX_INTERFACE_COUNT = "8"
