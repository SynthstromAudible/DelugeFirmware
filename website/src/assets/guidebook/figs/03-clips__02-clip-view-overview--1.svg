<text fill="currentColor" xml:space="preserve" transform="translate(51.3 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Sequence plays left to right</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(51.3 29.0)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">First steps</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(5.9 195.7)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Lower</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(5.9 203.4)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">notes</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(5.9 42.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Higher</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(5.9 49.8)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">notes</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(365.7 29.0)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Time</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(341.8 262.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Audition pads enable the synth</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(341.8 272.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">notes or kit samples to be</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(341.8 282.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">played manually allowing the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(341.8 292.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">sound to be checked prior to</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(341.8 302.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">programming it in a sequence.</tspan></text>
<g clip-path="url(#03-clips__02-clip-view-overview--1-clip_5)">
</g>
<path transform="matrix(1,0,0,-1,-45.9,518.2)" stroke-width=".7" stroke-linecap="butt" stroke-dasharray="2.1,2.1,.000015,.000015" stroke-linejoin="round" fill="none" stroke="color-mix(in srgb, currentColor 65%, var(--gb-paper))" d="M368.4 518.7V386.3"/>
<path transform="matrix(1,0,0,-1,-45.9,518.2)" stroke-width=".7" stroke-linecap="butt" stroke-dasharray="2.1,2.1,.000015,.000015" stroke-linejoin="round" fill="none" stroke="color-mix(in srgb, currentColor 65%, var(--gb-paper))" d="M491.7 309.9V290.6H409.5V267.4"/>
<text fill="currentColor" xml:space="preserve" transform="translate(59.5 244.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Synth: pitch is represented by the rows of</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(59.5 254.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">the grid. Lower rows are the lower notes and</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(59.5 264.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">increases in pitch as the rows increase.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(59.5 274.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Kit: each row represents an individual</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(59.5 284.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">sound, for example a drum / percussion</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(59.5 294.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">sound such as a kick on the bottom row,</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(59.5 304.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">snare second bottom row, etc...</tspan></text>
<g clip-path="url(#03-clips__02-clip-view-overview--1-clip_6)">
</g>
