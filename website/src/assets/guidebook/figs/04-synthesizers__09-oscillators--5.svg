<text fill="currentColor" xml:space="preserve" transform="translate(205.4 308.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Wavetable navigation set per Osc.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(205.4 318.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Available when Type is Wavetable.</tspan></text>
