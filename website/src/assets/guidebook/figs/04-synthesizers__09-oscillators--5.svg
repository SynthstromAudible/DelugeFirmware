<text fill="currentColor" xml:space="preserve" transform="translate(106.2 24.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">In left/right, in right or in left, are automatically</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(106.2 34.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">available when a physical line in is connected.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(107.4 100.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">An audio sample can be used as the oscillator source.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(107.4 110.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">A series of sample specific options are available in the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(107.4 120.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">sound editor when SAMPLE is selected.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(107.4 181.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">A wavetable file can be assigned to the oscillator</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(107.4 191.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">source to create a wavetable synth. The main</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(107.4 201.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">parameter is the wave position used by the oscillator.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(107.4 211.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Navigation function of the wave is accessed in the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(107.4 221.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">oscillator options or via the keyboard shortcut.</tspan></text>
<g mask="url(#04-synthesizers__09-oscillators--5-mask_2)">
