<text fill="currentColor" xml:space="preserve" transform="translate(7.0 336.6)" font-size="10" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Deluge Unison</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(7.0 358.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">The settings available in the voice menu of Deluge include number of voices</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(7.0 368.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">and the detuning of these voices. You can also use the two oscillators both</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(7.0 378.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">detuned from each other in addition to unison mode.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(7.0 400.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Multiple instances of polyphonic and unison clips are possible under</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(7.0 410.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">powerful CPU control. As the CPU becomes more loaded voices will be</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(7.0 420.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">reduced starting with notes in a ‘release’ state and the priority setting found</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(7.0 430.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">within the voice : polyphony parameter set.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(38.2 79.5)" font-size="10" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">NUM</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(38.2 90.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Number of voices from the maximum of 8.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(38.2 101.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Example 3:</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(38.2 210.0)" font-size="10" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">DET</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(38.2 221.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Detuning of voices. Example 30. This is a</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(38.2 232.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">setting between 0-50 which affects all selected</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(38.2 243.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">voices so adjustment to ear is recommended.</tspan></text>
