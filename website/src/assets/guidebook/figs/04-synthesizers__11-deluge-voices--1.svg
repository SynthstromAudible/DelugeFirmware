<text fill="currentColor" xml:space="preserve" transform="translate(5.9 13.2)" font-size="10" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Note on</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(5.9 24.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Single note triggers multiple voices instead</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(5.9 35.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">of the single default voice allocation.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(228.1 284.1)" font-size="10" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Note off</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(228.1 295.1)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Note released.</tspan></text>
