<text fill="currentColor" xml:space="preserve" transform="translate(193.2 50.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Velocity</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(193.2 60.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Relates to how hard a key is pressed</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(193.2 70.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">and how this reflects the volume of the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(193.2 80.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">note. This captures organic and human</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(193.2 90.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">like recordings.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(34.7 157.7)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Deluge pads are not velocity sensitive. The default velocity is 64 but this</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(24.9 167.7)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">default level can be changed in the settings options under the defaults menu.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(6.0 50.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Velocity is also a</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(6.0 60.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">modulation source to apply</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(6.0 70.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">to other parameters as well</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(6.0 80.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">as volume parameter.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(154.0 12.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">1</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(145.5 27.9)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Lighter</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(147.8 35.6)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">touch</tspan></text>
