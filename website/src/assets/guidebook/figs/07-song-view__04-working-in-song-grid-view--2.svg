<text fill="currentColor" xml:space="preserve" transform="translate(95.9 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">[</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(98.4 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">LAUNCH</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(135.4 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">]</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(40.8 22.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Mute / launch column pad enables the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(38.8 32.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">arming and triggering of clip sections in</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(67.6 42.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">time with a playing song.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 84.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">To launch clips GREEN mode must be active, selected</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 95.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">using the green [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(286.0 95.6)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">AUDITION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(329.0 95.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] button in song grid view.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 117.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">The ‘LAUNCH’ button colours are randomly applied laid</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 128.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">out in the same order as the song row arrangement view.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 139.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">The buttons trigger the clip sections. Individual pads can</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 150.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">also be triggered.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 173.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(247.0 173.6)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">PAD</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(264.8 173.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] to launch a clip</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 196.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(247.0 196.6)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">LAUNCH</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(284.0 196.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] to arm and then launch a section.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 219.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Hold [SHIFT] + [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(283.8 219.6)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">LAUNCH</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(320.8 219.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] to immediately launch.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 252.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Audition / Section Column</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 274.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">GREEN - Launch mode. Play clips in song mode.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 296.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">BLUE - Edit mode. Edit and create clips</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 318.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Tap a pad to change the mode. Hold the Audition / Section</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 328.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">pad while pressing a [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(306.0 328.6)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">PAD</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(323.9 328.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] can temporarily switch modes</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(219.0 338.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">until the mode button is released.</tspan></text>
