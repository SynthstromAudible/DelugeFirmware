<text fill="currentColor" xml:space="preserve" transform="translate(136.1 319.0)" font-size="6" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Audition</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(135.3 325.0)" font-size="6" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">/ Section</tspan></text>
