<text fill="currentColor" xml:space="preserve" transform="translate(12.0 115.7)" font-size="7.5" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">is set to a wavetable synth and CUSTOM 3 for Oscillator 2. If Only Osc 1 is a wavetable synth,</tspan></text>
