<text fill="currentColor" xml:space="preserve" transform="translate(68.1 20.4)" font-size="7.5" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">A file with a series of wave cycles. The ‘wavetable’ parameter</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(80.7 29.4)" font-size="7.5" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">navigates and selects the cycle used in the Oscillator</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(136.5 97.7)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Wavetable Position</tspan></text>
