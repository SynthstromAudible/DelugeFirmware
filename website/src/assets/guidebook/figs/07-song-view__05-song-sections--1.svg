<text fill="currentColor" xml:space="preserve" transform="translate(124.6 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">[</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(127.1 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(167.1 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">]</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(77.6 22.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Audition / section pad indicates the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(78.1 32.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">assignment of the clip to a section,</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(103.8 42.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">identified by its colour</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 73.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.3 73.9)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">LAUNCH</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(252.3 73.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] pad to play the clip row in song view.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 107.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Clips belong to the same section that is indicated by that specific</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 118.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">pad colour. Colours show the section groupings.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 141.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">CHANGE SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 152.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press [SHIFT] + [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(256.6 152.9)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(296.6 152.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] pad to toggle a colour coded section.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 175.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">MANUALLY ARM SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 186.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.3 186.9)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(255.3 186.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] pad of the desired section to manually arm the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 197.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">section.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 220.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">REPEAT MODE</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 231.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press &amp; hold [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(243.3 231.9)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(283.3 231.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] pad + (SELECT) to change number of</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 242.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">repeats: INFINITE (default), NUMBER, LAUNCH NON-</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 253.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">EXCLUSIVELY</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 276.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Display shows countdown of section repeats when a repeat number</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 287.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">is defined. To increase the sections to play prior to launch / stop,</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 298.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">turn (SELECT) to change the section countdown. Press (SELECT)</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 309.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">to cancel section countdown.</tspan></text>
