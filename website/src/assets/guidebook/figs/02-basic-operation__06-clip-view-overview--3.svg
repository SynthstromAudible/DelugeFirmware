<text fill="currentColor" xml:space="preserve" transform="translate(6.0 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Mute [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(31.0 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0.0">MUTE</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(56.5 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">] status is shown</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(6.0 22.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">on the mute / launch pads</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(6.0 32.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">located at the right of the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(6.0 42.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Deluge interface.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">The pads in the audition / section</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 22.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">column are located far right of</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 32.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">the Deluge interface and provide</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 42.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">manual play out of sounds.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 52.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Press [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(255.3 52.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0.0">AUDITION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(298.3 52.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">] to trigger a</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 62.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">sound.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 72.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">[SHIFT] + [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(271.0 72.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0.0">AUDITION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(314.0 72.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">] to select a</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 82.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">kit sound silently.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 98.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Unmuted rows / sounds</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 108.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">can be heard and are</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 118.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">indicated by a green</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 128.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">illuminated pad button.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 130.1)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Synth root note may show</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 140.1)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">two lit pad buttons if the full</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 150.1)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">octave is in focus on the grid.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 300.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Muted rows / sounds are</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 310.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">silent and are indicated</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 320.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">by a yellow illuminated</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 330.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">pad button.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 358.1)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Synths indicate the root note</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 368.1)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">by the illuminated pad button.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 396.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Pressing the mute pads</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 406.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">toggle mute status on and</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(8.4 416.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">off in clip view.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 259.7)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Kit sounds are selected by the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 269.7)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">row and hence only this row /</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 279.7)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">sound is affected by parameter</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 289.7)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">changes unless [AFFECT</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(227.3 299.7)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">ENTIRE] is selected.</tspan></text>
