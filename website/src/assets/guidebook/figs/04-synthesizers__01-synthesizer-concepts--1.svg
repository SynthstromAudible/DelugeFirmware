<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(228.3 110.0)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">AMP</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(288.2 110.0)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">OUTPUT</tspan></text>
<path transform="matrix(1,0,0,-1,-70.6,500.2)" stroke-width=".7" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor" d="M100.7 431.9H134.7"/>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(61.8 110.2)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">OSCILLATOR</tspan></text>
<text xml:space="preserve" transform="translate(39.0 162.0)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">One or more oscillators</tspan></text>
<text xml:space="preserve" transform="translate(50.3 171.3)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">provide the basic,</tspan></text>
<text xml:space="preserve" transform="translate(28.2 180.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">harmonically rich tone. Often</tspan></text>
<text xml:space="preserve" transform="translate(41.2 189.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">these are stacked and</tspan></text>
<text xml:space="preserve" transform="translate(31.0 199.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">detuned against each other</tspan></text>
<text xml:space="preserve" transform="translate(36.7 208.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">and mixed to thicken the</tspan></text>
<text xml:space="preserve" transform="translate(72.0 217.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">sound.</tspan></text>
<text xml:space="preserve" transform="translate(109.4 268.6)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Filters shape the sound by</tspan></text>
<text xml:space="preserve" transform="translate(103.1 277.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">subtracting harmonic content.</tspan></text>
<text xml:space="preserve" transform="translate(96.4 287.1)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Additional shaping is provided by</tspan></text>
<text xml:space="preserve" transform="translate(89.1 296.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">modulation via envelopes, LFOs and</tspan></text>
<text xml:space="preserve" transform="translate(133.6 305.7)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">other sources.</tspan></text>
<text xml:space="preserve" transform="translate(182.6 166.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">The audio signal amplitude</tspan></text>
<text xml:space="preserve" transform="translate(185.3 176.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">can also be shaped using</tspan></text>
<text xml:space="preserve" transform="translate(191.1 185.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">envelopes and manual</tspan></text>
<text xml:space="preserve" transform="translate(188.6 194.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">adjustments. At the final</tspan></text>
<text xml:space="preserve" transform="translate(182.3 204.1)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">stage, panning and volume</tspan></text>
<text xml:space="preserve" transform="translate(201.6 213.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">levels can be set.</tspan></text>
