<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(133.4 19.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">or MODULATION</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(206.5 11.4)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">ENVELOPE and /</tspan></text>
