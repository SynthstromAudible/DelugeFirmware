<g clip-path="url(#06-modulation__04-sidechain-compressor--4-clip_1)">
<path transform="matrix(1,0,0,-1,-175,342.8)" stroke-width=".7" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="color-mix(in srgb, currentColor 20%, var(--gb-paper))" d="M170.1 688.6V84.1"/>
<path transform="matrix(1,0,0,-1,-175,342.8)" d="M181.2 251.1H339.6V326.8H181.2Z" fill="var(--gb-paper)"/>
<text fill="currentColor" xml:space="preserve" transform="translate(25.5 24.2)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">A single global sidechain ‘bus’ feeds</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(15.4 32.2)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">destinations. The bus is driven typically by</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(9.1 40.2)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">kicks but others can be used. Factory kit kicks</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(11.8 48.2)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">are already setup to provide sidechain input.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(18.3 68.2)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Any new samples will be analysed and if</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(11.8 76.2)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">labelled as kicks or analysed as kicks will be</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(34.5 84.2)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">setup to input to the sidechain.</tspan></text>
<path transform="matrix(1,0,0,-1,-175,342.8)" d="M384.0 99.2H538.0V184.2H384.0Z" fill="var(--gb-paper)"/>
<text fill="currentColor" xml:space="preserve" transform="translate(217.6 166.8)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Multiple destinations can be sidechained.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(218.1 174.8)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">The parameters (volume ducking, attack,</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.1 182.8)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">release) for each can be independently set</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(213.2 190.8)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">up despite being supplied by the single bus.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.1 210.8)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Full parameter settings are accessible with</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.5 218.8)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">the sound editor. Volume Duck is available</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(242.2 226.8)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">on the parameter controls.</tspan></text>
<path transform="matrix(1,0,0,-1,-175,342.8)" stroke-width=".45" stroke-linecap="butt" stroke-linejoin="round" fill="none" stroke="currentColor" d="M329.1 99.5H371.0V109.7H329.1Z"/>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(156.0 240.7)" font-size="7" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">SIDECHAIN</tspan></text>
<path transform="matrix(1,0,0,-1,-175,342.8)" stroke-width=".45" stroke-linecap="butt" stroke-linejoin="round" fill="none" stroke="currentColor" d="M446.6 236.5H497.6V246.7H446.6Z"/>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(275.1 103.7)" font-size="7" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">FREQUENCY</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(230.6 68.6)" font-size="7" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">35</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(289.6 47.3)" font-size="7" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">LPF</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(189.8 18.4)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Example: sidechain patched to low-pass filter cutoff</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(189.6 26.4)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">frequency. Volume levels are common destinations.</tspan></text>
