<g clip-path="url(#06-modulation__04-sidechain-compressor--4-clip_1)">
<path transform="matrix(1,0,0,-1,-44.2,339.1)" stroke-width=".7" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="color-mix(in srgb, currentColor 20%, var(--gb-paper))" d="M424.7 688.6V84.1"/>
<path transform="matrix(1,0,0,-1,-44.2,339.1)" d="M50.2 251.1H208.7V326.8H50.2Z" fill="var(--gb-paper)"/>
<text fill="currentColor" xml:space="preserve" transform="translate(25.3 20.5)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">A single global sidechain ‘bus’ feeds</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(15.3 28.5)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">destinations. The bus is driven typically by</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(9.0 36.5)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">kicks but others can be used. Factory kit kicks</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(11.7 44.5)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">are already setup to provide sidechain input.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(18.1 64.5)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Any new samples will be analysed and if</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(11.7 72.5)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">labelled as kicks or analysed as kicks will be</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(34.4 80.5)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">setup to input to the sidechain.</tspan></text>
<path transform="matrix(1,0,0,-1,-44.2,339.1)" d="M253.0 99.2H407.1V184.2H253.0Z" fill="var(--gb-paper)"/>
<text fill="currentColor" xml:space="preserve" transform="translate(217.5 163.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Multiple destinations can be sidechained.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(217.9 171.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">The parameters (volume ducking, attack,</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.0 179.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">release) for each can be independently set</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(213.1 187.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">up despite being supplied by the single bus.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.0 207.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Full parameter settings are accessible with</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.4 215.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">the sound editor. Volume Duck is available</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(242.1 223.1)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">on the parameter controls.</tspan></text>
<path transform="matrix(1,0,0,-1,-44.2,339.1)" stroke-width=".45" stroke-linecap="butt" stroke-linejoin="round" fill="none" stroke="currentColor" d="M198.1 99.5H240.1V109.7H198.1Z"/>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(155.8 237.0)" font-size="7" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">SIDECHAIN</tspan></text>
<path transform="matrix(1,0,0,-1,-44.2,339.1)" stroke-width=".45" stroke-linecap="butt" stroke-linejoin="round" fill="none" stroke="currentColor" d="M315.6 236.5H366.7V246.7H315.6Z"/>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(275.0 100.0)" font-size="7" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">FREQUENCY</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(230.4 64.9)" font-size="7" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">35</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(289.4 43.6)" font-size="7" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">LPF</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(189.6 14.7)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Example: sidechain patched to low-pass filter cutoff</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(189.4 22.7)" font-size="7.5" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">frequency. Volume levels are common destinations.</tspan></text>
