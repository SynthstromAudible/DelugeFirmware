<text fill="currentColor" xml:space="preserve" transform="translate(6.0 255.2)" font-size="8" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">until the externally connected MIDI CC</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(6.0 265.2)" font-size="8" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">controller position is equal to the Deluge</tspan></text>
