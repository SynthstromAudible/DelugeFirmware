<text fill="currentColor" xml:space="preserve" transform="translate(124.6 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">[</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(127.1 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(167.1 12.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">]</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(77.6 22.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Audition / section pad indicates the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(78.1 32.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">assignment of the clip to a section,</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(103.8 42.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">identified by its colour</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 84.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.3 84.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">LAUNCH</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(252.3 84.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] pad to play the clip row in song view.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 118.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Clips belong to the same section that is indicated by that specific</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 129.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">pad colour. Colours show the section groupings.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 152.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">CHANGE SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 163.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press [SHIFT] + [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(256.6 163.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(296.6 163.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] pad to toggle a colour coded section.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 186.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">MANUALLY ARM SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 197.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">Press [</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(215.3 197.5)" font-size="9" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-style="italic"><tspan y="0" x="0">SECTION</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(255.3 197.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">] pad of the desired section to manually arm the</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(187.3 208.5)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0">section ready for playback of collective clips.</tspan></text>
