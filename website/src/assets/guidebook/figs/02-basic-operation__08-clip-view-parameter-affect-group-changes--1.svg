<text fill="currentColor" xml:space="preserve" transform="translate(31.4 448.0)" font-size="8" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Custom 1, 2, and 3 a remapped based on the preset chosen. These custom controls can mapped to other settings. Labels</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(28.3 458.0)" font-size="8" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">therefore on the control buttons are defaults only. Parameters can be remapped to the 8 controls, mapped for external MIDI</tspan></text>
