<text fill="currentColor" xml:space="preserve" transform="translate(199.5 312.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">(LOWER) Control</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(173.8 322.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Affects the selected parameter</tspan></text>
