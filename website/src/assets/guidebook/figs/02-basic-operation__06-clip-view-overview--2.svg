<text fill="currentColor" xml:space="preserve" transform="translate(73.9 21.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Navigate the grid using the up /</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(73.9 31.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">down (SCROLL</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(136.9 31.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">▼ ▲</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(154.7 31.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">) and left /</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(73.9 41.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">right (SCROLL◄►) scrolling and</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(73.9 51.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">zooming rotaries.</tspan></text>
