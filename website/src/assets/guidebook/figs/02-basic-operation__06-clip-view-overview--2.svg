<text fill="currentColor" xml:space="preserve" transform="translate(292.7 20.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">The undo / redo commands can be</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(292.7 30.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">used when editing notes.</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(292.7 40.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">For example: press [BACK / UNDO]</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(292.7 50.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">to undo the last note placement and</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(292.7 60.9)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">[SHIFT]+[REDO] to restore it.</tspan></text>
