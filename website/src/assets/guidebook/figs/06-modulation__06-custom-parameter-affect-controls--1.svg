<text fill="currentColor" xml:space="preserve" transform="translate(14.3 13.5)" font-size="11" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">There are three parameter functions contained in the affect parameter</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(14.3 26.0)" font-size="11" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">group. When using presets these will be set to a specific parameter within</tspan></text>
<text fill="currentColor" xml:space="preserve" transform="translate(14.3 38.5)" font-size="11" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">the preset. The Deluge convention is:-</tspan></text>
<path transform="matrix(1,0,0,-1,-164.2,694.6)" d="M407.0 544.9H538.0V617.5H407.0Z" fill="var(--gb-paper)"/>
<text fill="currentColor" xml:space="preserve" transform="translate(284.8 87.8)" font-size="11" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Custom 1</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(256.8 109.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Typically controls pitch for</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(263.3 119.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">sample based sounds.</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(249.5 141.8)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Portamento for synth sounds.</tspan></text>
<path transform="matrix(1,0,0,-1,-164.2,694.6)" d="M406.7 464.0H537.6V531.1H406.7Z" fill="var(--gb-paper)"/>
<text fill="currentColor" xml:space="preserve" transform="translate(284.4 174.2)" font-size="11" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Custom 2</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(250.7 196.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Typically controls decimation</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(256.4 206.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">for kits and sample-based</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(292.2 216.2)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">sounds.</tspan></text>
<path transform="matrix(1,0,0,-1,-164.2,694.6)" d="M406.6 387.0H537.6V454.0H406.6Z" fill="var(--gb-paper)"/>
<text fill="currentColor" xml:space="preserve" transform="translate(284.4 251.3)" font-size="11" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Custom 3</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(250.6 273.3)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Typically controls bitcrushing</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(256.4 283.3)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">for kits and sample-based</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(292.1 293.3)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">sounds.</tspan></text>
<path transform="matrix(1,0,0,-1,-164.2,694.6)" d="M181.1 300.8H404.7V367.9H181.1Z" fill="var(--gb-paper)"/>
<text fill="currentColor" xml:space="preserve" transform="translate(65.7 337.4)" font-size="11" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">Other Parameter Controls</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(21.9 359.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">While the custom controls are specifically designed to</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(23.4 369.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">be assigned to user parameters, the other parameter</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(21.7 379.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">affect controls can also be assigned to additional user</tspan></text>
<text fill="color-mix(in srgb, currentColor 65%, var(--gb-paper))" xml:space="preserve" transform="translate(83.4 389.4)" font-size="9" font-family="Arial, Helvetica, sans-serif"><tspan y="0" x="0.0">parameters if required.</tspan></text>
