<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" role="img" aria-label="The same C++ application and the same Rust BSP run on the Deluge and in the emulator. Only the endpoints under the BSP change, from real parts to their desktop stand-ins."><style>:root{--bg:#f6f7f8;--ink:#15191e;--muted:#56616c;--rule:#b9c2ca;--app:#0f6b7a;--appf:#d9ebee;--platf:#e6eaed;--gold:#8a6500;--goldf:#f5e0a0;--bad:#b3261e}@media (prefers-color-scheme:dark){:root{--bg:#12161a;--ink:#e8ecef;--muted:#9fa9b3;--rule:#46515b;--app:#5cc3d3;--appf:#16323a;--platf:#232a30;--gold:#e9bd4c;--goldf:#4a3a0c;--bad:#ff8a80}}</style><defs><marker id="f4-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker><marker id="f4-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gold)"/></marker><marker id="f4-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="f4-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker><marker id="f4-app" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--app)"/></marker></defs><rect width="100%" height="100%" rx="8" fill="var(--bg)"/><rect x="20" y="14" width="720" height="46" rx="6" fill="var(--appf)" stroke="var(--app)" stroke-width="1"/><text x="380" y="43" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="var(--ink)">The same C++ application</text><line x1="380" y1="60" x2="380" y2="74" stroke="var(--gold)" stroke-width="2" marker-end="url(#f4-gold)"/><rect x="20" y="76" width="720" height="32" rx="4" fill="var(--goldf)" stroke="var(--gold)" stroke-width="2"/><text x="380" y="97" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">libdeluge</text><line x1="380" y1="108" x2="380" y2="122" stroke="var(--gold)" stroke-width="2" marker-end="url(#f4-gold)"/><rect x="20" y="124" width="720" height="46" rx="6" fill="var(--platf)" stroke="var(--rule)" stroke-width="1"/><text x="380" y="146" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">The same Rust BSP</text><text x="380" y="162" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="var(--muted)">built for the device, or with its host arms for the emulator</text><line x1="195" y1="170" x2="195" y2="198" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#f4-ink)"/><line x1="565" y1="170" x2="565" y2="198" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#f4-ink)"/><text x="195" y="216" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">On the Deluge</text><text x="565" y="216" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">In dbt sim</text><rect x="20" y="228" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="36" y="246" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">PIC: pads, buttons, LEDs</text><rect x="390" y="228" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="406" y="246" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">Virtual PIC drawn in the window</text><rect x="20" y="259" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="36" y="277" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">OLED</text><rect x="390" y="259" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="406" y="277" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">Each frame goes to the window</text><rect x="20" y="290" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="36" y="308" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">Encoders</text><rect x="390" y="290" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="406" y="308" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">Turns arrive as quadrature edges</text><rect x="20" y="321" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="36" y="339" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">Codec</text><rect x="390" y="321" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="406" y="339" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">Your audio device paces the app</text><rect x="20" y="352" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="36" y="370" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">DIN MIDI</text><rect x="390" y="352" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="406" y="370" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">Virtual ports, Deluge Sim In and Out</text><rect x="20" y="383" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="36" y="401" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">SD card</text><rect x="390" y="383" width="350" height="27" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="406" y="401" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="var(--ink)">Memory disk or a FAT image file</text></svg>
