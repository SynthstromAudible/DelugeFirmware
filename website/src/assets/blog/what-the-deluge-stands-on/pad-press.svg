<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-label="A pad press on main arrives in the application as raw PIC bytes. On next it passes through the HAL and BSP and reaches the application as a pad event, and pad colours travel back the same way."><style>:root{--bg:#f6f7f8;--ink:#15191e;--muted:#56616c;--rule:#b9c2ca;--app:#0f6b7a;--appf:#d9ebee;--platf:#e6eaed;--gold:#8a6500;--goldf:#f5e0a0;--bad:#b3261e}@media (prefers-color-scheme:dark){:root{--bg:#12161a;--ink:#e8ecef;--muted:#9fa9b3;--rule:#46515b;--app:#5cc3d3;--appf:#16323a;--platf:#232a30;--gold:#e9bd4c;--goldf:#4a3a0c;--bad:#ff8a80}}</style><defs><marker id="f2-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker><marker id="f2-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gold)"/></marker><marker id="f2-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="f2-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker><marker id="f2-app" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--app)"/></marker></defs><rect width="100%" height="100%" rx="8" fill="var(--bg)"/><text x="20" y="26" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="var(--ink)">main</text><text x="262" y="26" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="var(--ink)">next</text><rect x="20" y="50" width="210" height="82" rx="6" fill="var(--appf)" stroke="var(--app)" stroke-width=