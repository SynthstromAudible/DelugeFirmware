<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-label="An example of the contract check: bindgen turns the C header into a Rust declaration, abi_pin compares it with the Rust export, and a wrong type stops the build."><style>:root{--bg:#f6f7f8;--ink:#15191e;--muted:#56616c;--rule:#b9c2ca;--app:#0f6b7a;--appf:#d9ebee;--platf:#e6eaed;--gold:#8a6500;--goldf:#f5e0a0;--bad:#b3261e}@media (prefers-color-scheme:dark){:root{--bg:#12161a;--ink:#e8ecef;--muted:#9fa9b3;--rule:#46515b;--app:#5cc3d3;--appf:#16323a;--platf:#232a30;--gold:#e9bd4c;--goldf:#4a3a0c;--bad:#ff8a80}}</style><defs><marker id="f5-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker><marker id="f5-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gold)"/></marker><marker id="f5-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="f5-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker><marker id="f5-app" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--app)"/></marker></defs><rect width="100%" height="100%" rx="8" fill="var(--bg)"/><text x="20" y="24" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="400" text-anchor="start" fill="var(--muted)" xml:space="preserve" style="white-space:pre">include/libdeluge/cv_gate.h</text><text x="400" y="24" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="var(--muted)">cv_gate.rs, with a mistake added</text><rect x="20" y="34" width="340" height="62" rx="6" fill="var(--goldf)" stroke="var(--gold)" stroke-width="2"/><text x="36" y="60" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="400" text-anchor="start" fill="var(--ink)" xml:space="preserve" style="white-space:pre">void deluge_cv_set(uint8_t channel,</text><text x="36" y="80" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="400" text-anchor="start" fill="var(--ink)" xml:space="preserve" style="white-space:pre">                   uint16_t value);</text><rect x="400" y="34" width="340" height="62" rx="6" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="416" y="60" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" fill="var(--ink)" xml:space="preserve" style="white-space:pre">extern &quot;C&quot; fn deluge_cv_set(channel: u8,</text><text x="416" y="80" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" fill="var(--ink)" xml:space="preserve" style="white-space:pre"><tspan>                     value: </tspan><tspan fill="var(--bad)" font-weight="700">u32</tspan><tspan>)</tspan></text><line x1="190" y1="96" x2="190" y2="146" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#f5-ink)"/><text x="200" y="125" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="var(--muted)">bindgen generates</text><rect x="20" y="148" width="340" height="50" rx="6" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/><text x="36" y="178" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" fill="var(--ink)" xml:space="preserve" style="white-space:pre">fn deluge_cv_set(channel: u8, value: u16)</text><line x1="190" y1="198" x2="190" y2="246" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#f5-ink)"/><line x1="570" y1="96" x2="570" y2="246" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#f5-ink)"/><rect x="100" y="248" width="560" height="44" rx="6" fill="var(--platf)" stroke="var(--ink)" stroke-width="1"/><text x="380" y="266" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)" xml:space="preserve" style="white-space:pre">abi_pin!(deluge_cv_set)</text><text x="380" y="283" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="var(--muted)">both sides must be the same function type</text><line x1="380" y1="292" x2="380" y2="324" stroke="var(--bad)" stroke-width="2" marker-end="url(#f5-bad)"/><rect x="190" y="326" width="380" height="50" rx="6" fill="var(--bg)" stroke="var(--bad)" stroke-width="2"/><text x="380" y="348" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="var(--bad)" xml:space="preserve" style="white-space:pre">error[E0308]: mismatched types</text><text x="380" y="366" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="var(--ink)">the build stops here</text></svg>
