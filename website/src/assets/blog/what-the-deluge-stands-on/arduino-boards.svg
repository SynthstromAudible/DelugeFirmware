<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="One line of Arduino code, digitalWrite(LED_BUILTIN, HIGH), runs unchanged on an Uno R3 and a Mega 2560, which use AVR chips, and on an Adafruit Metro M0 Express, which uses an ARM chip. The framework maps pin 13 to port pin PB5 on the Uno, PB7 on the Mega and PA17 on the Metro."><style>:root{--bg:#f6f7f8;--ink:#15191e;--muted:#56616c;--rule:#b9c2ca;--app:#0f6b7a;--appf:#d9ebee;--platf:#e6eaed;--gold:#8a6500;--goldf:#f5e0a0;--bad:#b3261e}@media (prefers-color-scheme:dark){:root{--bg:#12161a;--ink:#e8ecef;--muted:#9fa9b3;--rule:#46515b;--app:#5cc3d3;--appf:#16323a;--platf:#232a30;--gold:#e9bd4c;--goldf:#4a3a0c;--bad:#ff8a80}}</style><defs><marker id="fa-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker><marker id="fa-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gold)"/></marker><marker id="fa-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="fa-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker><marker id="fa-app" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--app)"/></marker></defs><rect width="100%" height="100%" rx="8" fill="var(--bg)"/><rect x="180" y="16" width="400" height="62" rx="6" fill="var(--appf)" stroke="var(--app)" stroke-width="1"/><text x="380" y="40" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">Your sketch</text><text x="380" y="62" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="400" text-anchor="middle" fill="var(--ink)" xml:space="preserve" style="white-space:pre">digitalWrite(LED_BUILTIN, HIGH);</text><line x1="380" y1="78" x2="380" y2="106" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#fa-ink)"/><text x="390" y="97" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="var(--muted)">the same code on every board</text><rect x="100" y="108" width="560" height="62" rx="6" fill="var(--goldf)" stroke="var(--gold)" stroke-width="2"/><text x="380" y="132" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">Arduino framework</text><text x="380" y="153" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="var(--muted)">knows each chip, and each board’s pin map</text><line x1="128" y1="170" x2="128" y2="226" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#fa-ink)"/><rect x="20" y="228" width="216" height="104" rx="6" fill="var(--platf)" stroke="var(--rule)" stroke-width="1"/><text x="128" y="254" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">Uno R3</text><text x="128" y="274" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="400" text-anchor="middle" fill="var(--muted)" xml:space="preserve" style="white-space:pre">ATmega328P · AVR</text><line x1="40" y1="288" x2="216" y2="288" stroke="var(--rule)" stroke-width="1"/><text x="128" y="314" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="var(--app)" xml:space="preserve" style="white-space:pre">pin 13 → PB5</text><line x1="380" y1="170" x2="380" y2="226" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#fa-ink)"/><rect x="272" y="228" width="216" height="104" rx="6" fill="var(--platf)" stroke="var(--rule)" stroke-width="1"/><text x="380" y="254" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">Mega 2560</text><text x="380" y="274" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="400" text-anchor="middle" fill="var(--muted)" xml:space="preserve" style="white-space:pre">ATmega2560 · AVR</text><line x1="292" y1="288" x2="468" y2="288" stroke="var(--rule)" stroke-width="1"/><text x="380" y="314" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="var(--app)" xml:space="preserve" style="white-space:pre">pin 13 → PB7</text><line x1="632" y1="170" x2="632" y2="226" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#fa-ink)"/><rect x="524" y="228" width="216" height="104" rx="6" fill="var(--platf)" stroke="var(--rule)" stroke-width="1"/><text x="632" y="254" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="var(--ink)">Metro M0 Express</text><text x="632" y="274" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="400" text-anchor="middle" fill="var(--muted)" xml:space="preserve" style="white-space:pre">ATSAMD21G18 · ARM</text><line x1="544" y1="288" x2="720" y2="288" stroke="var(--rule)" stroke-width="1"/><text x="632" y="314" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="var(--app)" xml:space="preserve" style="white-space:pre">pin 13 → PA17</text></svg>
