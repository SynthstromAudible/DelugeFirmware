repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: local
    hooks:
      # Rust has two separate workspaces (crates/ and src/bsp/rust/); cargo fmt
      # is per-manifest, so each needs its own hook. --check only (no rewrite) to
      # match the other formatters' fail-and-report behaviour in this file.
      - id: cargo-fmt-crates
        name: rustfmt (crates)
        entry: cargo fmt --manifest-path crates/Cargo.toml --all --check --
        language: system
        types: [rust]
        files: ^crates/(?!deluge_sample_convert/).*\.rs$
        pass_filenames: false
      - id: cargo-fmt-sample-convert
        # deluge_sample_convert is a production dependency of the Rust BSP, but
        # it's deliberately excluded from the crates/ workspace (build.rs
        # cc-compiles app C++ and it has a std test harness, so it can't share
        # the workspace's no_std/panic=abort profiles). `cargo fmt --all` above
        # happens to still reach it today, incidentally, because a workspace
        # member (deluge_sample_fill) path-deps on it -- but that's not
        # deliberate coverage: drop that dependency and it silently stops being
        # checked. Give it its own hook against its own manifest instead, same
        # as the BSP/harness split below.
        name: rustfmt (deluge_sample_convert)
        entry: cargo fmt --manifest-path crates/deluge_sample_convert/Cargo.toml --check --
        language: system
        types: [rust]
        files: ^crates/deluge_sample_convert/.*\.rs$
        pass_filenames: false
      - id: cargo-fmt-bsp
        name: rustfmt (bsp)
        entry: cargo fmt --manifest-path src/bsp/rust/Cargo.toml --check --
        language: system
        types: [rust]
        files: ^src/bsp/rust/(?!harness/).*\.rs$
        pass_filenames: false
      - id: cargo-fmt-harness
        name: rustfmt (harness)
        entry: bash -c 'for m in tests/component/differential/*/Cargo.toml src/bsp/rust/harness/*/Cargo.toml; do cargo fmt --manifest-path "$m" --check -- || exit 1; done'
        language: system
        types: [rust]
        files: ^(tests/component/differential/|src/bsp/rust/harness/).*\.rs$
        pass_filenames: false
      - id: libdeluge-boundary
        name: libdeluge platform boundary
        description: src/deluge must include <libdeluge/...>, not HAL headers directly
        entry: python3 scripts/check_platform_boundary.py
        language: system
        pass_filenames: false
        files: ^(src/deluge/|scripts/(check_platform_boundary\.py|platform_boundary_allowlist\.txt))
      - id: check-abi-surface
        name: every declared libdeluge function has a definition, a signature pin, a context tag and DELUGE_NOEXCEPT
        entry: python3 scripts/check_abi_surface.py --check --pins --tags --noexcept
        language: system
        pass_filenames: false
        files: ^(include/libdeluge/|src/bsp/rust/src/|src/bsp/rust/harness/|src/bsp/rust/build/|src/bsp/rust/Cargo\.toml|crates/|scripts/check_abi_surface\.py)
      - id: dsp-next-boundary
        name: dsp-next L0 boundary
        description: src/deluge/dsp-next must not include app layers, the legacy dsp/, or the HAL/BSP
        entry: python3 scripts/check_dsp_boundary.py
        language: system
        pass_filenames: false
        files: ^(src/deluge/dsp-next/|scripts/check_dsp_boundary\.py)
      - id: fixed-point-raw
        name: fixed-point raw-arithmetic ratchet
        description: raw Q31 helper calls, DSP-instruction asm and from_raw()/.raw() outside fixed_point.h may only shrink
        entry: python3 scripts/check_fixed_point_raw.py
        language: system
        pass_filenames: false
        files: ^(src/.*\.(c|cc|cpp|cxx|h|hh|hpp|inc)$|scripts/(check_fixed_point_raw\.py|fixed_point_raw_allowlist\.txt))
      - id: synth-boundary
        name: synth core boundary
        description: src/synth must not include app layers (model/processing/gui/storage/...), the legacy dsp/, or the HAL/BSP
        entry: python3 scripts/check_synth_boundary.py
        language: system
        pass_filenames: false
        files: ^(src/synth/|scripts/(check_synth_boundary\.py|synth_boundary_allowlist\.txt))
      - id: library-boundary
        name: library boundaries
        description: each standalone library may include only the standard library, itself and its declared dependencies
        entry: python3 scripts/check_library_boundary.py
        language: system
        pass_filenames: false
        files: ^(src/(plugin-api|instruments|effects|serialization|music-theory|deluge-project)/|scripts/(check|test_check)_library_boundary\.py)
      - id: clang-tidy
        name: clang-tidy on the changed lines of the libraries
        description: dsp-next, synth, effects, the instrument, plugin-api and serialization meet .clang-tidy on every line a commit changes
        entry: python3 scripts/check_tidy.py
        language: python
        additional_dependencies: ["clang-tidy==23.1.4"]
        types_or: [c, c++]
        files: ^src/(deluge/dsp-next|synth|effects|instruments|plugin-api|serialization)/
        require_serial: true
      - id: model-words
        name: the model names no plugin's state
        description: no file of the model may name a sound record or one of the Deluge instrument's words
        entry: python3 scripts/check_model_words.py
        language: system
        pass_filenames: false
        files: ^(src/deluge-project/|scripts/check_model_words\.py)
      - id: aligned-model-stacks
        name: model-stack buffers are aligned
        description: >-
          a model stack is built in place in a byte buffer and stores pointers with strd, which faults on an
          ARMv7 address that is not word-aligned; declare the buffer alignas(ModelStackWithAutoParam)
        entry: '^(?!.*alignas).*\b(char|std::byte|uint8_t)\s+\w+\s*\[MODEL_STACK_MAX_SIZE'
        language: pygrep
        files: ^(src|sim|tests)/.*\.(h|hpp|cpp|c)$
      - id: setting-menus
        name: no gesture sets a sound's instrument state or a song setting without its Edit
        description: no gesture under src/deluge/gui or src/scenes calls a setter, a record reseed or writes a field a setting Edit owns
        entry: python3 scripts/check_setting_menus.py
        language: system
        pass_filenames: false
        files: ^(src/deluge/gui/|src/scenes/|scripts/check_setting_menus\.py)
      - id: check-layer-rules
        name: UI layer-rule ratchet
        description: model/playback/storage/io/etc. must not reach into gui/hid directly (shrink-only baseline)
        entry: python3 scripts/check_layer_rules.py
        language: system
        pass_filenames: false
        # src/scenes/ is in this list because five of the rules are scoped to `src/scenes/**`
        # (scenes-includes-gui, scenes-includes-outside, scenes-no-frame-primitives,
        # scenes-no-root-ui, scenes-no-display) and without it a scenes-only commit never ran them.
        files: ^(src/deluge/|src/notify/|src/gfx/|src/ui/|src/scenes/|scripts/(check_layer_rules\.py|layer_rules_baseline\.txt))
      - id: check-citations
        name: legacy citations resolve (warning only; the UI trees are strict below)
        description: warn when a `foo.h:NN` citation points past EOF, into the licence header, at nothing but braces, or at a range that no longer contains the symbol written beside it
        # Warning-only over the whole tree: legacy's own comments carry citations this hook only
        # reports. The UI trees are held strictly by `check-citations-ui` below and by CI's lint job.
        entry: python3 scripts/check_citations.py
        language: system
        pass_filenames: false
        files: ^(src/scenes/|src/ui/|sim/scenes_spec/|tests/spec/|src/deluge/|scripts/(check_citations\.py|citation_exceptions\.txt))
      - id: check-citations-ui
        name: the UI trees' legacy citations resolve
        description: a `foo.cpp:NN` citation in the ported UI must point at the code it names; cite the symbol instead
        entry: python3 scripts/check_citations.py --strict --paths src/scenes src/shell src/ui sim/scenes_spec tests/unit/spec/shell tests/unit/spec/ui tests/unit/spec/gui src/deluge/gui/ui/shell_ src/deluge/gui/ui/menu_view_of src/deluge/util/shell_menu_entry
        language: system
        pass_filenames: false
        files: ^(src/scenes/|src/shell/|src/ui/|sim/scenes_spec/|tests/unit/spec/(shell|ui|gui)/|src/deluge/gui/ui/(shell_|menu_view_of)|src/deluge/util/shell_menu_entry|scripts/(check_citations\.py|citation_exceptions\.txt))
      - id: check-doc-hygiene
        name: the UI trees' docs carry no history and no line citations into our own code
        description: comments say what the code is and why; task, review and spec breadcrumbs and `our_file.cpp:NN` citations are refused
        entry: python3 scripts/check_doc_hygiene.py --strict
        language: system
        pass_filenames: false
        files: ^(src/scenes/|src/shell/|src/ui/|sim/scenes_spec/|tests/unit/spec/(shell|ui|gui)/|src/deluge/gui/ui/(shell_|menu_view_of)|src/deluge/util/shell_menu_entry|scripts/check_doc_hygiene\.py)
