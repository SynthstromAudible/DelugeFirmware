repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: local
    hooks:
      # One Cargo workspace at the root (Cargo.toml): `cargo fmt --all` checks every member. --check only (no
      # rewrite) to match the other formatters' fail-and-report behaviour in this file.
      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --all --check --
        language: system
        types: [rust]
        files: ^(src/base/alloc/|src/storage/|src/platform/device/|src/platform/host/link/|tests/trees/host/rust/|tests/harness/|tests/component/differential/).*\.rs$
        pass_filenames: false
      - id: check-abi-surface
        name: every declared libdeluge function has a definition, a signature pin, a context tag and DELUGE_NOEXCEPT
        entry: python3 scripts/check_abi_surface.py --check --pins --tags --noexcept
        language: system
        pass_filenames: false
        files: ^(include/libdeluge/|src/platform/device/src/|tests/harness/|src/platform/device/build/|src/platform/device/Cargo\.toml|Cargo\.toml$|tests/trees/host/rust/|src/base/alloc/|src/storage/(resource|sample/(convert|fill|peaks|reader|source)|stream)/|scripts/check_abi_surface\.py)
      - id: registry-readme
        name: tests/README.md's table matches tests/registry.toml
        entry: python3 scripts/tasks/task-test.py --update-readme
        language: system
        pass_filenames: false
        files: ^(tests/registry\.toml|tests/README\.md|scripts/tasks/(harness_registry|task-test)\.py)$
      - id: fixed-point-raw
        name: fixed-point raw-arithmetic ratchet
        description: raw Q31 helper calls, DSP-instruction asm and from_raw()/.raw() outside fixed_point.h may only shrink
        entry: python3 scripts/check_fixed_point_raw.py
        language: system
        pass_filenames: false
        files: ^(src/.*\.(c|cc|cpp|cxx|h|hh|hpp|inc)$|scripts/(check_fixed_point_raw\.py|fixed_point_raw_allowlist\.txt))
      - id: layers
        name: every include is where scripts/layers.toml allows it
        description: libraries include only what they declare, rule counts only fall, no new src/ directory, no shadowed include path, the legacy tree only shrinks
        entry: python3 scripts/check_layers.py
        language: system
        pass_filenames: false
        files: ^(src/|tests/|include/|scripts/(check_layers\.py|layers\.toml|layers_baseline\.txt|test_check_layers\.py))
      - id: clang-tidy
        name: clang-tidy on the changed lines of the libraries
        description: the DSP library, synth, effects, the instrument, plugin, serialization and controls meet .clang-tidy on every line a commit changes
        entry: python3 scripts/check_tidy.py
        language: python
        additional_dependencies: ["clang-tidy==23.1.4"]
        types_or: [c, c++]
        files: ^src/(dsp|synth|effects|instruments|plugin|serialization|ui/controls)/
        require_serial: true
      - id: model-words
        name: the model names no plugin's state
        description: no file of the model may name a sound record or one of the Deluge instrument's words
        entry: python3 scripts/check_model_words.py
        language: system
        pass_filenames: false
        files: ^(src/project/|scripts/check_model_words\.py)
      - id: aligned-model-stacks
        name: model-stack buffers are aligned
        description: >-
          a model stack is built in place in a byte buffer and stores pointers with strd, which faults on an
          ARMv7 address that is not word-aligned; declare the buffer alignas(ModelStackWithAutoParam)
        entry: '^(?!.*alignas).*\b(char|std::byte|uint8_t)\s+\w+\s*\[MODEL_STACK_MAX_SIZE'
        language: pygrep
        files: ^(src|tests)/.*\.(h|hpp|cpp|c)$
      - id: setting-menus
        name: no gesture sets a sound's instrument state or a song setting without its Edit
        description: no gesture under src/deluge/gui or src/ui/scenes calls a setter, a record reseed or writes a field a setting Edit owns
        entry: python3 scripts/check_setting_menus.py
        language: system
        pass_filenames: false
        files: ^(src/deluge/gui/|src/ui/scenes/|scripts/check_setting_menus\.py)
      - id: test-support-names
        name: no per-directory support/ file shadows tests/support/
        description: a file under a support/ folder in tests/ never has a path tests/support/ also has
        entry: python3 scripts/check_test_support_names.py
        language: system
        pass_filenames: false
        files: ^(tests/|scripts/check_test_support_names\.py)
      - id: check-layer-rules
        name: UI layer-rule ratchet
        description: model/playback/storage/io/etc. must not reach into gui/hid directly (shrink-only baseline)
        entry: python3 scripts/check_layer_rules.py
        language: system
        pass_filenames: false
        # Its rows cover all of src/ (the legacy tree, the toolkit, the shell, the scenes, the host build) and tests/.
        files: ^(src/|tests/|scripts/(check_layer_rules\.py|layer_rules_baseline\.txt))
      - id: check-citations
        name: legacy's line citations resolve (warning only)
        description: warn when a `foo.h:NN` citation in src/deluge points past EOF, into the licence header, at nothing but braces, or at a range that no longer contains the symbol written beside it
        # Warning-only: legacy's own comments carry line citations this hook only reports. The UI trees cite no
        # line at all, which check-doc-hygiene holds strictly.
        entry: python3 scripts/check_citations.py
        language: system
        pass_filenames: false
        files: ^(src/deluge/|scripts/check_citations\.py)
      - id: check-doc-hygiene
        name: the UI trees' docs carry no history, no line numbers and no paths that name no file
        description: comments say what the code is and why, and cite a file and a symbol; task, review and spec breadcrumbs, `file.cpp:NN` and bare `:NN` citations, and a path that names no one file are refused
        entry: python3 scripts/check_doc_hygiene.py --strict
        language: system
        pass_filenames: false
        # Every commit: a cited path dangles when the file it names moves or loses the symbol, wherever that is.
        always_run: true
      - id: spec-comparisons
        name: no spec judges a comparison with to_be_true(), to_be_false(), to_be_truthy() or to_be_falsy()
        description: a staged spec may not add expect(a == b).to_be_true() or .to_be_truthy(), whose failure prints no value; use to_equal and the other value matchers (tests/README.md, "A unit spec")
        entry: python3 scripts/check_spec_comparisons.py --staged
        language: system
        pass_filenames: false
        files: ^tests/.*\.(cpp|h|hpp|inc)$|^scripts/check_spec_comparisons\.py$
