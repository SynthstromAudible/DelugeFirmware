# Umbrella staticlib linked by the C++ unit-test tree; re-exports the member crates' C ABIs.
[package]
name = "deluge_test_rust"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "deluge_test_rust"
crate-type = ["staticlib", "rlib"]

[dependencies]
deluge_base_alloc = { path = "../../../../src/base/alloc" }
deluge_storage_resource = { path = "../../../../src/storage/resource" }
# Unconditional: the app's sample and wavetable header parsing calls it, with no C++ fallback.
deluge_audio_format = { package = "deluge-audio-format", git = "https://github.com/FirestormAudio/deluge-sdk.git", rev = "89303a3632391a122baded3ff12199942c046b5a", features = ["c-abi"] }
# Keep the rev with src/platform/device/Cargo.toml's deluge-sdk pin.
# The sample crates below are optional, pulled in only by `sample_abi`.
deluge_storage_sample_source = { path = "../../../../src/storage/sample/source", optional = true }
deluge_storage_sample_fill = { path = "../../../../src/storage/sample/fill", optional = true }
# std-backed implementation for `deluge_storage_sample_fill`'s context-table mutex.
critical-section = { version = "1", optional = true }
deluge_storage_sample_reader = { path = "../../../../src/storage/sample/reader", optional = true }
deluge_storage_sample_peaks = { path = "../../../../src/storage/sample/peaks", optional = true }
deluge_storage_stream = { path = "../../../../src/storage/stream", optional = true }

[features]
## Forwards the allocator's AddressSanitizer poisoning. Opt-in, for a link built with
## `-fsanitize=address`; no build enables it.
asan = ["deluge_base_alloc/asan"]
## Exports the sample crates' C ABIs (source cursor, fill, reader, stream slots); the
## `sample_reader` spec's separate umbrella build enables it. Each member's `c_abi` feature is what
## emits its `#[no_mangle]` symbols; the dependency alone would compile them dead.
sample_abi = [
    "dep:deluge_storage_sample_source",
    "deluge_storage_sample_source/c_abi",
    "dep:deluge_storage_sample_fill",
    "deluge_storage_sample_fill/native_fill",
    "deluge_storage_sample_fill/app_convert",
    "dep:critical-section",
    "critical-section/std",
    "dep:deluge_storage_sample_reader",
    "deluge_storage_sample_reader/c_abi",
    "dep:deluge_storage_sample_peaks",
    "deluge_storage_sample_peaks/c_abi",
    "deluge_storage_sample_peaks/test_support",
    "dep:deluge_storage_stream",
    "deluge_storage_stream/c_abi",
]
