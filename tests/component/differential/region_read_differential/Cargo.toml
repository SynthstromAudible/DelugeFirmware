# Byte-identical gate for the sample range reader (`deluge_storage_sample_reader`). Pure Rust: the
# oracle reads resident chunk payloads through
# `deluge_storage_sample_fill::chunk`.
[package]
name = "region-read-differential"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[dev-dependencies]
# The reader under test.
deluge_storage_sample_reader = { path = "../../../../src/storage/sample/reader" }
# A real resource manager over a real heap.
deluge_storage_resource = { path = "../../../../src/storage/resource" }
# `native_finish` runs the real convert/stitch/publish tail, so the chunks' trailing-slack bytes
# are really stitched rather than hand-seeded.
deluge_storage_sample_fill = { path = "../../../../src/storage/sample/fill", features = ["native_fill"] }
deluge_base_alloc = { path = "../../../../src/base/alloc" }
# The test binary's host stand-ins for `deluge_storage_resource`'s C-ABI critical-section primitives
# need a registered `critical-section` implementation.
critical-section = { version = "1", features = ["std"] }
