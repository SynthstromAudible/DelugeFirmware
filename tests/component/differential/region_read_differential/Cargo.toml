# region-read-differential — U1 Task 5: the sample range-reader's byte-identical GATE. Standalone
# harness crate (NOT a workspace member — mirrors `region_fill_differential`).
#
# Pure Rust (U4d): this crate used to `cc`-compile a slice of the app's C++ (`storage/cluster/
# cluster.h`'s `StreamedChunk`, including its real `frame_read_origin`/`payload_with_trailing_slack`)
# into its own test binary as the current-read-path oracle. U4d relocated the streamed chunk's
# storage (construct + accessors) into `deluge_sample_fill::chunk` (Rust) and deleted
# `frame_read_origin` for the streamed role entirely, so this crate's own oracle
# (`tests/differential.rs`'s `oracle_frame`) now reads a chunk's resident payload directly through
# the Rust accessor — no C++ shim, no `cc` build-dependency, needed at all.
#
# `edition = "2024"`: this crate's test file uses `unsafe extern "C"` blocks (matching the reader
# crate under test and its own dependency graph, all `edition = "2021"`/`"2024"` with that syntax
# already in use).
[package]
name = "region-read-differential"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
# The reader under test: `deluge_sample_reader_open`/`_window`/`_advance`/`_seek`/`_close`/`_ok` +
# the stateless `deluge_sample_read` (Tasks 1, 3, 4). Pulls in `deluge_sample_fill` (native_fill,
# which itself pulls in `deluge_sample_convert` — already `cc`-compiling `convert.cpp`/`stitch.cpp`
# via ITS OWN build.rs, so this crate needs no argon/SIMDe fetch of its own) and `deluge_resource`
# transitively.
deluge_sample_reader = { path = "../../../../crates/deluge_sample_reader" }

[dev-dependencies]
# A real manager over a real heap (`ChunkHarness`, `tests/differential.rs`) — the same real-chunk
# shape `region_fill_differential`'s own `tests/native_finish_glue.rs` uses.
deluge_resource = { path = "../../../../crates/deluge_resource" }
# `deluge_streaming_set_fill_context`/`FillContext`, and `native_finish` to drive the REAL
# convert/stitch/publish tail (so the resident chunks' trailing-slack straddle bytes are the real
# stitched bytes, not hand-seeded) over the synthetic, deterministic sample this harness builds.
deluge_sample_fill = { path = "../../../../crates/deluge_sample_fill", features = ["native_fill"] }
deluge_alloc = { path = "../../../../crates/deluge_alloc" }
# `deluge_resource`'s `sync::Masked` calls three C-ABI critical-section primitives; this crate's
# own test binary supplies host stand-ins (single-threaded, never the audio-ISR context) and needs
# a registered `critical-section` implementation to link them — same std-backed impl every sibling
# host test in this dependency graph already uses.
critical-section = { version = "1", features = ["std"] }
