[package]
name = "region-source-differential"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

# SR2d-5's payload-offset gate. Standalone harness crate (NOT a workspace
# member -- mirrors region_fill_differential): host-only,
# proves the Rust region-port cursor (`deluge_sample_source::cursor::SampleSource<
# ManagerResidency>`) resolves a region's PAYLOAD -- not its chunk header --
# when driven over a REAL streamed chunk backing.
#
# The retired region_differential harness's RustBackend/HarnessResidency (`rust_backend.rs`)
# seeded each cluster's "payload" directly into a bare `Vec<u8>` -- payload ==
# backing there, so `ManagerPin::payload()`'s pre-fix bug (returning the raw
# manager backing pointer, i.e. the chunk HEADER, instead of routing through
# `deluge_streaming_chunk_payload` == `backing + payload_offset`) was
# invisible to that harness. This crate closes that gap: the chunk backing a
# `deluge_resource` asset constructs is a REAL streamed chunk
# (`deluge_sample_fill::chunk::StreamedChunk`, U4d -- pure Rust, no C++ shim
# needed) at a NON-ZERO payload offset from its manager backing pointer --
# exactly the geometry a backing-vs-payload confusion needs to be
# byte-detectable.

[dependencies]
# Nothing: src/lib.rs is a pure, dependency-free `make_ramp` helper (the SAME
# formula the retired region_differential harness's `ops::make_ramp` used, and
# `region_fill_differential::ramp` uses today).

[dev-dependencies]
# The cursor under test.
deluge_sample_source = { path = "../../../../crates/deluge_sample_source" }
# Builds the real `deluge_resource` manager + asset `ManagerResidency` sits on top
# of, and the test heap it lives in.
deluge_resource = { path = "../../../../crates/deluge_resource" }
fs_alloc = { package = "deluge_alloc", path = "../../../../crates/deluge_alloc" }
# The real streamed-chunk construct + payload accessor + payload-offset C-ABI
# (`deluge_sample_fill::chunk`, U4d) -- no `native_fill` feature needed, this
# gate never drives `native_begin`/`native_finish`, only chunk construction
# and payload resolution.
deluge_sample_fill = { path = "../../../../crates/deluge_sample_fill" }
# `deluge_resource::sync::Masked` (used by both `deluge_resource` and
# `deluge_sample_source`'s cursor) calls out to three `extern "C"`
# critical-section primitives; this crate links both as plain non-test rlibs,
# so `tests/real_chunk_gate.rs` supplies host stand-ins backed by this crate,
# same pattern the retired region_differential harness's own `tests/differential.rs` used.
critical-section = { version = "1", features = ["std"] }
