# tests/efatfs_core.rs `#[path]`-includes src/bsp/rust/src/efatfs_core.rs directly (see
# that test's module doc): the real BSP module, reused unmodified so the host test drives
# the exact device logic. That file already formats cleanly under the BSP crate's own
# `edition = "2024"` (checked by the `cargo-fmt-bsp` pre-commit hook against its true
# manifest) but this crate is `edition = "2021"`, so a plain `cargo fmt` here disagrees with
# `cargo-fmt-bsp` on its import order. `ignore` (nightly-only, hence `unstable_features`;
# this crate's rust-toolchain.toml already pins nightly) excludes it from THIS crate's
# formatting run without touching the BSP-owned file or either crate's edition.
unstable_features = true
ignore = ["**/bsp/rust/src/efatfs_core.rs"]
