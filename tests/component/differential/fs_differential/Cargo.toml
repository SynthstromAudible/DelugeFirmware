[package]
name = "fs-differential"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
# Vendored in-tree (see crates/embedded-fatfs/VENDOR.md); not published on crates.io.
embedded-fatfs = { path = "../../../../crates/embedded-fatfs", default-features = false, features = ["lfn", "alloc"] }
embedded-io-async = "0.7"
# `block_on` drives embedded-fatfs's async API synchronously; the RAM disk never pends.
embassy-futures = "0.1.2"
# The block-device driver/adapter stack the on-device SD path uses, run here over a RAM disk.
block-device-driver = { path = "../../../../crates/block-device-driver" }
block-device-adapters = { path = "../../../../crates/block-device-adapters" }
aligned = "0.4"

[dev-dependencies]
# `tests/efatfs_core.rs` drives the BSP's storage-generic efatfs core.
deluge-bsp-rust = { path = "../../../../src/bsp/rust", default-features = false }
