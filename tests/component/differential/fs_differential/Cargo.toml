[package]
name = "fs-differential"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
# deluge-sdk's fork, published on crates.io; the import name stays `embedded_fatfs`.
embedded-fatfs = { package = "deluge-embedded-fatfs", version = "0.2", default-features = false, features = ["lfn", "alloc"] }
embedded-io-async = "0.7"
# `block_on` drives embedded-fatfs's async API synchronously; the RAM disk never pends.
embassy-futures = "0.1.2"
# The block-device driver/adapter stack the on-device SD path uses, run here over a RAM disk.
block-device-driver = "0.2"
block-device-adapters = { package = "deluge-block-device-adapters", version = "0.3" }
aligned = "0.4"

[dev-dependencies]
# `tests/efatfs_core.rs` drives the BSP's storage-generic efatfs core.
deluge-bsp-rust = { path = "../../../../src/bsp/rust", default-features = false }
