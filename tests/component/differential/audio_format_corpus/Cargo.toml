# Corpus gate for the audio-format decoder: `deluge-audio-format`'s `parse` against the C++ header entry points
# over real WAV/AIFF files. Its C++ side is the `golden_vt_render` binary the `golden-vt-render`
# product builds; its gate's explanation is in the root Cargo.toml.
[package]
name = "audio_format_corpus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dev-dependencies]
deluge_audio_format = { package = "deluge-audio-format", git = "https://github.com/FirestormAudio/deluge-sdk.git", rev = "d50b00d9ef4437b13e0ced897d7711760734d61e", features = ["c-abi"] }
