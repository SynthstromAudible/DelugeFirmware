[package]
name = "region-fill-differential"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Standalone crate, not a workspace member: it `cc`-compiles a C++ reference slice into its test
# binary and must stay off the firmware Cargo graph.

[dependencies]
# Supplies the compiled `convert_word`/`stitch_boundaries` objects `cpp/harness_shim.cpp` links
# against, and the argon/SIMDe cache build.rs includes. build.rs must not recompile them (duplicate
# symbols).
deluge_sample_convert = { path = "../../../../crates/deluge_sample_convert" }

[dev-dependencies]
# A real resource manager and the test heap it is built over.
deluge_resource = { path = "../../../../crates/deluge_resource" }
fs_alloc = { package = "deluge_alloc", path = "../../../../crates/deluge_alloc" }
# `native_fill` enables `native_begin`/`native_finish`, which `tests/native_finish_glue.rs` drives.
deluge_sample_fill = { path = "../../../../crates/deluge_sample_fill", features = ["native_fill"] }
# `deluge_sample_fill`'s `FILL_CONTEXTS` uses a `CriticalSectionRawMutex`, which needs a registered
# `critical-section` implementation at link time.
critical-section = { version = "1", features = ["std"] }

[build-dependencies]
cc = "1"
