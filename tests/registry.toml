# unavailable: cargo cannot build or run this package at all (nested-workspace
# error, see gates for root cause) -- unwired-but-valuable, not scheduled for
# deletion. The fix is known and deliberately unapplied; see gates.
[[harness]]
name = "alloc-fuzz"
path = "crates/deluge_alloc/fuzz"
level = "component"
runner = "script"
kind = "fuzz"
status = "unavailable"
gates = "the TLSF allocator must not corrupt its free lists under arbitrary alloc/free sequences -- UNRUNNABLE as it stands: `cargo build`/`cargo fuzz run` on this package fails with cargo error \"current package believes it's in a workspace when it's not\", reproduced on stable, 1.85, and nightly cargo. This is NOT the `exclude` in crates/Cargo.toml failing to take effect -- `cargo metadata --manifest-path crates/Cargo.toml` exits 0 and does not list this package, so the exclude works. The real cause is that `deluge_alloc/fuzz` is nested inside `deluge_alloc/`, a real workspace member; cargo's directory walk finds that ancestor and attributes the fuzz package to the crates/ workspace regardless of the exclude, then errors because it isn't a member. The standard cargo-fuzz remedy is an empty `[workspace]` table in crates/deluge_alloc/fuzz/Cargo.toml, which this registry deliberately has NOT applied -- `cargo metadata` succeeding is not evidence the fuzzer builds or runs, and this registry exists to stop us recording things as working that we have not run. Next step for whoever picks this up: add the empty `[workspace]` table, then actually run `cargo +nightly fuzz run ops` (or `slab`) before flipping status off `unavailable`. The brief's `run` target name (\"alloc\") was also wrong -- the real targets, per fuzz_targets/, are \"ops\" and \"slab\"."
build = []
run = ["cargo", "+nightly", "fuzz", "run", "ops"]
requires = ["cargo"]
tier = "manual"
runtime = "unbounded"

