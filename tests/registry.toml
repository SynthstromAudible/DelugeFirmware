[[harness]]
name = "song-save-channel"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "a song save must build its whole document in memory and place it on the card through the write channel, then read it back and check its length, head and tail. One leg: neither channel has a feature switch, so the document write rides the write channel and every other step the byte channel, with nothing on the inline arm (SS-ACCOUNTED). The document write uses a DIFFERENT channel from the rest of the flow, and that is the whole difficulty: the byte channel copies into a fixed staging buffer and refuses anything over 8 KiB, and no song has ever fitted it -- the smallest measured is 11.5 KB and the largest 1.10 MB. SS-GREW is what keeps the rest honest, because the default harness song is about 11.5 KB against a 32 KB initial buffer and a save of it never grows the buffer at all; the fixture is inflated to 100 KB and SS-GREW fails if it stops being big enough. SS-PARSES loads the result back as a song, because bytes of the right length are not the claim. SS-INTACT requires that overwriting an existing song leaves a song behind whichever way the save went, which is the property that justifies writing to a temp name and renaming. SS-BACKMIDSAVE and SS-EXITMIDSAVE press BACK and fire the long-press exit while the save is still running, and require the save screen to stay open: leaving it mid-save would let the save's own close() read below the bottom of the UI stack. Both first require that the save really is still in flight, so a save that finished early fails the check instead of passing it for free. SS-HELD holds the write channel far past the save's stall bound and requires the save to complete anyway, with the same bytes an unheld save of the same song writes: a running write cannot be cancelled, so giving up on it only releases the serialiser it is still copying from."
scenario = "song_save_channel"
markers = ["SS-BACKMIDSAVE", "SS-EXITMIDSAVE", "SS-GREW", "SS-SAVED", "SS-VERIFIED", "SS-PARSES", "SS-INTACT", "SS-HELD", "SS-SUMMARY", "SS-RESULT"]
result = "SS-RESULT failures=0"
