ect on the menu refused while a kit import whose loads the loader holds is out, and once it ends the gate released and the kit holding its drums; IM-STALL requires a multisample import whose second file is held past the stall bound to abort with the ranges and the loaded files' reasons as they were, just the menu closed, the browser open, and the gate released. SC-TIER requires, for every claim and the slice, that no sample was read from the card on the interaction tier; SC-GATE requires the browser to refuse its select encoder while an explicit claim's load is held, and the gate released once the claim ends; SC-STALL requires an explicit claim whose load is held past the stall bound to give up, leaving the holder unbound, the browser open and the gate released; SC-SUPERSEDE requires an auto-load claim the cursor leaves while its pitch detection is out, for a next preview that lands at once and for one still loading, to be cancelled once and drain before the next claim starts, with only the next file's claim finishing."
