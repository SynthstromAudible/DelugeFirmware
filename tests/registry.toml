ng's wavetable, on a context whose folder probe a dropped load left out, must bind the wavetable to its collected copy. A load of the kit's second drum on a context that has learnt the kit's folder must bind the drum to its copy there, though a load of the same drum on no context, dropped with its request out, was answered with a miss first: a dropped load's answer is discarded, not taken by the next lookup of the path. The same must hold with both loads live: a load of the second drum on no context asks first, and a load of it on the context that knows the kit's folder, looking first once that answer is back, must bind the drum to its copy there rather than take the other load's miss for fewer candidates as its own."
