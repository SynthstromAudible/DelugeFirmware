gates = "synth and kit presets written through the firmware's serialisers, each naming samples of its own, must load through the real preset browser -- opened by the clip view's LOAD gesture, selected by a by-path listing, loaded by Select -- as a user's load binds them: a synth preset into the boot song's synth clip (the synth named after the preset, its sample bound, the browser closed), a kit preset into a kit clip (three drums named and bound to their samples, each with a NoteRow), a synth preset into a kit row (the row's drum named after the preset, its sample bound), and a clone from the long-press menu (a new synth under a variation of the preset's name, its sample bound, edited, the browser closed). PL-TIER requires, for every load, that its documents were read and its samples loaded, and no sample read from the card on the interaction tier. PL-RACE requires a clone made straight after the selection, without waiting for its scroll-load, to survive it. PL-SUPERSEDE requires, with the loader holding every sample load, a scroll onto a heavy kit and on to a light one before the heavy kit's samples land to leave the light kit loaded, the heavy kit never swapped in and nothing of it left in the song, not even its param managers. PL-GATE requires an output-type button and an encoder turn refused while a commit whose sample the loader holds is out, and once it ends the gate released, the preset loaded and the browser closed. PL-STALL requires a commit whose sample load is held past the stall bound to swap its synth in with that holder empty, the gate released and the browser closed. The AQ legs pick presets without the browser, by real gestures: AQ-NEW requires an empty session pad to make a synth track on the first unused synth preset with its sample bound, and shift+SYNTH to give that clip a new blank synth under an unused slot name; AQ-CHANGE requires the clip view's KIT button to land the empty clip on the first unused kit preset with its drum bound; AQ-NAVIGATE