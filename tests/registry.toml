markers = ["SS-BACKMIDSAVE", "SS-EXITMIDSAVE", "SS-GREW", "SS-SAVED", "SS-VERIFIED", "SS-PARSES", "SS-INTACT", "SS-HELD", "SS-UPGRADE", "SS-SUMMARY", "SS-RESULT"]
