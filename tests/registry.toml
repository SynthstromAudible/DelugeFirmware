# Every test in the repository. `dbt test` reads this; tests/README.md's table is
# generated from it. Every entry must state what it gates -- a test that
# cannot say what regression it catches is one nobody can decide to delete.
#
# level:  unit        -- one function or module, against mocks or none
#         component   -- one component against a reference, a stress load or a fuzzer
#         integration -- the whole app, booted, driven end to end
# runner: ctest    -- configured, built and run from `source` into `tree`
#         cargo    -- a cargo test suite, run in `path`
#         scenario -- a golden_vt_render scenario, judged by its markers, result and check
#         corpus   -- a tests/integration/corpus/<corpus_runner>_run.py sweep, which judges itself
#         script   -- anything else, run in `path`
# kind:   unit | property | differential | regression | sanitizer | simulation | benchmark (harness_registry.KINDS)
# path:   cargo and script entries only -- the directory their commands run in
# requires: probes (harness_registry.PROBES) the test needs; none when absent
# status: gate          -- a standing regression gate; breakage is a real signal
#         investigative -- a rig for answering a question, run on demand
#         unavailable   -- cannot run here; NOT scheduled for deletion -- see
#                          this entry's comment for why and what would change it
# tier:   pr | nightly | manual -- cumulative: `dbt test --tier nightly` runs pr too
# alone:  true -- run one at a time after the parallel set: the test measures real
#         time, or runs its own worker pool across every CPU
# job:    render | app | model | storage | unit | unit-cpp | unit-cpp-variants | tooling -- the CI job that runs it
#         (harness_registry.JOBS); render, app and model run a golden_vt_render built once, so their tests build
#         only golden-vt-render
# runtime_s: whole seconds a run takes with its build products already built (a comment gives a cold build's)
# baseline: what `dbt test --update <name>` re-records: paths under tests/golden/<consumer>/, or any record header
#         named tests/**/*_records.h, kept beside the spec it pins, or the website menu tree
#         (website/src/data/generated/menu-tree.json, ui-menu-dump) (harness_registry.baseline_problem)
# gates:  one sentence, at most 160 characters (harness_registry.gates_problem); the rest is a "Gate <name>:"
#         block in the file that judges the test, or a `## <name>` section in its check's notes
#         (harness_registry.CHECK_NOTES) -- ./dbt test --list --verbose <name> prints it
# template: [template.<name>] holds fields its entries share; an entry that sets one of them anyway lists it in
#         `override`, or the loader refuses it. Templates do not nest.
# variants: ["asan"] (scenario entries only) generates [variant.asan]'s copy of the entry after every entry written
#         here; the copy never owns a baseline. variant_fields = { asan = { runtime_s = N } } sets that copy's run time.

# A song rendered on the audio tier through the real load browser, compared with its record in songs.json
# (tests/integration/checks/render_song.py).
[template.render-song]
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
scenario = "render_song"
markers = ["RS-LOADED", "RS-RENDER", "RS-VOICES", "RS-TIER-SYNC-AUDIO", "RS-STREAM", "RS-UNDERRUN", "RS-CAPTURE"]
result = "RS-RESULT failures=0"
check = "tests/integration/checks/render_song.py"
builds = ["golden-vt-render"]
baseline = ["tests/golden/render/songs.json"]
tier = "pr"
job = "render"
runtime_s = 20

# A preset rendered as golden_vt_render's render_preset scenario plays it.
[template.render-preset]
level = "integration"
runner = "scenario"
status = "gate"
scenario = "render_preset"
markers = ["RP-LOADED", "RP-MIDI", "RP-RENDER", "RP-TIER-SYNC-AUDIO", "RP-CAPTURE"]
result = "RP-RESULT failures=0"

# A self-checking driver (tests/integration/scenarios/drivers/) whose exit code is its verdict.
[template.scenario-driver]
level = "integration"
runner = "scenario"
status = "gate"
builds = ["golden-vt-render"]
markers = ["DRV-EXIT"]
result = "DRV-EXIT code=0"

# Any other golden_vt_render scenario gate.
[template.scenario]
level = "integration"
runner = "scenario"
status = "gate"
builds = ["golden-vt-render"]

# A tests/integration/corpus/<corpus_runner>_run.py sweep over the song corpus, alone so it has every CPU.
[template.corpus]
level = "integration"
runner = "corpus"
status = "gate"
builds = ["golden-vt-render"]
job = "model"
alone = true
requires = ["song-xml-corpus"]
tier = "nightly"

# A Python unittest suite for a tool, run in `path`.
[template.unittest]
level = "unit"
runner = "script"
kind = "unit"
status = "gate"
tier = "pr"
job = "tooling"
runtime_s = 1

# A base entry's checks on the host app built with AddressSanitizer, UBSan and the allocator's heap poisoning:
# `variants = ["asan"]` on the base generates app-asan-<base>, after every entry written here.
[variant.asan]
name = "app-asan-{base}"
gates = "the {base} gate's checks, on a host app built with AddressSanitizer and UBSan and the allocator's heap poisoning"
kind = "sanitizer"
builds = ["golden-vt-render-asan"]
requires = ["clang-asan"]
env_default = { ASAN_OPTIONS = "detect_leaks=0:halt_on_error=1", UBSAN_OPTIONS = "print_stacktrace=1" }
tier = "nightly"
job = "unit"
runtime_s = 300

[[harness]]
name = "fs-differential"
path = "."
level = "component"
runner = "cargo"
kind = "differential"
status = "gate"
gates = "embedded-fatfs must agree with the reference FAT implementation on every filesystem operation"
areas = ["storage"]
build = ["tests/component/differential/fs_differential/fixtures/mk_fixture.sh"]
run = ["cargo", "test", "-p", "fs-differential"]
# cargo runs a test binary in its package's directory, so the images are named from there.
