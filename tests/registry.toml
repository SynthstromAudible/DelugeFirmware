requires = []
tier = "nightly"
runtime = "~10m"

# The one rig that loads a whole song, and presets, through the model tree's sample loads and checks where every
# holder's file came from. Its fixture documents are written by the firmware inside the scenario, never by hand.
# It also prints a trace of every call into the load path's leaf functions (LT lines), which the script writes to
# $SAMPLE_LOAD_TREE_TRACE when set, so a restructuring of the load path can be compared call for call.
[[harness]]
name = "sample-load-tree"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "a song with a sample synth, a wavetable, a sample kit drum and an audio clip, saved with collected media, must load back with each holder bound to its collected copy in the song's folder once the originals are gone, and with the audio clip's still-resident sample claimed from memory and the clip named after it. A synth preset and a kit preset whose samples exist only in the preset's own folder must load with each holder's path rewritten to that folder. An abort raised after the kit preset's first drum binds must stop the load with ABORTED_BY_USER and leave the second drum empty. A song loaded while playback runs must take the crucial-only pass, binding a sound only when its track's active clip is playing, a kit drum only when its row is unmuted and has notes, and every audio clip that is its track's active clip, and must then finish after its armed swap with every holder bound to its collected copy. Each load's routineWithClusterLoading count is reported. The crucial load, the full song, the synth preset and the kit preset with its abort must then each load again through AsyncSampleLoad, ticked from the interaction tier with every file it binds dropped from memory first, and end as the blocking load did: the same holders bound to the same files, the kit's load stopped by its abort, and no sample read from the card or folder probed on the interaction tier. The song must also load when the folder's exists probe is held until every sample request has come back, and when the card is ejected while the probe is out the load must end on the unusable card, with a second load on the same context binding everything once the card is back. A synth preset load held past the stall bound must end Failed/Stalled on the bound's walk with nothing bound, and a second load must bind the sample once the hold is lifted. A load of only the song's wavetable, on a context whose folder probe a dropped load left out, must bind the wavetable to its collected copy."
scenario = "sample_load_tree"
markers = ["SLT-ARM", "SLT-SETUP", "SLT-HOLDER", "SLT-CLIP", "SLT-SONG", "SLT-SYNTH", "SLT-KIT", "SLT-CRUCIAL", "SLT-CRUCIAL-SUMMARY", "SLT-ASYNC", "SLT-SUMMARY", "SLT-RESULT"]
result = "SLT-RESULT failures=0"
check = "tests/integration/checks/sample_load_tree.py"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~5m"

# The sample browser's claim, from the browser a user opens: what each claim binds, and where its load runs.
[[harness]]
name = "sample-claim"
path = "."
level = "integration"
runner = "scenario"
