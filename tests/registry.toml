all bound to come back with that holder empty and the gate released. MD-BROWSER requires a MIDI device definition, written through the firmware and loaded through its own browser, to leave the file's CC label on the instrument with the browser closed and the document staged once by InstrumentLoad on later ticks rather than read inside the Select. BS-BOOT requires the boot song to start on the default synth having asked for a preset exactly once, BS-CLEAR requires a cleared song to land on a SYNTHS preset staged by InstrumentLoad, and BS-EDITED requires a default synth edited while that request is out to keep its clip with nothing of the preset left behind."
