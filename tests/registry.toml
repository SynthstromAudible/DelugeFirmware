[[harness]]
name = "streaming-margin"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "sample playback must keep up when storage is as slow as the device's: the render-song song, played with the fill task waiting 16 ms to be scheduled and each chunk taking 5.8 ms to read (the device's steady figures), must stream without an underrun (SM-STEADY). A 500 ms wait must drop voices (SM-STARVED), which is what shows the gate can see an underrun at all. A 260 ms wait for half a second, as a song load imposes on the device, is reported and not gated (SM-BURST): the device drops voices there too."
scenario = "render_song"
markers = ["RS-LOADED", "RS-RENDER", "RS-VOICES", "RS-TIER-SYNC-AUDIO", "RS-STREAM", "RS-UNDERRUN", "RS-CAPTURE"]
result = "RS-RESULT failures=0"
