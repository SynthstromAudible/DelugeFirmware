[[harness]]
name = "save-roundtrip"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "a song saved through the real SaveSongUI ENTER gesture must round-trip byte-identically (save, load it back, overwrite, compare a CRC of both writes -- a length check would miss a truncation or a reorder), and the overwrite seam must prompt exactly when the target name is taken and not otherwise and must close on confirmation. Two further checks guard parsing from memory. SL-NOSTREAM is a SOURCE check, deliberately: none of the three StorageManager openers that would parse a document while streaming it off the card may exist, and a gate cannot observe a path that is not compiled, so a grep is the only way to notice one appearing -- a reader that streams a document off the card blocks the parsing tier for the whole parse, however rarely it runs. SL-EVICT re-runs the whole round trip with DELUGE_SIM_SDRAM_MB clamped low enough that staging a song cannot happen without the resource manager evicting cached chunks first, and requires the identical CRC: staging a song can give up cached sample chunks, which is a decision and so gets measured rather than assumed harmless. Single-leg and self-checking: unlike the A/B gates beside it there is no second backing to diff against, because the subject is a C++ structural change rather than a Rust backing chosen by a feature -- so there is no baseline here that anyone can re-baseline into passing. The second save deliberately overwrites the SAME name: the save records the name it was dispatched with as the song's name, so a different name would produce legitimately different bytes and the comparison would fail for a reason that is not a defect."
scenario = "save_roundtrip"
markers = ["SR-RESULT", "SR-SEAM", "SR-ROUNDTRIP"]
result = "SR-RESULT failures=0"
check = "tests/integration/checks/save_roundtrip.py"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~5m"

[[harness]]
name = "document-save-channel"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "a preset saved through the real ENTER gesture must be written WHOLE, read back through the channel (DS-VERIFIED, DS-VERIFY-ARM), and stored through the write channel after boot (DS-TICKED). One leg: the write channel has no feature switch, so there is no second arm to run. DS-OCCUPIED saves onto a name that is already taken and requires both that the user is asked and that the existing document is left alone: silently replacing somebody's preset is the worst thing this code could do. This gate exists because no other harness builds write_file, and a feature no gate builds is code that has never run. DS-BACKMIDSAVE and DS-EXITMIDSAVE press BACK and fire the long-press exit while the save is still running, and require the save screen to stay open: a save spans ticks with the UI live, and leaving its screen mid-save would let the save's own close() read below the bottom of the UI stack. Both first require that the save really is still in flight, so a save that finished early fails the check instead of passing it for free. DS-GUARD-SONG dispatches a preset save while a song save's collection or document machine is still running with the save guard already released, and requires the dispatch refused and the song document whole: the shared serialiser holds the song's staged document for that whole window. DS-ACCOUNTED removes a preset's file between its write landing and its read-back's first answer, and requires the one answer the channel gave -- NOT_FOUND, which fails the save -- to be counted as served: counting only the ticks that advanced would undercount every failed read-back. DS-OVERWRITE saves onto the preset's own name again, confirms the prompt, and requires the document written to <target>.tmp, verified there and swapped into place, with no temp file left. DS-OVERWRITE-FAIL does the same and truncates that temp file between its write landing and its read-back, and requires the save failed, the document it was replacing byte-for-byte intact, and the temp file removed: rewriting the target in place would let a failed write or read-back destroy the document it replaces. Both run last, because DS-GUARD and DS-KITROW count staged saves absolutely. DS-HELD does the same for a preset save, which must complete and verify: giving up would also remove a temp file the write still has open."
scenario = "document_save_channel"
markers = ["DS-BACKMIDSAVE", "DS-EXITMIDSAVE", "DS-SAVED", "DS-FINISHED", "DS-OCCUPIED", "DS-GUARD", "DS-KITROW", "DS-KITFINISHED", "DS-GUARD-SONG", "DS-ACCOUNTED", "DS-OVERWRITE", "DS-OVERWRITE-FAIL", "DS-HELD", "DS-VERIFIED", "DS-SUMMARY", "DS-RESULT"]
check = "tests/integration/checks/document_save_channel.py"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~10m"

[[harness]]
name = "sample-collect-channel"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "a song saved with collect-media on must land every sample it references in its own folder, byte-identical to the source, and must leave the audio-file list sorted and every resident file still findable. One leg: every transfer rides the byte channel, and the save around it stages its document through the write channel; neither channel has a feature switch. SC-ORDERED is the reason this gate is worth its runtime -- the collection walks a container the audio engine and the UI both read, mutating the very key it is SORTED BY, while the copying spans ticks, so the walk can be observed half-done. A green SC-ORDERED proves nothing by itself, though: what proves the snapshot is load-bearing is the neutering that mutates filePath during the PLAN walk instead of the APPLY pass, which must turn SC-ORDERED red."
scenario = "sample_collect"
