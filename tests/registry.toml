status = "gate"
gates = "Every deletion path must end a Sound's voices before any part of it is destroyed. A Sound destroyed with live voices crashes itself, with no render involved: after ~Sound's body, its own voices_ member destructor recycles each voice, and ~Voice -> Voice::setAsUnassigned -> Sound::voiceUnassigned -> reassessRenderSkippingStatus calls getArpSettings(), pure virtual in Sound by then. The probe holds a note on a blank synth and on a kit's synth drum, renders a few blocks, then deletes it through each real path -- SL-SYNTH (a synth in the song, Song::deleteOutputThatIsInMainList), SL-UNEDITED (an un-edited synth in no list, Song::deleteOrAddToHibernationListOutput), SL-KIT (a kit in the song, deleteOutputThatIsInMainList) and SL-DELETEDRUM (InstrumentClipView::deleteDrum's steps: the note row's note stopped and the drum taken out of drumsWithRenderingActive, Kit::removeDrum, the note row's reassignment, then AudioEngine::retire; the only drum-delete site that can reach a sounding drum, since the preset-replace site kills the voices first and the folder-import, slicer and instrument-load sites only drop drums that never sounded) -- and requires Sound::soundsDestroyedWithLiveVoices() to be 0 for every path. Every deletion retires: the render ends the voices and deregisters the Sounds at the top of its next block and the memory is freed by the first reclaim after that once two blocks have begun, so each count is read after settle blocks, a leg whose objects are still waiting then fails, and SL-RECLAIM requires nothing retired to be left waiting at the end. SL-OPPORTUNISTIC requires a retire to free an older, already let-go object on its own (pending=1, with no reclaim-task tick in the step); SL-BURST retires 80 blank drums (past the 64-slot ring, into the overflow, drained 16 per block) and requires violations=0 (no drum destroyed while still in the Sound registry) and pending=0. The run also fails when a leg's fixture could not be built or never sounded, a line is