status = "gate"
gates = "Which clip deletions free a clip the render still points at. The render holds clip pointers across blocks -- the current song's currentClip and syncScalingClip, every clip's beingRecordedFromClip, view.activeModControllableModelStack's timeline counter and each output's activeClip. A deleted clip is handed to the render (AudioEngine::retire(Clip*), from Song::deleteClipObject() and from an undo log's ConsequenceClipExistence discard), which clears the ones the interaction tier writes (currentClip, syncScalingClip, the view's stack) at once and has the render null the rest at its next block before the clip is freed; CL-WINDOW (SESSIONDELETE, ARRANGERNOUNDO) says, before any block, whether currentClip or the view still names the retired clip, and is required 0. ~Clip counts a destruction that finds any of them still pointing at it (Clip::clipsDestroyedWhileReferenced()), and ~Song one that finds itself still currentSong or a Sound of its outputs still in the Sound registry (Song::songsDestroyedWhileReachable()). Each leg plays a clip on the internal clock with a note held on its blank synth, renders 8 blocks, deletes it through a real path, renders 8 more, then renders a few and reclaims so the clip is freed inside the leg (CL-FREED pending=), and reports how far the two counters and Sound::soundsDestroyedWithLiveVoices() moved: CL-SESSIONDELETE (the selected current clip, SessionView::removeClip -> Song::removeSessionClip), CL-ARRANGERDELETE (an arrangement-only current clip, the arranger's delete gesture step for step with a real logged action, destroyed when the logs are discarded), CL-SWAPTYPE (the selected clip changed to audio, Song::swapClips), CL-UNDODELETE (the same logged arranger delete, undone with restored=, redone, then destroyed by discarding the logs), CL-ARRANGERNOUNDO (the same arranger delete with the null action the gesture passes when the action logger has none to give, so the clip is deleted at once with the song's currentClip still on it), CL-RECORDSOURCE (the clip another clip's beingRecordedFromClip names) and CL-SYNCSCALE (the sync-scaling clip, through removeSessionClip). CL-DANGLING says which references still hold the deleted clip's address just after the deletion. Two drum legs also hand their SoundDrum to the render (AudioEngine::retire(SoundDrum*)) instead of destroying it on the spot, and are REQUIRED soundsLive=0 with no abort: CL-SAVEKIT (a second drum on the kit that no NoteRow has, naturally left with voicesAtSave=0 renderingActive=1 by Kit::writeDataToFile's own deletion trigger, which has no skippingRendering guard -- a real, unforced precondition) and CL-WONTSOUND (a drum with an empty note row, put back into drumsWithRenderingActive by hand -- skipping rendering, yet still in that set, a state no natural note-on/off path reaches, since SoundDrum::setSkippingRendering is the only writer of the flag and erases from the set in the same call that sets it true; this leg proves only that InstrumentClip::deleteSoundsWhichWontSound's retire hand-off is wired correctly, not a reachable precondition -- its real safety value is that the hasActiveVoices() check beside it is ALPHA_OR_BETA_VERSION-only, so on a release build only AudioEngine::retire()'s unconditional voice-kill on let-go stands between a genuinely-sounding drum and a stale free). CL-RECLAIM (AudioEngine::retiredPending() after reclaimRetired()) is printed once after the seven clip legs and SAVEKIT, and again after WONTSOUND; the final one is REQUIRED pending=0. REQUIRED: the seven clip legs above must read clipsReferenced=0 with no abort and CL-FREED pending=0, and CL-UNDODELETE restored=1. The song legs are REQUIRED too: a replaced song is handed to the render (AudioEngine::retire(Song*)), which ends the voices of and deregisters every Sound of its outputs before ~Song runs, and a stopped-clock load or clear waits for it to be freed (AudioEngine::awaitRetired(), a bounded wait on the render through deluge_audio_await_block()) before it builds the new song. CL-EPOCH0 (Create New Song at boot, before the scheduler has run the render task; epoch=0 or 1, returned=1), CL-SONGCLEAR, CL-SONGLOAD, CL-SONGSWAP (the armed swap), CL-BURSTSONG (10 synths and 10 kits of 32 drums with two clips each, cleared while stopped; CL-LETGO reports the host wall time of the render block that lets go of it) and CL-CLEARPLAYING (Create New Song while following an external clock, with an audio clip holding a temp-recorded Sample, which the clear frees right after handing the old song over: pendingAtFree=0 is required, so the old song is gone first) must read clipsReferenced=0 songsReachable=0 soundsLive=0 violations=0 with no abort; the stopped-clock ones also pendingAtBuild=0 (retired objects still waiting when the new Song was constructed) and pending=0, and SONGCLEAR, SONGLOAD and BURSTSONG their CL-AFTER line (a UI timer and a DIN MIDI note-in right after the clear or load returns -- a regression guard that currentSong is set afterwards, not evidence about the wait inside the operation, whose null-currentSong window no interaction task can see by construction). A leg whose deletion or the blocks after it end the process is reported with aborted=1 and the step, and the script starts a new run at the next leg. The run also fails on a missing leg line, a fixture that could not be built or a clock that never ran, or a process end that no leg reported."
