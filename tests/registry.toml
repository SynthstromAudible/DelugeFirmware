run = ["python3", "tests/golden/upgrade_run.py", "--part", "corpus"]
builds = ["golden-vt-render"]
requires = ["cargo", "legacy-corpus"]
tier = "nightly"
alone = true
job = "storage"
runtime_s = 600

[[harness]]
