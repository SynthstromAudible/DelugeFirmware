gates = "an audio-input recording take must leave the rest of the app running, and must attach its sample only to the sound it was recorded for. Every take is started from the sound editor's recorder menu item, and the gesture must return with the take running under the recorder UI (RT-OPEN). midi_during_take: a DIN script plays MIDI Start, two bars of clock and one note on channel 1 during the take; every byte must be read, the note must sound through MIDI follow, the clock must start playback, and the recorder's own step must handle clipping or the Waiting → Recording change (RT-TAKE). BACK then ends the take, and the sample must be attached as the recorder always has: the source switched to SAMPLE, the range's holder holding the recording under SAMPLES/RECORD/ with audio in it (RT-ATTACH). refused_during_load: with a new-synth acquisition in flight, which swaps the clip's output when it lands, the recorder must refuse to start a take (RT-REFUSED). closed_mid_take: the UI stack is replaced under a running take, as a cleared song does; the take must be dropped, the source left as it was and the recording attached to nothing (RT-CLOSED), and a second take must then start and attach (RT-SECOND). nullified_mid_take: the UI stack is nullified under a running take with nothing opened in its place, as a song load leaves it; the take must be dropped all the same, its recording attached to nothing (RT-NULLED). output_replaced_mid_take: the clip's synth is replaced under a running take through the new-synth step itself, a test seam for any swap the refusal cannot cover; the old synth hibernates, and must not be switched to SAMPLE, nor the recording leased by anything (RT-REPLACED). next_song_mid_take: with the load browser's listing left behind as a loaded song leaves it and the song playing, a learned MIDI NEXT_SONG arrives on DIN mid-take and is held back with a popup; no song load may start while the take runs (a load takes down the recorder's UI and arms a swap that retires the song the take attaches to), BACK must end the take with its sample attached in the song it was recorded in, and the held-back NEXT_SONG must then load the next song (RT-NEXT). A take that holds the gesture until it settles freezes this single-threaded harness inside one executor poll, so the check runs under a 60 s wall-clock bound and reports that as RT-FROZEN."
scenario = "recorder_take"
