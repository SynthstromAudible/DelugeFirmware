tier = "nightly"
runtime = "~1m"

[[harness]]
name = "staging-release"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "a staged document read that its consumer abandons while the write channel holds its buffer must not write into that memory once it has been freed and handed out again: the scenario releases the staging mid-read, reallocates the same size filled with a sentinel, lets the read finish, and requires the sentinel intact (SR-INTACT). SR-ISSUED requires the read to have been held when the staging was released, and SR-REAPED requires the released buffer to be freed once the read has finished, so the release trades the corruption for nothing, not for a leak."
scenario = "staging_release"
markers = ["SR-ISSUED", "SR-RELEASE", "SR-INTACT", "SR-REAPED"]
result = "SR-RESULT failures=0"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~1m"

