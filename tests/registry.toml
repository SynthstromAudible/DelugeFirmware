# The ONLY rig that runs the real Rust audio loader against the real C++ collector over real
# files. Everything else that touches the async load path drives a stub.
#
# `run` is a script rather than a cargo invocation because the harness's C++ object closure has to be
# rebuilt first, which cargo does not track. The script builds the harness once and runs the fixture
# card through it: every sample loads twice in process, synchronously as the reference and then
# through the loader, and the two must agree. It needs no song corpus — it generates its own WAVs — so unlike the
# sibling golden_vt_render gates it can run anywhere.
[[harness]]
name = "audio-load-ab"
template = "scenario"
kind = "differential"
gates = "the async Rust audio loader must load every file the SAME way the synchronous C++ card path does, loaded in the same process as the reference"
areas = ["platform", "host-app", "storage", "model", "ui", "synth"]
scenario = "audio_load_ab"
markers = ["AB-PREVIEW", "AB-CANCEL", "AB-PREVIEW-STALL", "AB-PREVIEW-TIER", "AB-PREVIEW-DRAW", "AB-PREVIEW-DRAW-STALL", "AB-PREVIEW-DRAW-RELEASE", "AB-READ-PROGRESS", "AB-IDENTITY", "AB-PITCH", "AB-PRESCAN-RANGE", "AB-EJECT", "AB-EJECT-SUMMARY", "AB-DEFER", "AB-SUMMARY"]
result = "AB-RESULT failures=0"
check = "tests/integration/checks/audio_load_ab.py"
tier = "pr"
job = "app"
runtime_s = 300

# The rig that runs the real Rust prefix channel against the real C++ song browser over real files.
#
# `run` is a script rather than a cargo invocation because the harness's C++ object closure has to be
# rebuilt first, which cargo does not track. The script builds the harness once, draws the fixture
# card's artwork through the prefix channel, and holds every song to an in-process reference decode of
# the same file.
#
# Runs without a song corpus (the fixture writes its own songs). With DELUGE_SONG_CORPUS set it also
# stages up to 16 real songs as extra cases, which is the only part of it that sees documents nobody
# here wrote -- worth passing locally, not required.
[[harness]]
name = "song-preview-ab"
template = "scenario"
kind = "differential"
gates = "the Rust prefix channel draws the same song artwork, and reports the same decode outcome and error, as the same file decoded synchronously"
areas = ["platform", "host-app", "storage", "model", "dsp", "synth", "effects", "ui-browser", "render-data"]
scenario = "song_preview_ab"
markers = ["SP-WINDOW", "SP-SWAP-BEFORE", "SP-EJECT", "SP-SWAP-SUMMARY", "SP-LISTING-SUMMARY", "SP-PREDICT-SUMMARY", "SP-NEWNAME", "SP-SLOT", "SP-VARIATION", "SP-ACQUIRE-SUMMARY", "SP-BYPATH", "SP-LISTING-STALL", "SP-RELOAD", "SP-RELOAD-STALL", "SP-PREVIEW-STALL", "SP-OPEN-SCROLL", "SP-DX", "SP-DX-STALL", "SP-REFERENCE", "SP-TIER"]
result = "SP-RESULT failures=0"
check = "tests/integration/checks/song_preview_ab.py"
tier = "nightly"
job = "render"
runtime_s = 300

