[[harness]]
name = "recorder-write"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "a real recording must still read back byte-correctly -- mid-recording, finalized multi-cluster, and through the alteration transform -- while its per-cluster write is served asynchronously and all THREE of its card steps run from the caller's ticks through their own machines: the drain, the finish, and the file creation. Three counters, because they answer three separate questions and none can be inferred from the served count, which says operations went through the channel but not which machine issued them. Each reads zero the moment its own step stops running through its machine. RW-ROUNDTRIP is not ceremony either -- a recycled stream handle collecting a previous recorder's answer reported a cluster as written when nothing had been, and only the byte-level readback noticed. The ticked_ cases exist because the oracle's eight cases do not take these shapes: none of them aborts, meets a busy or stalled channel, or sets allowFileAlterationAfter -- so the ticked_ alteration case is the batch machine's only coverage. TWO GAPS ARE KNOWN AND DELIBERATE. RW-LEAK checks an aborted recording gives its clusters back but does NOT catch a premature unlink, because single-flight sends that unlink down its synchronous arm regardless, so that ordering holds by construction rather than by observation. And the stem-export folder search is exercised only by the offline drain render, which starts the export after boot, so only its CHANNEL arm runs and nothing checks its result beyond the render terminating. There is no stem case among the ticked_ cases: routing a harness recording down the stem path needs more engine state than processStarted plus currentStemExportType plus lastFolderNameForStemExport, and a case that silently records to RESAMPLE while calling itself a stem case is worse than none. RW-DIR-STALL holds the recording-folder scan's directory open past the recorder's bound and requires the create to fail with a card error, with no file made and no synchronous open. RW-ABORT-OPEN aborts while the channel is opening the file, once for the create and once for finalize's reopen to alter it, and requires no file left behind and every stream-write slot free afterwards: the open cannot be cancelled, so an abort that does not wait it out leaks the handle it returns."


scenario = "recorder_roundtrip"
check = "tests/integration/checks/recorder_write.py"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~10m"

