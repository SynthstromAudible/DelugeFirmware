level = "integration"
runner = "corpus"
kind = "regression"
status = "gate"
gates = "the engine's live automation recording must reproduce its committed baselines (tests/golden/param_record_baselines)"
corpus_runner = "param_record"
builds = ["golden-vt-render"]
requires = ["song-xml-corpus"]
baseline = ["tests/golden/param_record_baselines"]
tier = "nightly"
alone = true
job = "model"
runtime_s = 5

[[harness]]
name = "arrangement-take"
level = "integration"
runner = "scenario"
kind = "regression"
status = "gate"
gates = "recording the session into the arrangement must make the takes it made when its baseline was recorded (tests/golden/arrangement_take_baselines)"
scenario = "render_song"
markers = ["RS-LOADED", "RS-RENDER", "RS-TAKE", "RS-TAKE-PLAYED", "RS-TAKE-REPEATS", "RS-TAKE-LEFT", "RS-TAKE-STALE", "RS-KNOB", "RS-SNAPSHOT"]
result = "RS-RESULT failures=0"
check = "tests/integration/checks/arrangement_take.py"
env = { RENDER_ARRANGE_RECORD = "1", RENDER_KNOB = "400:synth:lpf:268435456,500:kit:volume:-536870912,600:audio:lpf:536870912,1100:synth:volume:-1073741824,1360:synth:lpf:-1073741824,1370:kit:volume:536870912", RENDER_SOURCE_EDIT = "1500" }
builds = ["golden-vt-render"]
baseline = ["tests/golden/arrangement_take_baselines"]
tier = "nightly"
job = "render"
runtime_s = 20

[[harness]]
name = "audio-clip-edit-diff"
level = "integration"
runner = "corpus"
kind = "regression"
status = "gate"
gates = "an AudioClip's descriptor edits, their undo, and a save and reload reproduce the committed baseline byte for byte"
corpus_runner = "audio_clip_edit"
