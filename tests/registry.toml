# Areas: what a gate exercises, cut by how the code is tested (test_selection.py). A gate's own files (its directory,
# the files its commands and check name, its scenario's driver, its corpus runner and its baselines) reach it without
# being listed. `./dbt test --since REF` runs the gates the changes since REF reach; tests/README.md, Selecting by
# change.
[area.platform]
paths = ["src/platform/**", "include/libdeluge/**", "src/base/**", "src/deluge/memory/**", "src/deluge/runtime/**", "src/deluge/harness/**",
         "src/deluge/version/**", "src/deluge/deluge.*", "src/deluge/extern.h", "src/*.h", "src/*.hpp",
         "tests/unit/base/**", "tests/unit/harness/**", "tests/component/fuzz/**"]
# Shared by the golden_vt_render gates: the host app harness, the scenario table and its helpers, the default card.
# Each gate's own driver, card and check reach only it.
[area.host-app]
paths = ["tests/harness/*.*", "tests/harness/golden_vt_render/**", "tests/harness/level3/**",
         "tests/integration/scenarios/*.h", "tests/integration/scenarios/scenario_table.*",
         "tests/integration/scenarios/support/**", "tests/integration/scenarios/preset_fixture_loader.cpp",
         "tests/integration/scenarios/recorder_readback_probe.cpp", "tests/integration/scenarios/slot_coherence.cpp",
         "tests/integration/scenarios/song_settings_coherence.cpp", "tests/integration/scenarios/streaming_scenario.cpp",
         "tests/integration/scenarios/drivers/*.h", "tests/integration/scenarios/drivers/driver.cpp",
         "tests/fixtures/card/**"]
[area.storage]
paths = ["src/storage/**", "src/deluge/storage/**", "src/deluge/io/**", "tests/unit/storage/**",
         "tests/component/differential/**", "tests/integration/scenarios/audio_header_dump*"]
[area.model]
paths = ["src/deluge/model/**", "src/project/**", "src/serialization/**", "src/deluge/sequence/**",
         "src/deluge/playback/**", "src/deluge/sync/**", "src/deluge/util/**", "src/music/**", "src/midi/**",
         "tests/unit/project/**", "tests/unit/serialization/**", "tests/unit/music/**", "tests/unit/midi/**",
         "tests/unit/deluge/**", "tests/unit/integration/**", "tests/fixtures/songs/**",
         "tests/fixtures/midi-devices/**"]
[area.synth]
paths = ["src/synth/**", "src/arp/**", "src/instruments/**", "src/plugin/**", "src/deluge/processing/**",
         "src/deluge/modulation/**", "tests/unit/instruments/**", "tests/unit/plugin/**",
         "tests/unit/arp/**"]
[area.dsp]
paths = ["src/dsp/**", "src/arm_neon_shim.h", "tests/unit/dsp/**"]
[area.effects]
paths = ["src/effects/**", "src/host/**", "tests/unit/effects/**", "tests/unit/host/**"]
# The paths a song or preset load takes through the UI: the load and save browsers and the shell's input path.
[area.ui-browser]
paths = ["src/deluge/gui/ui/browser/**", "src/deluge/gui/ui/browser_host.*", "src/deluge/gui/ui/load/**",
         "src/deluge/gui/ui/save/**", "src/ui/scenes/browser/**", "src/ui/shell/**"]
[area.ui]
paths = ["src/ui/**", "src/deluge/gui/**", "src/deluge/hid/**", "tests/unit/ui/**", "tests/integration/ui/**",
         "tests/ui-scripts/**", "tests/golden/ui/**", "tests/golden/gfx/**", "tests/fixtures/scenes_spec/**",
         "tests/fixtures/*.card"]
# The render gates' sources and records: songs, presets, wavetable pins, the stem export's hash.
[area.render-data]
paths = ["tests/golden/render/**", "tests/golden/stem_export/**"]
[area.corpus-driver]
# The corpus sweeps' shared driver and the corpus drivers each runner names.
paths = ["tests/integration/corpus/**", "tests/integration/scenarios/drivers/*.cpp", "tests/golden/songs/**",
         "tests/golden/presets/**"]
[area.bench]
paths = ["src/deluge/bench/**"]
[area.upgrader]
paths = ["tools/deluge-upgrade/**", "tests/golden/upgrade/**"]
[area.test-support]
paths = ["tests/support/**", "tests/trees/**"]
[area.tooling]
paths = ["scripts/**", "tools/*.py", "tools/testdata/**", "tools/audible_window/**", "tools/deluge_trace/**",
         "tools/envelope_records/**"]

[no-gate]
paths = ["docs/**", "website/**", ".github/**", "**/*.md", "LICENSE*", "contrib/**", "CODEOWNERS", ".editorconfig",
         ".git-blame-ignore-revs", ".gitattributes", ".gitignore", ".clang-format", ".clang-format-ignore", ".clang-tidy",
         ".clangd", ".pre-commit-config.yaml", "assets/**", "IDE_Configs/**"]

# A change here can reach any gate: the build system and the runner itself.
[every-gate]
paths = ["CMakeLists.txt", "**/CMakeLists.txt", "Cargo.toml", "Cargo.lock", "**/Cargo.toml", "dbt", "dbt.cmd", "dbt.py",
         "rust-toolchain.toml", "cmake/**", ".cargo/**", ".config/**", "toolchain/**", "lib/**", "third_party/**",
         "Makefile",
         "scripts/toolchain/**", "scripts/cmake/**", "scripts/tasks/task-test.py", "scripts/tasks/harness_registry.py",
         "scripts/tasks/test_builds.py", "scripts/tasks/test_selection.py", "tests/registry.toml",
         "tests/support/cmake/**"]
