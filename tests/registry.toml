status = "gate"
gates = "the favourites bank must never be written with less than it held, and none of its card I/O may begin on the interaction tier. Every browser visit, favourite pad and bank pad reaches this bank, and before this gate existed a failed existence check read as absent and wrote an EMPTY bank over the real one, and an edit on a bank that never loaded saved one favourite over the other fifteen. FV-ABSENT requires opening a bank with no file to leave no file; FV-REFUSE requires an edit made while the bank is loading to change and write nothing; FV-ORDER requires a save made just before switching away and back to land before the bank is read again; FV-STALE requires an answer that arrives after another bank was selected never to be applied, and first requires that answer to have been issued at all, or it proves nothing. One leg: the byte channel has no feature switch, and FV-CHANNEL requires the bank's operations to have gone through it. Every wait is on the bank going idle, never on a file appearing."
scenario = "favourites_channel"
markers = ["FV-SEED", "FV-ABSENT", "FV-REFUSE", "FV-ROUNDTRIP", "FV-ORDER", "FV-STALE", "FV-TIER", "FV-CHANNEL", "FV-ACCOUNTED", "FV-ILLEGAL"]
result = "FV-RESULT failures=0"
check = "tests/integration/checks/favourites_channel.py"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~5m"

[[harness]]
name = "startup-failsafe"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "no file operation in the startup song fail-safe may begin on the interaction tier. SF-TIER is the evidence, required zero: it is the only check that shows which tier the fail-safe's I/O ran on. SF-CHANNEL is required non-zero, because a channel that is compiled but never runs would otherwise leave this gate green. The fail-safe's happy path ends in openUI and this harness has no UI stack, so the scenario drives the song-missing path: the canary creation, the existence checks and the cleanup unlink, then a return before the UI. Which tier those run on does not depend on which branch reached them."
scenario = "startup_failsafe"
markers = ["SF-ORDER", "SF-CHANNEL", "SF-TIER", "SF-ILLEGAL", "SF-INLINE", "SF-GIVEUP"]
result = "SF-RESULT failures=0"
check = "tests/integration/checks/startup_failsafe.py"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~4m"

[[harness]]
name = "path-operations"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "real SysEx path requests must still get their ^verb replies, a nested path with every segment missing must be created by one request and a second creation of an existing path must succeed, no browser folder creation or delete may begin on the interaction tier, and a file deleted from a browser must go through the byte channel. Replies are captured from a loopback MIDICable rather than inferred from the filesystem: asserting the effect alone would pass for a request path that stopped replying, which is exactly what deferring a reply risks. PO-CHANNEL carries more weight here than on any other gate -- PO-TIER counts only browser operations, so for the SysEx requests the served count is the whole of their evidence. The delete stages drive the real delete menu in a save browser listing PO_TEST/DELETE: PO-DELETE requires the removal pending on the byte channel, with BACK, a pad and the select encoder refused meanwhile, and then the file gone from the card and the list; PO-DELETE-ABSENT requires a listed file already gone to end as missing and stay listed; PO-DELETE-STALL requires a removal the channel never answers to end as failed with the file listed and the menu closed."
scenario = "path_operations"
markers = ["PO-SYSEX", "PO-MKDIRALL", "PO-DELETE", "PO-DELETE-ABSENT", "PO-DELETE-STALL", "PO-CHANNEL", "PO-TIER", "PO-ILLEGAL"]
result = "PO-RESULT failures=0"
check = "tests/integration/checks/path_operations.py"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~4m"

[[harness]]
name = "offset-io"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "three blocks written at ascending offsets through the real SysEx transfer verbs must all still be on the card, a copy must reproduce its source byte-for-byte, and copying a missing source must report an error. THREE blocks and not one is the whole point: efatfs_core::create_context truncates unconditionally, so a write_at that re-opened that way would leave only the last block, and a single-block round trip would pass against exactly that bug. The missing-source case is load-bearing for the same class of reason -- without a case whose expected answer is an error, a handler replying before its operation completed reports the same err=0 a correct one does. OI-CHANNEL going non-zero is the evidence that the SysEx operations took the channel. OI-DIR-STALL holds a directory listing's open far past the handler's 600-tick bound and requires a timeout reply (15) with no entries, and OI-TIER requires that SMSysex opened no directory synchronously on the interaction tier after boot."
scenario = "offset_io"
markers = ["OI-TRANSFER", "OI-COPY", "OI-DIR", "OI-CHANNEL", "OI-ILLEGAL", "OI-GIVEUP", "OI-DIR-STALL", "OI-TIER"]
result = "OI-RESULT failures=0"
check = "tests/integration/checks/offset_io.py"
builds = ["golden-vt-render"]
requires = []
tier = "nightly"
runtime = "~4m"

[[harness]]
name = "pattern-load"
path = "."
level = "integration"
runner = "scenario"
kind = "property"
status = "gate"
gates = "a pattern file, written from notes on the boot song's synth clip by the firmware's own pattern writer, must load back through the real pattern browser with Enter, landing after the browser closes (PT-LOAD), and as a PLAY preview (PT-PREVIEW), each putting back exactly the notes that were written onto a cleared clip. A preview followed by BACK, pressed while the channel holds the preview's read, must paste nothing (PT-DISCARD), and Enter pressed at that moment must land its own load (PT-SUPERSEDE). No leg may make a synchronous card call on the interaction tier after boot (PT-TIER): the pattern's bytes must arrive through the channels."
scenario = "pattern_load"
markers = ["PT-SETUP", "PT-LISTED", "PT-LOAD", "PT-PREVIEW", "PT-DISCARD", "PT-SUPERSEDE", "PT-TIER"]
result = "PT-RESULT failures=0"
builds = ["golden-vt-render"]
