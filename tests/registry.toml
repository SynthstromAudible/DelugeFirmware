# Every test in the repository. `dbt test` reads this; tests/README.md's table is
# generated from it. Every entry must state what it gates -- a test that
# cannot say what regression it catches is one nobody can decide to delete.
#
# level:  unit        -- one function or module, against mocks or none
#         component   -- one component against a reference, a stress load or a fuzzer
#         integration -- the whole app, booted, driven end to end
# runner: ctest    -- configured, built and run from `source` into `tree`
#         cargo    -- a cargo test suite, run from `path`
#         scenario -- a golden_vt_render scenario, driven by its script
#         script   -- anything else, run from `path`
# status: gate          -- a standing regression gate; breakage is a real signal
#         investigative -- a rig for answering a question, run on demand
#         unavailable   -- cannot run here; NOT scheduled for deletion -- see
#                          this entry's comment for why and what would change it
# tier:   pr | nightly | manual -- cumulative: `dbt test --tier nightly` runs pr too

[[harness]]
name = "fs-differential"
path = "tests/component/differential/fs_differential"
level = "component"
runner = "cargo"
kind = "differential"
status = "gate"
gates = "embedded-fatfs must agree with the reference FAT implementation on every filesystem operation"
build = ["fixtures/mk_fixture.sh"]
run = ["cargo", "test"]
env = { SP0_FAT32 = "fixtures/fat32.img", SP0_FAT16 = "fixtures/fat16.img" }
requires = ["cargo", "mtools"]
tier = "pr"
runtime = "~1m"

