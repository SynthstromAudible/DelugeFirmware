gates = "Which structural edits to the containers the audio render walks are made while the render could preempt them. On the device the render preempts thread mode at any instruction, so an insert, erase, reorder, relink or reallocation of a clip's note rows, a row's notes, an automation node list, the song's clip arrays, an output's clip instances, the song's output list or a kit's drum list must run inside an AudioExcludedSection (libdeluge/system.h). Each such container reports every structural edit to a probe (src/deluge/util/structural_edit_probe.h) that counts those made outside a section. With playback on the internal clock, each leg makes one edit through the model's own entry point and reports CG-<LEG> unguarded=<n> kinds=<kind=n,...>: NOTEADD, NOTEDEL, ROWADD, ROWDEL, CLIPNEW, CLIPDEL, CLIPDUP, ARRANGE, AUTOMATE, DRUM, REPLACE, UNDO, BIGROW (a row inserted below 128 others, with CG-MASK its host wall time), ROWDRAG (the clip view's note-row drag), CLIPMOVE (the session view's clip drag), OUTPUTMOVE (the arranger's output drag) and QUANTIZE (a row's notes rotated in place). What the probe can see: edits made through the containers' mutators and the song and kit list splices that report to it. An edit that bypasses them -- a raw element swap, a reorder through operator[], a splice in some other file -- is invisible to it; the reorders that would (the three drags and quantize's rotation) go through reporting, sectioned mutators, and a grep of std::swap/rotate/sort and ->next/firstOutput/firstDrum writes found no other. All legs are required to read unguarded=0; the others are reported. The run fails on a missing leg line, a fixture that could not be built or a clock that never ran, or an edit that ends the process. Every golden run also prints GUARD-UNGUARDED total=<n> at exit when any unguarded edit was made."
